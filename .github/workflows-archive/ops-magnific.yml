# expires: 2026-09-17 — одноразовое поручение; по истечении срока перенести в .github/workflows-archive/ или продлить через PR.
# Ребрендинг Freepik → Magnific в данных Directus (scripts/rename-magnific.py).
# Запуск вручную: apply=false — dry-run (отчёт), apply=true — применить.
# Результат публикуется комментарием в журнал-issue #22.

name: ops-magnific

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true — применить; false — dry-run"
        required: true
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Copy script to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/rename-magnific.py"
          target: /tmp/ops-magnific
          strip_components: 1
          overwrite: true

      - name: Run rename on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APPLY
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            DIRECTUS_ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL 2>/dev/null | tr -d '\r' || true)
            DIRECTUS_ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD 2>/dev/null | tr -d '\r' || true)
            DIRECTUS_TOKEN=$(sed -n 's/^DIRECTUS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r' || true)
            export DIRECTUS_ADMIN_EMAIL DIRECTUS_ADMIN_PASSWORD DIRECTUS_TOKEN
            [ -n "$DIRECTUS_ADMIN_EMAIL" ] && echo "admin-creds: найдены" || echo "admin-creds: нет — статический токен"
            if [ "$APPLY" = "true" ]; then
              python3 /tmp/ops-magnific/rename-magnific.py --apply
            else
              python3 /tmp/ops-magnific/rename-magnific.py
            fi

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-magnific (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
