# Единая запись в журнал операций (issue #22) со статусом прогона.
#
# Аудит 03.09.2026: ~60 копий одного шага «Post to issue» печатали вывод
# основного шага под штатным заголовком независимо от того, упал он или
# нет, а половина без `if: always()` при падении молчала — и «тишина»
# читалась как «порядок». Здесь статус обязателен: заголовок несёт ✓ или ✗
# по `outcome` основного шага, а при неуспехе шаг завершается с ошибкой,
# чтобы прогон был красным.
#
# Использование (шаг основной работы имеет id: run):
#   - name: Post results to journal (issue #22)
#     if: always()
#     uses: ./.github/actions/journal-post
#     with:
#       title: "ops-currency-refresh"          # без «###», без времени
#       outcome: ${{ steps.run.outcome }}      # success | failure | cancelled | skipped
#       body: ${{ steps.run.outputs.stdout }}  # вывод; пусто — «(нет вывода)»
name: journal-post
description: Комментарий в журнал-issue с маркером статуса прогона

inputs:
  title:
    description: Заголовок записи (имя воркфлоу и режим)
    required: true
  outcome:
    description: Исход основного шага (steps.<id>.outcome)
    required: true
  body:
    description: Текст записи (обычно stdout основного шага)
    required: false
    default: ""
  issue:
    description: Номер журнал-issue
    required: false
    default: "22"
  fail-on-error:
    description: Завершить шаг с ошибкой, если исход не success
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        JP_TITLE: ${{ inputs.title }}
        JP_OUTCOME: ${{ inputs.outcome }}
        JP_BODY: ${{ inputs.body }}
        JP_ISSUE: ${{ inputs.issue }}
        JP_FAIL: ${{ inputs['fail-on-error'] }}
      with:
        script: |
          const outcome = process.env.JP_OUTCOME || 'unknown';
          const mark = outcome === 'success' ? '✓' : '✗';
          const body = (process.env.JP_BODY || '(нет вывода)').slice(0, 60000);
          const note = outcome === 'success' ? '' :
            `\nСтатус основного шага: **${outcome}** — вывод ниже может быть неполным.\n`;
          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: Number(process.env.JP_ISSUE),
            body: `### ${process.env.JP_TITLE} ${mark} · ${new Date().toISOString()}\n${note}\n\`\`\`\n${body}\n\`\`\``,
          });
          if (outcome !== 'success' && process.env.JP_FAIL === 'true') {
            core.setFailed(`Основной шаг завершился со статусом ${outcome} — подробности в issue #${process.env.JP_ISSUE}`);
          }
