# Переименование одной товарной позиции в прод-Directus по слагу.
# Пример: slug=adobe-photo, name="Adobe Photography".
# Результат — комментарий в журнал-issue #22.
name: ops-rename-product
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Слаг товара (или заполните sku)'
        required: false
      sku:
        description: 'Артикул товара — замена слагу'
        required: false
      name:
        description: 'Новое название'
        required: true
permissions:
  # checkout читает репозиторий токеном GITHUB_TOKEN: при явном permissions
  # без contents раннер получает «Repository not found» (прогон #204 ops-probe).
  contents: read
  issues: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Rename in Directus
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_SLUG: ${{ inputs.slug }}
          P_SKU: ${{ inputs.sku }}
          P_NAME: ${{ inputs.name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_SLUG,P_SKU,P_NAME
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL | tr -d '\r')
            ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD | tr -d '\r')
            export ADMIN_EMAIL ADMIN_PASSWORD
            python3 - <<'PYEOF'
            import json, os, urllib.request
            base = 'http://127.0.0.1:8055'
            def req(method, path, data=None, token=None):
                r = urllib.request.Request(base + path, method=method,
                    data=json.dumps(data).encode() if data is not None else None,
                    headers={'Content-Type': 'application/json',
                             **({'Authorization': f'Bearer {token}'} if token else {})})
                return json.load(urllib.request.urlopen(r))
            auth = req('POST', '/auth/login', {'email': os.environ['ADMIN_EMAIL'], 'password': os.environ['ADMIN_PASSWORD']})
            tok = auth['data']['access_token']
            # Адресовать позицию можно слагом или артикулом. Артикул нужен
            # там, где слаг не достать: журнал Actions маскирует слово
            # «deploy» звёздочками (docs/rules/prod-access.md), и слаги вроде
            # me-os-deployer-* из выгрузки приходят покалеченными. Артикул
            # в верхнем регистре под маскировку не попадает.
            slug, sku, name = os.environ.get('P_SLUG', ''), os.environ.get('P_SKU', ''), os.environ['P_NAME']
            slug, sku = slug.strip(), sku.strip()
            if not slug and not sku:
                print('не задан ни слаг, ни артикул'); raise SystemExit(1)
            if slug and sku:
                print('заданы и слаг, и артикул — оставьте что-то одно'); raise SystemExit(1)
            key, val = ('slug', slug) if slug else ('sku', sku)
            items = req('GET', f'/items/products?filter[{key}][_eq]={val}&fields=id,name,slug,sku', token=tok)['data']
            if not items:
                print(f'товар не найден по полю {key}: {val}'); raise SystemExit(1)
            if len(items) > 1:
                print(f'по полю {key} найдено {len(items)} позиций — уточните адресацию'); raise SystemExit(1)
            it = items[0]
            print(f"было: '{it['name']}' [slug: {it['slug']}] [sku: {it.get('sku') or '—'}]")
            req('PATCH', f"/items/products/{it['id']}", {'name': name}, token=tok)
            print(f"стало: '{name}'")
            PYEOF
      # Локальному action нужен репозиторий в рабочей копии. if: always() —
      # потому что шаг журнала тоже always(): без этого при падении основного
      # шага checkout пропускается, и запись в журнал снова не проходит.
      - name: Checkout for journal action
        if: always()
        uses: actions/checkout@v4
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-rename-product"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
