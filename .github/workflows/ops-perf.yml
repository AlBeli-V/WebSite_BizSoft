# Замер производительности прода с сервера: TTFB, размеры, заголовки
# сжатия/кэширования по ключевым URL. Только чтение, ничего не меняет.

name: ops-perf

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Measure prod TTFB and headers
        id: probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          script: |
            set -e
            probe() {
              url="$1"
              echo "── $url"
              curl -s -o /dev/null -w "  http=%{http_version} code=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B\n" \
                -H 'Accept-Encoding: gzip, br' "$url"
              curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip, br' "$url" \
                | grep -iE '^(content-encoding|cache-control|expires|content-type|server):' | sed 's/^/  /'
            }
            echo "== Страницы (SSR) =="
            probe https://biz-soft.pro/
            probe https://biz-soft.pro/catalog/ai
            probe https://biz-soft.pro/product/anthropic-team
            probe https://biz-soft.pro/catalog
            echo
            echo "== Статика =="
            CSS=$(curl -sf https://biz-soft.pro/ | grep -o '/_astro/[^"]*\.css' | head -1)
            [ -n "$CSS" ] && probe "https://biz-soft.pro$CSS"
            probe https://biz-soft.pro/robots.txt
            LOGO=$(ls /opt/bizsoft/astro-src/public/brand-logos 2>/dev/null | head -1)
            [ -n "$LOGO" ] && probe "https://biz-soft.pro/brand-logos/$LOGO"
            echo
            echo "== Повторный замер / (кэш соединения) =="
            for i in 1 2 3; do
              curl -s -o /dev/null -w "  run$i ttfb=%{time_starttransfer}s\n" -H 'Accept-Encoding: gzip' https://biz-soft.pro/
            done
            echo
            echo "== Ресурсы контейнеров =="
            cd /opt/bizsoft && docker stats --no-stream --format '  {{.Name}}: CPU {{.CPUPerc}} MEM {{.MemUsage}}'

      # Публикуем результаты комментарием в журнал-issue #22 — надёжный канал
      # чтения результатов (Actions job-logs API периодически недоступен интеграциям).
      - name: Post results to perf journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-perf"
          outcome: ${{ steps.probe.outcome }}
          body: ${{ steps.probe.outputs.stdout }}
