# Удаление ТЕСТОВЫХ записей CRM, оставленных прогонами форм (ops-form-test).
#
# Удаляет ТОЛЬКО записи, чьё поле компании содержит маркер «прогон форм»
# (так помечены все тестовые отправки) — сначала события сделок, затем
# сами сделки и записи quotes. Ничего другого не трогает; список
# удалённого — комментарием в issue #22.
name: ops-crm-cleanup-test
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Delete test records on server
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            # У сервисного токена нет права удаления — входим админом, как в
            # ops-magnific: учётные данные лежат в env directus-контейнера.
            ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL | tr -d '\r')
            ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD | tr -d '\r')
            export ADMIN_EMAIL ADMIN_PASSWORD
            python3 - <<'PYEOF'
            import json, os, urllib.parse, urllib.request

            base = 'http://localhost:8055'
            MARK = 'прогон форм'

            login = urllib.request.Request(base + '/auth/login', method='POST',
                headers={'Content-Type': 'application/json'},
                data=json.dumps({'email': os.environ['ADMIN_EMAIL'],
                                 'password': os.environ['ADMIN_PASSWORD']}).encode())
            with urllib.request.urlopen(login) as resp:
                token = json.load(resp)['data']['access_token']
            print('auth: admin login ok')

            def req(method, path, body=None):
                r = urllib.request.Request(base + path, method=method,
                    headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                    data=json.dumps(body).encode() if body is not None else None)
                with urllib.request.urlopen(r) as resp:
                    raw = resp.read()
                    return json.loads(raw) if raw else {}

            def find(coll, field):
                q = urllib.parse.urlencode({
                    f'filter[{field}][_contains]': MARK,
                    'fields': f'id,{field}', 'limit': '50'})
                return req('GET', f'/items/{coll}?{q}').get('data', [])

            leads = find('leads', 'company')
            print(f'тестовых сделок: {len(leads)}')
            for l in leads:
                q = urllib.parse.urlencode({'filter[lead][_eq]': l['id'], 'fields': 'id', 'limit': '100'})
                events = req('GET', f'/items/lead_events?{q}').get('data', [])
                for e in events:
                    req('DELETE', f'/items/lead_events/{e["id"]}')
                req('DELETE', f'/items/leads/{l["id"]}')
                print(f'  удалена сделка {l["id"]} «{l["company"]}» (+{len(events)} событий)')

            quotes = find('quotes', 'buyer_company')
            print(f'тестовых КП: {len(quotes)}')
            for qt in quotes:
                req('DELETE', f'/items/quotes/{qt["id"]}')
                print(f'  удалено КП {qt["id"]} «{qt["buyer_company"]}»')

            print('очистка завершена: удалялись только записи с маркером «прогон форм»')
            PYEOF

      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-crm-cleanup-test — удаление тестовых записей CRM"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
