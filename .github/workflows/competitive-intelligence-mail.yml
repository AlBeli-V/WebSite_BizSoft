# Ежедневное письмо конкурентной разведки (10:00 МСК).
#
# ОТДЕЛЬНЫЙ контур: это не триггер существующего SEO-письма и не его копия.
# Данные берутся из ветки competitive-data, тема и структура — свои
# (раздел 23 задания), маркер анти-дублей — свой.
#
# Логика режимов повторяет проверенный seo-report-email вместе с его
# выученными уроками: push отправляет только отчёт НОВЕЕ последнего
# отправленного (иначе повторный пуш переотправляет старое);
# сторожевой запуск шлёт честное уведомление о сбое вместо устаревшего
# письма — старый отчёт под видом свежего худший из возможных фолбэков.
#
# Правило «одно письмо на дату» с 03.09.2026 заменено на «письмо по
# последнему пушу дня» (решение руководителя). Причина: в тот день в
# competitive-data пушили два контура, первый занял суточный маркер в
# 08:51, и штатный прогон 09:20 МСК ушёл в skip — руководитель получил
# расчёт по неполному срезу Google (355 запросов вместо 379). Маркер
# теперь хранит дату, sha256 отправленного письма и счётчик отправок за
# эту дату: тот же текст повторно не уходит (защита от дублей 01.09
# сохранена), изменившийся — уходит с пометкой «Уточнённый расчёт» в
# теме, но не больше трёх писем за дату, чтобы серия пушей не устроила
# почтовый шторм.
# ВАЖНО: копия этого файла обязана лежать в ветке competitive-data.
# GitHub берёт определение workflow из той ветки, в которую пришёл push, а не
# из main. Пока копии в ветке данных не было, push отчёта не запускал отправку
# ни разу — письмо могло уйти только ручным запуском (01.09.2026). Меняя этот
# файл, тем же содержимым обнови копию в competitive-data, иначе push-триггер
# будет работать по устаревшей логике. Так же устроен seo-report-email.yml.
name: competitive-intelligence-mail

on:
  push:
    branches:
      - competitive-data
    paths:
      - "reports/competitive/*-email.html"
      - ".github/workflows/competitive-intelligence-mail.yml"
  schedule:
    # 07:40 UTC = 10:40 МСК — контроль: письмо за сегодня должно быть уже
    # отправлено. Запас в 80 минут от Routine (09:20 МСК) взят не с потолка:
    # расписания Actions и Routine дрейфуют — 31.08 базовый Routine с
    # расписанием 09:00 отработал в 09:26. Сторож, срабатывающий раньше, чем
    # закончился прогон, прислал бы ложное уведомление о сбое, и доверие к
    # уведомлениям исчезло бы за неделю.
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      subject_prefix:
        description: 'Префикс темы (например «ТЕСТ — »); при непустом префиксе маркер не пишется и тестовый прогон не блокирует штатную доставку'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: competitive-data

      - name: Choose mode
        id: guard
        run: |
          today=$(TZ=Europe/Moscow date +%F)
          latest=$(ls reports/competitive/*-email.html 2>/dev/null | sort | tail -1)
          date=$(basename "$latest" 2>/dev/null | sed 's/-email.html//')
          # Маркер: «<дата> <sha256 письма> <счётчик отправок за дату>».
          # Старый формат — одна дата без полей — читается как есть: хэш
          # пустой, и переотправка не срабатывает (миграция бесшумная).
          marker=$(cat reports/competitive/last-mailed.txt 2>/dev/null || echo "")
          mailed=$(printf '%s' "$marker" | awk '{print $1}')
          mailed_hash=$(printf '%s' "$marker" | awk '{print $2}')
          mailed_count=$(printf '%s' "$marker" | awk '{print $3+0}')
          noticed=$(cat reports/competitive/last-notice.txt 2>/dev/null || echo "")
          # Хэш берётся с обеих версий письма: текст и HTML собираются
          # раздельно, и правка только в одной — это уже другое письмо.
          hash=""
          if [ -n "$date" ]; then
            hash=$(cat "reports/competitive/$date-email.txt" \
                       "reports/competitive/$date-email.html" 2>/dev/null \
                   | sha256sum | cut -d' ' -f1)
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          mode=send
          resend=0
          count=1
          case "${{ github.event_name }}" in
            push)
              # ISO-даты сравниваются строково корректно.
              if [ -z "$date" ]; then
                mode=skip
              elif [ "$date" \> "$mailed" ]; then
                mode=send
              elif [ "$date" = "$mailed" ] && [ -n "$hash" ] \
                   && [ -n "$mailed_hash" ] && [ "$hash" != "$mailed_hash" ]; then
                # Тот же день, но расчёт изменился: уходит уточнение.
                # Потолок в три письма за дату — защита от почтового шторма,
                # если контур начнёт пушить пачкой.
                if [ "$mailed_count" -ge 3 ]; then
                  mode=skip
                  echo "::warning::За $date уже отправлено $mailed_count писем — уточнение не ушло"
                else
                  mode=send
                  resend=1
                  count=$((mailed_count + 1))
                fi
              else
                mode=skip
              fi
              ;;
            schedule)
              if [ "$date" = "$today" ]; then
                [ "$mailed" = "$today" ] && mode=skip
              else
                mode=notice
                [ "$noticed" = "$today" ] && mode=skip
              fi
              ;;
          esac
          [ -z "$date" ] && [ "$mode" = "send" ] && mode=notice
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "resend=$resend" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Режим: $mode (письмо: ${date:-нет}, сегодня: $today, уточнение: $resend)"

      - name: Quality gate
        # Гейты качества перед отправкой (раздел 24 задания). Письмо, не
        # прошедшее проверку, не уходит вовсе: лучше уведомление о сбое, чем
        # письмо с превышенным лимитом или без главного сигнала.
        if: steps.guard.outputs.mode == 'send'
        env:
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          date = os.environ['DATE']
          meta = json.loads(pathlib.Path(
              f'reports/competitive/{date}-email.json').read_text(encoding='utf-8'))
          problems = []
          if not meta.get('лимит_соблюдён'):
              problems.append(f"текст {meta['видимых_символов']} символов "
                              f"при лимите {meta['лимит_символов']}")
          if meta['текст'].count('Главный сигнал:') != 1:
              problems.append('главный сигнал не ровно один')
          if not meta.get('вердикт'):
              problems.append('вердикт не проставлен')
          for name in (f'{date}-email.html', f'{date}-email.txt'):
              if not os.path.exists(f'reports/competitive/{name}'):
                  problems.append(f'нет файла {name}')
          if problems:
              print('::error::Гейт качества не пройден: ' + '; '.join(problems))
              sys.exit(1)
          print(f"Гейт пройден: {meta['видимых_символов']} символов, "
                f"вердикт {meta['вердикт']}, зрелость {meta['зрелость_скоринга']}")
          PY

      - name: Send letter or failure notice
        if: steps.guard.outputs.mode != 'skip'
        env:
          SMTP_HOST: mail.hosting.reg.ru
          SMTP_PORT: "465"
          SMTP_USER: hello@biz-soft.pro
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: avbelyaev@biz-soft.pro
          MODE: ${{ steps.guard.outputs.mode }}
          TODAY: ${{ steps.guard.outputs.today }}
          DATE: ${{ steps.guard.outputs.date }}
          SUBJECT_PREFIX: ${{ inputs.subject_prefix || '' }}
          RESEND: ${{ steps.guard.outputs.resend }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::Repo-секрет SMTP_PASS не задан — письмо не отправлено."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formatdate

          mode, today = os.environ['MODE'], os.environ['TODAY']
          date, prefix = os.environ['DATE'], os.environ.get('SUBJECT_PREFIX', '')

          msg = EmailMessage()
          msg['From'] = f'BIZSoft Конкурентная разведка <{os.environ["SMTP_USER"]}>'
          msg['To'] = os.environ['MAIL_TO']
          msg['Date'] = formatdate(localtime=True)

          if mode == 'send':
              meta = json.loads(pathlib.Path(
                  f'reports/competitive/{date}-email.json').read_text(encoding='utf-8'))
              # Уточнение за уже отправленную дату помечается в теме: два
              # письма с одинаковым заголовком не дают понять, какое свежее.
              if os.environ.get('RESEND') == '1' and not prefix:
                  prefix = 'Уточнённый расчёт · '
              msg['Subject'] = prefix + meta['тема']
              msg.set_content(pathlib.Path(
                  f'reports/competitive/{date}-email.txt').read_text(encoding='utf-8'))
              msg.add_alternative(pathlib.Path(
                  f'reports/competitive/{date}-email.html').read_text(encoding='utf-8'),
                  subtype='html')
              print(f"Письмо за {date}: {meta['видимых_символов']} символов, "
                    f"вердикт {meta['вердикт']}")
          else:
              msg['Subject'] = (f'{prefix}Конкурентная разведка — '
                                f'сбор за {today} не выполнен')
              msg.set_content(
                  f'Письмо конкурентной разведки за {today} не собралось к '
                  'контрольному времени (10:00 МСК).\n\n'
                  f'Последнее собранное письмо — за {date or "нет ни одного"}.\n\n'
                  'Данные не потеряны: срезы выдачи лежат в ветке competitive-data,\n'
                  'письмо можно собрать задним числом после починки прогона.\n\n'
                  'Что смотреть: журнал операций — issue #22\n'
                  '(https://github.com/AlBeli-V/WebSite_BizSoft/issues/22),\n'
                  'прогоны — https://github.com/AlBeli-V/WebSite_BizSoft/actions.')
              print(f'Уведомление о сбое за {today}')

          host, port = os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT'])
          try:
              with smtplib.SMTP_SSL(host, port,
                                    context=ssl.create_default_context(),
                                    timeout=60) as sm:
                  sm.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                  sm.send_message(msg)
          except (smtplib.SMTPException, OSError) as e:
              print(f'465/SSL не сработал ({e}), пробую 587/STARTTLS')
              with smtplib.SMTP(host, 587, timeout=60) as sm:
                  sm.starttls(context=ssl.create_default_context())
                  sm.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                  sm.send_message(msg)
          print(f'Отправлено на {os.environ["MAIL_TO"]}')
          PY

      - name: Record marker
        # Тестовая отправка (с префиксом темы) маркер не пишет: она не должна
        # блокировать штатную доставку письма за ту же дату.
        if: steps.guard.outputs.mode != 'skip' && (inputs.subject_prefix || '') == ''
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          DATE: ${{ steps.guard.outputs.date }}
          TODAY: ${{ steps.guard.outputs.today }}
          HASH: ${{ steps.guard.outputs.hash }}
          COUNT: ${{ steps.guard.outputs.count }}
        run: |
          # Ставится в индекс ровно тот файл, который только что записан.
          # Раньше здесь было `git add last-mailed.txt last-notice.txt`: если
          # второго файла ещё не существует, git add отвергает весь вызов и не
          # ставит в индекс НИЧЕГО. Коммита не возникало, push сообщал
          # «Everything up-to-date», шаг завершался успехом — а маркер не
          # сохранялся. Защита от повторной отправки не работала ни разу:
          # 01.09.2026 руководитель получил два одинаковых письма подряд.
          if [ "$MODE" = "send" ]; then
            # Хэш и счётчик — вместе с датой: по ним следующий push решает,
            # уточнение это или тот же самый текст.
            echo "$DATE $HASH $COUNT" > reports/competitive/last-mailed.txt
            marker=reports/competitive/last-mailed.txt
            note="Письмо за $DATE отправлено (отправка $COUNT)"
          else
            echo "$TODAY" > reports/competitive/last-notice.txt
            marker=reports/competitive/last-notice.txt
            note="Уведомление о сбое за $TODAY отправлено"
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$marker"
          git diff --cached --quiet || git commit -q -m "$note"
          for attempt in 1 2 3; do
            if git push origin HEAD:competitive-data; then
              echo "Маркер сохранён: $marker"
              exit 0
            fi
            git pull --rebase -X ours origin competitive-data || true
            sleep $((attempt * 5))
          done
          # Молчаливая потеря маркера означает, что следующий push отправит то
          # же письмо ещё раз. Это ошибка, а не мелочь: шаг обязан упасть.
          echo "::error::Маркер $marker не сохранён за три попытки — следующая отправка будет дублем"
          exit 1
