# Выгрузка каталога «производитель — продукт» из прод-Directus
# (для подбора иконок к каждой товарной позиции).
# Результат — нумерованный список комментарием в журнал-issue #22.
name: ops-export-products
on: workflow_dispatch
permissions:
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Export from Directus
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          script: |
            set -e
            TOKEN=$(sed -n 's/^DIRECTUS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            python3 - "$TOKEN" <<'PYEOF'
            import json, sys, urllib.request
            token = sys.argv[1]
            # Поля закупки запрашиваются отдельным запросом с откатом: до
            # прогона ops-directus-schema колонок purchase_* в базе нет, и
            # Directus отвергает весь запрос с ними.
            base = "vendor,name,slug,sku,price,base_price_usd,base_price_eur,peg_currency,markup_coeff"
            def fetch(fields):
                url = ("http://localhost:8055/items/products"
                       f"?fields={fields}&limit=-1"
                       "&filter[status][_eq]=published&sort[]=vendor&sort[]=name")
                req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                return json.load(urllib.request.urlopen(req))["data"]
            try:
                rows = fetch(base + ",purchase_updated_at")
            except Exception:
                rows = fetch(base)
            print(f"TOTAL={len(rows)}")
            # Курс не нужен: подозрение на месячную закупку видно уже по
            # соотношению продажа₽ / (закупка_вал × 80): честная годовая
            # наценка даёт ~1.5-2.5, месячная закупка — за 10.
            no_buy, suspects = [], []
            for i, r in enumerate(rows, 1):
                v = (r.get("vendor") or "—").strip()
                price = r.get("price")
                price = "req" if price in (None, "", 0) else price
                buy = r.get("base_price_eur") if (r.get("peg_currency") == "EUR") else r.get("base_price_usd")
                buy = buy or r.get("base_price_usd") or r.get("base_price_eur")
                cur = "EUR" if (r.get("peg_currency") == "EUR" or (not r.get("base_price_usd") and r.get("base_price_eur"))) else "USD"
                upd = (r.get("purchase_updated_at") or "")[:10]
                note = ""
                if not buy:
                    note = "ЗАКУПКИ НЕТ"
                    no_buy.append(r.get("sku") or r["slug"])
                elif isinstance(price, (int, float)) and buy and price / (buy * 80) >= 6:
                    note = "ПОХОЖЕ НА МЕСЯЧНУЮ ЗАКУПКУ"
                    suspects.append(r.get("sku") or r["slug"])
                buy_s = f"{buy} {cur}" if buy else "—"
                print(f"{i}. {v} — {r['name']} [sku: {r.get('sku') or '—'}] "
                      f"[price: {price}] [закупка: {buy_s}]"
                      + (f" [от {upd}]" if upd else "") + (f"  ⚠ {note}" if note else ""))
            print()
            print(f"Без закупочной цены: {len(no_buy)}")
            for s in no_buy: print(f"  - {s}")
            print(f"Подозрение на месячную закупку при годовой продаже: {len(suspects)}")
            for s in suspects: print(f"  - {s}")
            PYEOF
      # Вывод больше лимита env-переменной процесса (Argument list too long) —
      # передаём через файл: интерполяция ${{ }} в run-шаге пишется в файл скрипта.
      - name: Save result to file
        run: |
          cat > /tmp/ops-export.txt <<'OPS_EXPORT_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_EXPORT_EOF
      - name: Post to issue
        uses: actions/github-script@v7
        with:
          script: |
            // лимит комментария 65536 — режем по строкам на части по ~55К
            const lines = require('fs').readFileSync('/tmp/ops-export.txt', 'utf8').split('\n');
            const parts = [];
            let cur = '';
            for (const l of lines) {
              if (cur.length + l.length > 55000) { parts.push(cur); cur = ''; }
              cur += l + '\n';
            }
            if (cur) parts.push(cur);
            for (let i = 0; i < parts.length; i++) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
                body: `### ops-export-products (${i + 1}/${parts.length})\n\n\`\`\`\n${parts[i]}\`\`\``,
              });
            }
