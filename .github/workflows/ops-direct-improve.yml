# expires: 2026-09-17 — одноразовое поручение; по истечении срока перенести в .github/workflows-archive/ или продлить через PR.
# Оздоровление кампании bs-test-2026-09 по поручению владельца 29.08.2026:
# убрать автотаргетинг, добавить минус-слова по фактам первого дня открутки,
# расшить фразовую семантику (кавычки сняты, охват защищают минусы).
# Обоснование — разбор ops-direct-stats в issue #22 и
# reports/marketing/direct-stats-review-2026-08-29.md.
#
# mode=dry-run — показать план, в API только чтение;
# mode=apply — применить изменения в кабинете.
name: ops-direct-improve
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать план; apply — применить"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Improve
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_improve.py "$MODE" 2>&1 | tee /tmp/direct-improve.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-improve.log ] || echo "(лог не создан)" > /tmp/direct-improve.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-improve.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-improve (mode=' + process.env.MODE + ') — оздоровление bs-test-2026-09\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
