# Отправка URL сайта в IndexNow (Яндекс + Bing) для быстрого переобхода.
# Ключ — публичный по протоколу IndexNow, файл ключа лежит в public/<key>.txt.
# Запуск вручную после значимых обновлений контента (или по расписанию при желании).
# Выполняется на сервере: берёт URL из живого sitemap.xml и шлёт пинги.

name: ops-indexnow

on:
  workflow_dispatch:

env:
  INDEXNOW_KEY: 39db688a6ed52c4a5ad2a210dc3435b2

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Submit sitemap URLs to IndexNow (server-side)
        uses: appleboy/ssh-action@v1
        env:
          KEY: ${{ env.INDEXNOW_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: KEY
          script: |
            set -e
            export KEY
            echo "== Проверка ключа на сайте =="
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/${KEY}.txt")
            echo "GET /${KEY}.txt → $code"
            if [ "$code" != "200" ]; then
              echo "!! файл ключа не отдаётся — сначала задеплойте public/${KEY}.txt"
              exit 1
            fi

            echo "== Собираю URL из sitemap =="
            curl -s http://127.0.0.1:3000/sitemap.xml -o /tmp/sitemap.xml
            python3 - <<'PY'
            import json, re, urllib.request

            key = __import__('os').environ['KEY']
            xml = open('/tmp/sitemap.xml', encoding='utf-8').read()
            urls = re.findall(r'<loc>(.*?)</loc>', xml)
            print(f'URL в sitemap: {len(urls)}')

            body = json.dumps({
                'host': 'biz-soft.pro',
                'key': key,
                'keyLocation': f'https://biz-soft.pro/{key}.txt',
                'urlList': urls[:10000],
            }).encode()

            for endpoint in ('https://yandex.com/indexnow', 'https://api.indexnow.org/indexnow'):
                req = urllib.request.Request(endpoint, data=body, method='POST')
                req.add_header('Content-Type', 'application/json; charset=utf-8')
                try:
                    with urllib.request.urlopen(req, timeout=30) as r:
                        print(f'{endpoint} → HTTP {r.status}')
                except Exception as e:
                    code = getattr(e, 'code', None)
                    # 200/202 — принято; 4xx — смотреть текст
                    print(f'{endpoint} → {code or e}')
            PY
            echo "== Готово =="
