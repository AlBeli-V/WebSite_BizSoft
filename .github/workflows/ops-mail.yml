# Настройка почтовых уведомлений о заявках (MANAGER_EMAIL) на сервере.
# Запуск вручную: apply=false — только диагностика (конфиг + логи);
# apply=true — установить MANAGER_EMAIL, пересоздать astro и отправить
# тестовую заявку (появится в Leads, её можно удалить).
# Секреты не печатаются (SMTP_PASS показывается как задан/не задан).

name: ops-mail

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true — применить; false — только диагностика"
        required: true
        default: "false"
      manager_email:
        description: "Куда слать уведомления о заявках"
        required: true
        default: "hello@biz-soft.pro"
      smtp_host:
        description: "SMTP-сервер (почта на reg.ru)"
        required: true
        default: "mail.hosting.reg.ru"
      smtp_port:
        description: "SMTP-порт (25 — без SSL/STARTTLS, 465 — SSL)"
        required: true
        default: "25"

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Diagnose / apply on server
        uses: appleboy/ssh-action@v1
        env:
          APPLY: ${{ inputs.apply }}
          NEW_EMAIL: ${{ inputs.manager_email }}
          SMTP_HOST_IN: ${{ inputs.smtp_host }}
          SMTP_PORT_IN: ${{ inputs.smtp_port }}
          # Пароль ящика (панель reg.ru) — задаётся как repo-секрет SMTP_PASS
          # (Settings → Secrets and variables → Actions). Если не задан — шаг его пропустит.
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APPLY,NEW_EMAIL,SMTP_HOST_IN,SMTP_PORT_IN,SMTP_PASS
          script: |
            set -e
            export APPLY NEW_EMAIL
            ENVF=/opt/bizsoft/astro.env

            echo "== Почтовая конфигурация (пароль скрыт) =="
            python3 - <<'PY'
            keys = ['SMTP_HOST', 'SMTP_PORT', 'SMTP_SECURE', 'SMTP_USER', 'SMTP_FROM', 'SMTP_FROM_SALES', 'MANAGER_EMAIL']
            env = {}
            for line in open('/opt/bizsoft/astro.env'):
                line = line.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue
                k, v = line.split('=', 1)
                env[k.strip()] = v.strip().strip('"')
            for k in keys:
                print(f'{k} = {env.get(k, "— не задан —")}')
            print('SMTP_PASS =', 'задан' if env.get('SMTP_PASS') else '— НЕ ЗАДАН —')
            PY

            echo
            echo "== Последние строки логов почты =="
            cd /opt/bizsoft
            docker compose logs --tail 500 astro 2>/dev/null | grep -iE 'mailer|lead mail|quote mail' | tail -25 || echo "(строк mailer в логах нет)"

            if [ "$APPLY" = "true" ]; then
              echo
              echo "== Применяю почтовый конфиг ($SMTP_HOST_IN:$SMTP_PORT_IN, адрес $NEW_EMAIL) =="
              cp "$ENVF" "$ENVF.bak-$(date +%Y%m%d-%H%M%S)"
              python3 - "$NEW_EMAIL" <<'PY'
            import os, re, sys
            email = sys.argv[1]
            envf = '/opt/bizsoft/astro.env'
            host = os.environ.get('SMTP_HOST_IN', 'mail.hosting.reg.ru')
            port = os.environ.get('SMTP_PORT_IN', '25')
            pairs = {
                'MANAGER_EMAIL': email,
                'SMTP_HOST': host,
                'SMTP_PORT': port,
                # 465 — implicit SSL; 25/587 — без SSL (nodemailer применит STARTTLS, если сервер умеет)
                'SMTP_SECURE': 'true' if port == '465' else 'false',
                'SMTP_USER': email,
                'SMTP_FROM': f'"BizSoft <{email}>"',
                'SMTP_FROM_SALES': f'"BizSoft <{email}>"',
            }
            sp = os.environ.get('SMTP_PASS', '')
            if sp:
                pairs['SMTP_PASS'] = sp
            lines = open(envf).read().splitlines()
            out, seen = [], set()
            for l in lines:
                m = re.match(r'^([A-Z_]+)=', l)
                if m and m.group(1) in pairs:
                    k = m.group(1)
                    out.append(f'{k}={pairs[k]}')
                    seen.add(k)
                else:
                    out.append(l)
            for k, v in pairs.items():
                if k not in seen:
                    out.append(f'{k}={v}')
            open(envf, 'w').write('\n'.join(out) + '\n')
            shown = {k: (v if k != 'SMTP_PASS' else '(записан, скрыт)') for k, v in pairs.items()}
            for k in sorted(shown):
                print(f'  {k} = {shown[k]}')
            if not sp:
                print('  SMTP_PASS = — секрет не задан, пропущен —')
            PY

              echo "-- пересоздаю astro (env_file подхватывается только при пересоздании) --"
              docker compose up -d --force-recreate astro
              code=000
              for i in $(seq 1 30); do
                code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
                [ "$code" = "200" ] && break
                sleep 2
              done
              echo "HTTP главной после рестарта: $code"

              if grep -q '^SMTP_PASS=.\+' "$ENVF"; then
                echo "-- тестовая заявка (source=ops-mail-test, можно удалить в Leads) --"
                curl -s -X POST http://127.0.0.1:3000/api/lead -H 'Content-Type: application/json' \
                  -d "{\"name\":\"Тест доставки почты\",\"company\":\"BizSoft (ops)\",\"email\":\"$NEW_EMAIL\",\"phone\":\"—\",\"message\":\"Тестовая заявка: проверка уведомлений на MANAGER_EMAIL после настройки. Можно удалить.\",\"consent\":true,\"source\":\"ops-mail-test\"}"
                echo
                sleep 5
                echo "-- лог отправки --"
                docker compose logs --tail 120 astro | grep -iE 'mailer|lead mail' | tail -10 || echo "(нет строк — смотрите полный лог)"
              else
                echo "-- тест пропущен: SMTP_PASS не задан (добавьте repo-секрет и перезапустите apply) --"
              fi
            fi
            echo "== Готово (apply=$APPLY) =="
