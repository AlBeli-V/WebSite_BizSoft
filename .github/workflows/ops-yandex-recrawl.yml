# Переобход страниц в Яндекс.Вебмастере по API (recrawl/queue).
# Токен: секрет YANDEX_WEBMASTER_TOKEN (то же имя, что у выгрузок Вебмастера в
# seo-data-collect; дубль YANDEX_OAUTH снят 03.09.2026), либо YANDEX_OAUTH= в
# /opt/bizsoft/astro.env на сервере.
# Значение токена в логи не печатается. Результат — комментарием в issue #22.
#
# Статус прогона отражает результат, а не факт запуска: без токена, при
# отказе API или отклонении хотя бы одного URL (квота, 4xx) прогон красный,
# а в заголовке записи журнала стоит ✗. Прежде и отсутствие токена, и HTTP
# 429 по каждому URL давали зелёный прогон и запись, читавшуюся как «переобход
# запрошен» (аудит 03.09.2026).

name: ops-yandex-recrawl

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL через запятую (полные https)"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  recrawl:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Send recrawl requests
        id: run
        # Отчёт в журнал должен попасть и при поломке; красный статус
        # возвращает отдельный шаг ниже.
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          URLS: ${{ inputs.urls }}
          YTOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: URLS,YTOKEN
          capture_stdout: true
          script: |
            set -e
            if [ -z "$YTOKEN" ]; then
              YTOKEN=$(sed -n 's/^YANDEX_OAUTH=//p' /opt/bizsoft/astro.env 2>/dev/null | tr -d '"\r' || true)
            fi
            if [ -z "$YTOKEN" ]; then
              echo "токен: НЕ НАЙДЕН (ни секрета YANDEX_WEBMASTER_TOKEN, ни YANDEX_OAUTH в astro.env)"
              echo "переобход не запрошен ни по одному URL"
              exit 1
            fi
            echo "токен: задан"
            export YTOKEN URLS
            python3 - <<'PY'
            import json, os, sys, urllib.request
            tok = os.environ['YTOKEN']
            def req(method, path, body=None):
                r = urllib.request.Request('https://api.webmaster.yandex.net/v4' + path,
                    data=json.dumps(body).encode() if body else None, method=method)
                r.add_header('Authorization', f'OAuth {tok}')
                r.add_header('Content-Type', 'application/json')
                try:
                    with urllib.request.urlopen(r, timeout=30) as resp:
                        return resp.status, json.loads(resp.read() or b'{}')
                except urllib.error.HTTPError as e:
                    return e.code, json.loads(e.read() or b'{}')
            st, u = req('GET', '/user')
            if st != 200:
                print(f'user: HTTP {st} {u} — переобход не запрошен'); sys.exit(1)
            uid = u['user_id']
            st, hs = req('GET', f'/user/{uid}/hosts')
            host = next((h['host_id'] for h in hs.get('hosts', []) if 'biz-soft.pro' in h['host_id'] and h['host_id'].startswith('https')), None)
            print(f'host_id: {host}')
            if not host:
                print('hosts:', [h['host_id'] for h in hs.get('hosts', [])])
                print('хост не найден — переобход не запрошен'); sys.exit(1)
            st, q = req('GET', f'/user/{uid}/hosts/{host}/recrawl/quota')
            print(f"квота: {q}")
            accepted, rejected = [], []
            for url in os.environ['URLS'].split(','):
                url = url.strip()
                if not url:
                    continue
                st, resp = req('POST', f'/user/{uid}/hosts/{host}/recrawl/queue', {'url': url})
                ok = st in (200, 201, 202) and resp.get('task_id')
                (accepted if ok else rejected).append(url)
                print(f'  {url} → HTTP {st} {"принято, task_id " + str(resp.get("task_id")) if ok else "ОТКЛОНЕНО: " + json.dumps(resp, ensure_ascii=False)}')
            print(f'итог: принято {len(accepted)}, отклонено {len(rejected)}')
            if rejected:
                print('отклонённые URL: ' + ', '.join(rejected))
                sys.exit(1)
            PY

      - name: Post results to journal (issue #22)
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.stdout }}
          RESULT: ${{ steps.run.outcome }}
        with:
          script: |
            const out = (process.env.OUT || '(нет вывода)').slice(0, 60000);
            const mark = process.env.RESULT === 'success' ? '✓' : '✗';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: `### ops-yandex-recrawl ${mark} · ` + new Date().toISOString() +
                (mark === '✗' ? '\nПереобход запрошен не полностью — см. вывод.' : '') +
                '\n```\n' + out + '\n```',
            });

      - name: Fail the run if it failed
        if: steps.run.outcome != 'success'
        run: |
          echo "Переобход запрошен не полностью — подробности в issue #22"
          exit 1
