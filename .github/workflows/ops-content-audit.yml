# Аудит текстового контента карточек в прод-Directus: полнота описаний и
# качество мета-тегов (пустые, обрывы «…», неверное написание бренда,
# длина title/description). Только чтение. Результат — в журнал-issue #22.
name: ops-content-audit
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Ограничить вендором (пусто — весь каталог)'
        required: false
permissions:
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Audit content
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_VENDOR: ${{ inputs.vendor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_VENDOR
          capture_stdout: true
          script: |
            set -e
            TOKEN=$(sed -n 's/^DIRECTUS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            export TOKEN
            python3 - <<'PYEOF'
            import json, os, urllib.parse, urllib.request
            token = os.environ['TOKEN']
            vendor = os.environ.get('P_VENDOR', '').strip()
            flt = {'status': {'_eq': 'published'}}
            if vendor:
                flt['vendor'] = {'_eq': vendor}
            url = ('http://localhost:8055/items/products?limit=-1&sort[]=vendor&sort[]=name'
                   '&fields=slug,name,vendor,sku,short_description,description,meta_title,meta_description'
                   f'&filter={urllib.parse.quote(json.dumps(flt))}')
            req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
            rows = json.load(urllib.request.urlopen(req))['data']
            print(f'товаров в выборке: {len(rows)}' + (f' (вендор {vendor})' if vendor else ''))

            def g(r, f):
                return (r.get(f) or '').strip()

            groups = {
                'meta_title: старое написание бренда «BizSoft»': lambda r: 'BizSoft' in g(r, 'meta_title'),
                'meta_title: пусто': lambda r: not g(r, 'meta_title'),
                'meta_title: длиннее 60 символов': lambda r: len(g(r, 'meta_title')) > 60,
                'meta_description: обрыв фразы (символ …)': lambda r: '…' in g(r, 'meta_description'),
                'meta_description: пусто': lambda r: not g(r, 'meta_description'),
                'meta_description: длиннее 160 символов': lambda r: len(g(r, 'meta_description')) > 160,
                'description: пусто': lambda r: not g(r, 'description'),
                'description: короче 500 символов': lambda r: 0 < len(g(r, 'description')) < 500,
                'short_description: пусто': lambda r: not g(r, 'short_description'),
            }
            # JB-плагины и личные лицензии не индексируются — считаем отдельно
            def noindex(r):
                s = (r.get('sku') or '').upper()
                return s.startswith('JB-PLG-') or (s.startswith('JB-') and s.endswith('-IND'))
            idx = [r for r in rows if not noindex(r)]
            print(f'из них индексируемых (без JB-PLG-* и *-IND): {len(idx)}\n')
            print('== Проблемы (только по индексируемым) ==')
            for name, test in groups.items():
                hits = [r for r in idx if test(r)]
                print(f'{name}: {len(hits)}')
                for r in hits[:6]:
                    print(f"   - {r['slug']}")
                if len(hits) > 6:
                    print(f'   … ещё {len(hits) - 6}')
            lens = sorted(len(g(r, 'description')) for r in idx)
            if lens:
                mid = lens[len(lens) // 2]
                print(f'\ndescription: медиана {mid} симв., минимум {lens[0]}, максимум {lens[-1]}')
            PYEOF
      - name: Save to file
        run: |
          cat > /tmp/ops-audit.txt <<'OPS_AUDIT_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_AUDIT_EOF
      - name: Post to issue
        uses: actions/github-script@v7
        with:
          script: |
            const out = require('fs').readFileSync('/tmp/ops-audit.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-content-audit\n\n```\n' + out + '\n```',
            });
