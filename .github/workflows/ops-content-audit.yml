# Аудит текстового контента карточек в прод-Directus: полнота описаний,
# качество мета-тегов (пустые, обрывы «…», неверное написание бренда,
# длина title/description) и дубли между карточками: по фактическому
# заголовку страницы (meta_title, а при пустом — name), meta_description,
# названию товара (витрина и фиды) и short_description (из него
# ops-fix-meta собирает meta_description). Только чтение, раз в неделю по
# расписанию. Результат — в журнал-issue #22.
name: ops-content-audit
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Ограничить вендором (пусто — весь каталог)'
        required: false
      full:
        description: 'true — печатать все группы дублей, а не первую десятку'
        required: false
        default: 'false'
  schedule:
    # понедельник 07:00 UTC = 10:00 МСК: еженедельная сверка каталога,
    # чтобы дубли не копились до находки Вебмастера
    - cron: '0 7 * * 1'
permissions:
  # checkout читает репозиторий токеном GITHUB_TOKEN: при явном permissions
  # без contents раннер получает «Repository not found» (прогон #204 ops-probe).
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Audit content
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_VENDOR: ${{ inputs.vendor }}
          P_FULL: ${{ inputs.full }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_VENDOR,P_FULL
          capture_stdout: true
          script: |
            set -e
            TOKEN=$(sed -n 's/^DIRECTUS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            export TOKEN
            python3 - <<'PYEOF'
            import json, os, re, urllib.parse, urllib.request
            token = os.environ['TOKEN']
            vendor = os.environ.get('P_VENDOR', '').strip()
            full = os.environ.get('P_FULL', '').strip().lower() == 'true'
            flt = {'status': {'_eq': 'published'}}
            if vendor:
                flt['vendor'] = {'_eq': vendor}
            url = ('http://localhost:8055/items/products?limit=-1&sort[]=vendor&sort[]=name'
                   '&fields=slug,name,vendor,sku,short_description,description,meta_title,meta_description'
                   f'&filter={urllib.parse.quote(json.dumps(flt))}')
            req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
            rows = json.load(urllib.request.urlopen(req))['data']
            print(f'товаров в выборке: {len(rows)}' + (f' (вендор {vendor})' if vendor else ''))

            def g(r, f):
                return (r.get(f) or '').strip()

            # Курс валюты в тексте («по курсу 80», «80 ₽ за доллар», «$1 = 80 ₽»)
            # и цена с периодом в валюте («$20/мес», «€15 в месяц», «$80 за место
            # в месяц»). Порог лицензирования без периода — не находка.
            STALE_MONEY = re.compile(
                r'курс[а-яё]{0,3}\s+\d'
                r'|\d+[\d\s.,]*\s*(?:₽|руб[а-яё.]*)\s*за\s*(?:1\s*)?(?:доллар|евро|\$|USD|EUR)'
                r'|(?:\$|€|USD|EUR)\s?1\s*[=≈]'
                r'|(?:\$|€)\s?\d+[\d.,]*\s*(?:/|за\s|в\s)\s*(?:мес|месяц|год|year|month|место|пользоват)'
                r'|(?:\$|€)\s?\d+[\d.,]*\s*/\s*(?:мес|мес\.|month|year)',
                re.IGNORECASE)

            groups = {
                'meta_title: старое написание бренда «BizSoft»': lambda r: 'BizSoft' in g(r, 'meta_title'),
                'meta_title: пусто': lambda r: not g(r, 'meta_title'),
                'meta_title: длиннее 60 символов': lambda r: len(g(r, 'meta_title')) > 60,
                'meta_description: обрыв фразы (символ …)': lambda r: '…' in g(r, 'meta_description'),
                'meta_description: пусто': lambda r: not g(r, 'meta_description'),
                'meta_description: длиннее 160 символов': lambda r: len(g(r, 'meta_description')) > 160,
                'description: пусто': lambda r: not g(r, 'description'),
                'description: короче 500 символов': lambda r: 0 < len(g(r, 'description')) < 500,
                'short_description: пусто': lambda r: not g(r, 'short_description'),
                # Текст с ценой, которая устаревает сама по себе. Рублёвая цена
                # считается штатно (курс ЦБ × коэффициент, ежедневная переоценка),
                # поэтому ни курс, ни цена «за месяц в долларах» в описании жить
                # не должны: через неделю они расходятся с витриной. Пороги
                # лицензирования вендора («доход до $100K») сюда не попадают —
                # проверяются только суммы с периодом и явные курсы.
                'текст: устаревающая цена или курс валюты': lambda r: bool(STALE_MONEY.search(
                    ' '.join(g(r, f) for f in ('short_description', 'description', 'meta_description')))),
            }
            # JB-плагины и личные лицензии не индексируются — считаем отдельно
            def noindex(r):
                # Тот же набор правил, что в productNoindex() (src/lib/catalog.ts):
                # плагины Marketplace, личные лицензии JetBrains и карточки
                # продления. Без -RENEWAL аудит считал продления индексируемыми
                # и показывал их как дубли первой покупки, хотя в поиск они
                # не идут вовсе.
                s = (r.get('sku') or '').upper()
                return (s.startswith('JB-PLG-')
                        or (s.startswith('JB-') and s.endswith('-IND'))
                        or s.endswith('-RENEWAL')
                        or re.search(r'-CREDITS-\d+$', s) is not None)
            idx = [r for r in rows if not noindex(r)]
            print(f'из них индексируемых (без JB-PLG-*, *-IND, *-RENEWAL и пакетов кредитов): {len(idx)}\n')
            print('== Проблемы (только по индексируемым) ==')
            for name, test in groups.items():
                hits = [r for r in idx if test(r)]
                print(f'{name}: {len(hits)}')
                for r in hits[:6]:
                    print(f"   - {r['slug']}")
                if len(hits) > 6:
                    print(f'   … ещё {len(hits) - 6}')
            # Одинаковые title/description на разных карточках Яндекс считает
            # дублями и снимает страницы с индексации. Заголовок страницы —
            # это meta_title, а при пустом meta_title — название товара
            # (src/pages/product/[slug].astro: meta_title || name), поэтому
            # дубли ищем по фактическому заголовку, иначе пары с пустой метой
            # остаются невидимыми для аудита.
            def effective_title(r):
                return g(r, 'meta_title') or g(r, 'name')

            print('\n== Дубли мета-тегов (только по индексируемым) ==')
            # name — то, что видит покупатель на витрине и что уходит в фиды;
            # short_description — источник, из которого ops-fix-meta собирает
            # meta_description, поэтому его дубли предсказывают будущие дубли меты.
            for f, value in (('заголовок страницы (meta_title или name)', effective_title),
                             ('meta_description', lambda r: g(r, 'meta_description')),
                             ('название товара (витрина и фиды)', lambda r: g(r, 'name')),
                             ('short_description (источник meta_description)',
                              lambda r: g(r, 'short_description'))):
                seen = {}
                for r in idx:
                    v = value(r)
                    if v:
                        seen.setdefault(v, []).append(r)
                dups = {v: rows_ for v, rows_ in seen.items() if len(rows_) > 1}
                print(f'{f}: групп дублей {len(dups)}')
                # По расписанию хватает первой десятки — отчёт читают глазами.
                # Разгребая долг партиями, нужен весь список: full=true.
                shown = sorted(dups.items(), key=lambda kv: -len(kv[1]))
                if not full:
                    shown = shown[:10]
                for v, rows_ in shown:
                    # откуда взят заголовок: своя мета или подставленное название
                    src = ''
                    if value is effective_title:
                        empty = sum(1 for r in rows_ if not g(r, 'meta_title'))
                        src = (' [meta_title пуст у всех, заголовок из name]' if empty == len(rows_)
                               else f' [meta_title пуст у {empty} из {len(rows_)}]' if empty else '')
                    slugs = ', '.join(sorted(r['slug'] for r in rows_))
                    print(f'   - «{v[:70]}» — {len(rows_)} шт.{src}: {slugs}')
                if len(dups) > len(shown):
                    print(f'   … ещё {len(dups) - len(shown)} групп')

            lens = sorted(len(g(r, 'description')) for r in idx)
            if lens:
                mid = lens[len(lens) // 2]
                print(f'\ndescription: медиана {mid} симв., минимум {lens[0]}, максимум {lens[-1]}')
            PYEOF
      - name: Save to file
        if: always()
        run: |
          cat > /tmp/ops-audit.txt <<'OPS_AUDIT_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_AUDIT_EOF
      # Локальному action нужен репозиторий в рабочей копии. if: always() —
      # потому что шаг журнала тоже always(): без этого при падении основного
      # шага checkout пропускается, и запись в журнал снова не проходит.
      - name: Checkout for journal action
        if: always()
        uses: actions/checkout@v4
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-content-audit"
          outcome: ${{ steps.run.outcome }}
          body-file: /tmp/ops-audit.txt
