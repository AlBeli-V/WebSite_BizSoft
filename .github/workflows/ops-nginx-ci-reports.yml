# Разовая настройка отдачи deep report конкурентной разведки.
#
# Добавляет в живой nginx-конфиг location из deploy/nginx-biz-soft.conf.template
# (блок ci-reports), создаёт каталог /opt/bizsoft/ci-reports и перечитывает
# nginx. Идемпотентно: повторный запуск ничего не дублирует — блок ищется по
# маркеру. Выкладку самих файлов делает ci-publish-report.
#
# Устройство повторяет ops-nginx-reports вместе с его выученным уроком: у
# деплой-пользователя нет беспарольного sudo, поэтому правка конфига и reload
# выполняются разово под root через одноразовый docker-контейнер (--rm,
# chroot /host) — sudoers не меняется, после выхода контейнера повышенных
# прав не остаётся.
name: ops-nginx-ci-reports
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false — только показать состояние; true — применить"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
  issues: write
jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Checkout
        # always() — шаг журнала ниже тоже always(): без этого при
        # падении раннего шага checkout пропустится и запись не пройдёт.
        if: always()
        uses: actions/checkout@v4

      - name: Extract location block from template
        run: |
          awk '/# Отчёты конкурентной разведки/,/^    }$/' \
            deploy/nginx-biz-soft.conf.template > /tmp/ci-reports-location.conf
          echo "--- блок из шаблона:"; cat /tmp/ci-reports-location.conf
          test -s /tmp/ci-reports-location.conf

      - name: Copy block to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: /tmp/ci-reports-location.conf
          target: /tmp
          strip_components: 1

      - name: Apply on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -e
            echo "== окружение =="
            SUDO=""
            sudo -n true 2>/dev/null && SUDO="sudo -n"
            DOCKER=НЕТ
            docker info >/dev/null 2>&1 && DOCKER=да
            echo "пользователь: $(id -un), sudo без пароля: $([ -n "$SUDO" ] && echo да || echo НЕТ), docker: $DOCKER"
            echo "== поиск конфига =="
            CONF=$(grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v "\.bak" | head -1)
            if [ -z "$CONF" ] && [ -n "$SUDO" ]; then
              CONF=$($SUDO grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v "\.bak" | head -1)
            fi
            echo "конфиг: ${CONF:-НЕ НАЙДЕН}"
            [ -n "$CONF" ]
            if grep -q "ci-reports" "$CONF" 2>/dev/null; then
              echo "блок ci-reports уже в конфиге"
            else
              echo "блока ci-reports в конфиге нет"
            fi
            mkdir -p /opt/bizsoft/ci-reports
            if [ "$P_APPLY" != "true" ]; then
              echo "apply=false: изменений не делалось"
              exit 0
            fi
            cat > /tmp/ci-nginx-apply.sh <<'ROOTEOF'
            #!/bin/bash
            set -e
            conf=$(grep -rl "server_name biz-soft.pro" /etc/nginx | grep -v '\.bak' | head -1)
            python3 - "$conf" <<'PYEOF'
            import sys, shutil
            conf = sys.argv[1]
            block = open('/tmp/ci-reports-location.conf', encoding='utf-8').read().rstrip('\n')
            text = open(conf, encoding='utf-8').read()
            if 'ci-reports' in text:
                print('блок уже есть — файл не меняю')
            else:
                shutil.copy2(conf, conf + '.bak-ci-reports')
                marker = '    location / {'
                assert marker in text, 'маркер "location / {" не найден'
                open(conf, 'w', encoding='utf-8').write(text.replace(marker, block + '\n\n' + marker, 1))
                print('блок вставлен, копия: ' + conf + '.bak-ci-reports')
            PYEOF
            nginx -t
            systemctl reload nginx 2>/dev/null && echo 'nginx перечитан (systemctl)' || { nginx -s reload && echo 'nginx перечитан (nginx -s reload)'; }
            grep -n "ci-" "$conf" | head -6
            ROOTEOF
            chmod +x /tmp/ci-nginx-apply.sh
            if [ -n "$SUDO" ]; then
              $SUDO /tmp/ci-nginx-apply.sh
            elif [ "$DOCKER" = "да" ]; then
              echo "sudo нет — разовое выполнение под root в одноразовом контейнере (--rm)"
              docker run --rm --pid=host -v /:/host alpine:3 chroot /host /bin/bash /tmp/ci-nginx-apply.sh
            else
              echo "ни sudo, ни docker — применить нечем"
              exit 1
            fi
            rm -f /tmp/ci-nginx-apply.sh /tmp/ci-reports-location.conf
            echo "временные файлы удалены; sudoers не менялся, контейнер удалён — повышенных прав не осталось"

      # Проверка снаружи: адрес отвечает и закрыт от индексации.
      # Отчёт мог быть ещё не выложен — тогда 404 при живом location тоже
      # результат: сам путь настроен, файлов пока нет.
      - name: Probe report URL
        if: inputs.apply == 'true'
        run: |
          URL="https://biz-soft.pro/ci-c98370a0ebe87d97/latest.html"
          echo "--- $URL"
          curl -sS -o /dev/null -D - --max-time 20 "$URL" || true
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL")
          echo "итоговый код: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "отчёт отдаётся"
          elif [ "$CODE" = "404" ]; then
            echo "location настроен, файлов пока нет — выложит ci-publish-report"
          else
            echo "::error::неожиданный код $CODE"
            exit 1
          fi

      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-nginx-ci-reports (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
