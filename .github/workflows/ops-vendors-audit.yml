# Аудит страницы /vendors на проде: какие вендоры отображаются без логотипа
# (буквенный фолбэк). Только чтение; результат — комментарием в issue #22.

name: ops-vendors-audit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Audit /vendors logos
        id: probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          script: |
            set -e
            curl -sf https://biz-soft.pro/vendors -o /tmp/vendors-audit.html
            python3 - <<'PY'
            import re
            html = open('/tmp/vendors-audit.html', encoding='utf-8').read()
            # Только реальные карточки-ссылки (не CSS-правила в <style>).
            cards = re.findall(r'<a [^>]*class="[^"]*v-card[^"]*"[^>]*>.*?</a>', html, re.S)
            missing, have = [], []
            for c in cards:
                m = re.search(r'<b[^>]*>([^<]+)</b>', c)
                name = m.group(1) if m else '?'
                (missing if 'v-letter' in c else have).append(name)
            print(f'всего карточек: {len(cards)}')
            print(f'с логотипом: {len(have)}')
            print(f'без логотипа ({len(missing)}): ' + (', '.join(missing) or '—'))
            magnific = [c for c in cards if '>Magnific<' in c]
            dual = magnific and 'freepik-logo' in magnific[0] and 'magnific-logo' in magnific[0]
            print('плитка Magnific: ' + ('есть, оба логотипа' if dual else ('есть, но без двойного лого' if magnific else 'НЕ НАЙДЕНА')))
            PY

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-vendors-audit"
          outcome: ${{ steps.probe.outcome }}
          body: ${{ steps.probe.outputs.stdout }}
