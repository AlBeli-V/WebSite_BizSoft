# Диагностика квоты Вордстата: один запрос, полный текст ответа сервиса.
# Нужна, чтобы знать реальный суточный лимит и время его восстановления.
# Запуск: вручную или пушем файла воркфлоу.

name: seo-wordstat-quota

on:
  push:
    branches:
      - claude/biz-soft-rating-tracking-5rf03g
    paths:
      - ".github/workflows/seo-wordstat-quota.yml"
      - "scripts/seo/wordstat_quota.py"
  workflow_dispatch:

jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/biz-soft-rating-tracking-5rf03g
      - run: pip install --quiet requests
      - name: Check quota
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: python3 scripts/seo/wordstat_quota.py
