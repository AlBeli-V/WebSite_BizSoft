# Wordstat Intelligence: обнаружение коммерческого спроса и приоритеты развития.
# Яндекс недоступен из среды мониторинга — сеть работает через раннер GitHub Actions.
#
# Ограничение сервиса — 100 запросов в час на облако, поэтому прогон берёт ровно
# один часовой слот и продолжает с того места на следующем часу. Расход и причина
# каждого вызова пишутся в журнал бюджета.
#
# Режимы: dry-run (без вызовов), pilot (потолок 500 ₽), daily (суточный прогон).

name: seo-wordstat

on:
  schedule:
    # Полный цикл раз в сутки: около 340 вызовов, 0,7 часа при квоте 500 в час.
    # Слот номинальный, а не единственный источник full — см. шаг Run research:
    # GitHub периодически пропускает конкретный cron-слот (инцидент 03.09.2026:
    # слот 01:20 UTC не выполнился, до 21:08 UTC full не запускался вовсе), и
    # режим для расписания выбирается по факту (есть ли marker-файл full за
    # сегодня по МСК), а не по совпадению со строкой этого cron.
    - cron: "20 1 * * *"
    # Добор четыре раза в сутки: продолжает цикл, если тот прервался, и
    # обновляет отчёт. Почасовым он был при квоте 100 в час, когда цикл не
    # помещался в одно окно; теперь помещается. Любой из этих прогонов сам
    # становится full, если полного цикла за сегодня ещё не было.
    - cron: "25 */6 * * *"
    # 02:35 UTC = 05:35 МСК — контрольный слот вместо прежней Routine
    # «Добивка Wordstat» (решение руководителя 03.09.2026): режим выбирается
    # по факту (см. Run research), поэтому пропущенный ночной full
    # закрывается здесь, до утреннего письма, а не в 09:25 МСК.
    - cron: "35 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-wordstat.yml"
      - "scripts/seo/wordstat/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим прогона"
        required: true
        default: "daily"
        type: choice
        options: [dry-run, full, pilot, daily, benchmark, payments, probe-dynamics, momentum, regions]
      max_calls:
        description: "Потолок вызовов за прогон"
        required: false
        default: "70"

permissions:
  contents: write

# Часовая квота одна на облако, а прогонов может быть несколько: ночной полный
# цикл идёт часами, а почасовой добор стартует каждые 60 минут. Без очереди они
# делят одно окно, ловят 429 и оба тормозят. Группа сериализует всё, что тратит
# квоту; проверка оплаты сети Wordstat не трогает и идёт параллельно.
concurrency:
  group: seo-wordstat-${{ (github.event_name == 'push'
         || inputs.mode == 'payments' || inputs.mode == 'dry-run')
         && 'offline' || 'api' }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # Код из main, данные — из ветки-хранилища seo-data. pull обязателен
      # до прогона: состояние лимитера, журнал бюджета и база семантики
      # живут между прогонами именно там.
      - name: Pull data branch
        run: bash scripts/seo/data_sync.sh pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Run research
        id: research
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          # Пуш кода проверяет план, но не тратит квоту: платный прогон запускается
          # только по расписанию или явным выбором режима. Иначе каждая правка
          # исходников отнимала бы часовой слот у запланированного исследования.
          INPUT_MODE: ${{ inputs.mode }}
          IS_PUSH: ${{ github.event_name == 'push' }}
          MAX_CALLS: ${{ inputs.max_calls || '70' }}
        run: |
          if [ -z "$WORDSTAT_API_KEY" ]; then
            echo "::error::Секрет WORDSTAT_API_KEY не задан — исследование пропущено."
            exit 1
          fi
          python3 scripts/seo/wordstat/run.py --dry-run

          # Режим для расписания решается по факту, а не по имени слота:
          # если marker-файла full за сегодня (МСК) ещё нет — этот прогон и
          # есть full, каким бы cron-слотом его ни разбудило; иначе — добор.
          # Так пропуск любого отдельного слота GitHub-планировщиком лечится
          # следующим же schedule-прогоном, а не ждёт сутки или подстраховку.
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$IS_PUSH" = "true" ]; then
            MODE=dry-run
          else
            TODAY_MSK=$(TZ='Europe/Moscow' date +%F)
            if [ -f "reports/seo/wordstat/${TODAY_MSK}-full-result.json" ]; then
              MODE=daily
            else
              MODE=full
            fi
          fi
          case "$MODE" in
            dry-run) echo "Только план, вызовы не выполнялись." ;;
            pilot)   python3 scripts/seo/wordstat/run.py --pilot --max-calls "$MAX_CALLS" ;;
            daily)   python3 scripts/seo/wordstat/run.py --daily --max-calls "$MAX_CALLS" ;;
            full)    python3 scripts/seo/wordstat/run.py --full --max-hours 4
                     python3 scripts/seo/wordstat/payment_check.py --limit 200 ;;
            benchmark) python3 scripts/seo/wordstat/benchmark.py ;;
            payments)  python3 scripts/seo/wordstat/payment_check.py --limit 200 ;;
            probe-dynamics) python3 scripts/seo/wordstat/probe_dynamics.py ;;
            momentum)  python3 scripts/seo/wordstat/momentum.py ;;
            regions)   python3 scripts/seo/wordstat/region_demand.py ;;
          esac
          # Сбой отчёта не прячется: данные прогона всё равно уходят в push
          # (шаг ниже), а прогон краснеет последним шагом.
          rc=0
          python3 scripts/seo/wordstat/report.py || rc=$?
          echo "report_rc=$rc" >> "$GITHUB_OUTPUT"

      # Momentum спроса (механика №19, «зелёный свет» 30.08.2026): помесячная
      # динамика коммерческого ядра, еженедельно по понедельникам.
      # ~300 фраз × 0,02 ₽ ≈ 6 ₽; кэш TTL динамики гасит повторы.
      # Идемпотентно по файлу дня и в ЛЮБОМ schedule-прогоне: привязка к
      # конкретному слоту не работает — 31.08 планировщик GitHub ночной слот
      # просто не запустил, и понедельничный замер пропал бы целиком.
      - name: Demand momentum (weekly, Mon)
        id: momentum
        if: github.event_name == 'schedule'
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: |
          if [ "$(TZ='Europe/Moscow' date +%u)" != "1" ]; then
            echo "не понедельник — momentum пропущен"
          elif [ -f "reports/seo/wordstat/momentum-$(TZ='Europe/Moscow' date +%F).json" ]; then
            echo "momentum за сегодня уже собран"
          else
            python3 scripts/seo/wordstat/momentum.py || echo "momentum_rc=$?" >> "$GITHUB_OUTPUT"
          fi

      # Региональная карта спроса: 1-го числа, ≤50 фраз × 0,05 ₽ ≈ 2,5 ₽.
      # Та же идемпотентность по файлу месяца.
      - name: Regional demand (monthly, 1st)
        id: regions
        if: github.event_name == 'schedule'
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: |
          if [ "$(TZ='Europe/Moscow' date +%d)" != "01" ]; then
            echo "не первое число — регионы пропущены"
          elif [ -f "reports/seo/wordstat/region-demand-$(TZ='Europe/Moscow' date +%Y-%m).json" ]; then
            echo "регионы за месяц уже собраны"
          else
            python3 scripts/seo/wordstat/region_demand.py || echo "regions_rc=$?" >> "$GITHUB_OUTPUT"
          fi

      - name: Push results
        run: |
          bash scripts/seo/data_sync.sh push "Wordstat Intelligence: прогон $(date -u +%F' '%H:%M)" "reports/seo/wordstat"

      # Данные уже в хранилище; теперь честный статус прогона: любой из
      # шагов отчёта, momentum или регионов, вернувший ошибку, красит прогон.
      - name: Fail if a report step failed
        if: steps.research.outputs.report_rc != '0' || steps.momentum.outputs.momentum_rc != '' || steps.regions.outputs.regions_rc != ''
        run: |
          echo "::error::report_rc=${{ steps.research.outputs.report_rc }} momentum_rc=${{ steps.momentum.outputs.momentum_rc }} regions_rc=${{ steps.regions.outputs.regions_rc }}"
          exit 1
