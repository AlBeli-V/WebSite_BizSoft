# Проверка доступа к кабинету Яндекс.Директа: только чтение.
#
# Зачем: перед подготовкой рекламных кампаний нужно убедиться, что токен в
# секретах репозитория действительно даёт доступ к API Директа (руководитель
# перевыпустил токен 28.08). Workflow перебирает вероятные имена секретов,
# для каждого непустого делает два read-only запроса (Clients.get и
# Campaigns.get) и публикует итог в журнал issue #22.
#
# Ничего не создаёт, не меняет и не удаляет ни в кабинете, ни на проде.
# Значения токенов в лог не попадают — только имя секрета и результат.
name: ops-direct-check
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Direct API access
        id: run
        env:
          T_YANDEX_OAUTH: ${{ secrets.YANDEX_OAUTH }}
          T_DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          T_YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          T_WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: |
          set -u
          OUT=direct-check.txt
          : > "$OUT"
          probe() {  # $1 = имя секрета, $2 = токен
            name="$1"; token="$2"
            if [ -z "$token" ]; then
              echo "- $name: секрет пуст или не задан" >> "$OUT"
              return
            fi
            clients=$(curl -sS --max-time 30 https://api.direct.yandex.com/json/v5/clients \
              -H "Authorization: Bearer $token" -H "Accept-Language: ru" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{"method":"get","params":{"FieldNames":["Login","ClientId","Currency"]}}' || echo '{"curl":"error"}')
            camps=$(curl -sS --max-time 30 https://api.direct.yandex.com/json/v5/campaigns \
              -H "Authorization: Bearer $token" -H "Accept-Language: ru" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{"method":"get","params":{"SelectionCriteria":{},"FieldNames":["Id","Name","State","Status","Type"]}}' || echo '{"curl":"error"}')
            CLIENTS_JSON="$clients" CAMPS_JSON="$camps" NAME="$name" python3 - >> "$OUT" <<'PYEOF'
          import json, os
          name = os.environ["NAME"]
          def parse(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return {"error": {"error_string": "ответ не разобран", "error_detail": raw[:200]}}
          cl, ca = parse(os.environ["CLIENTS_JSON"]), parse(os.environ["CAMPS_JSON"])
          def err(d):
              e = d.get("error")
              return f"код {e.get('error_code')}: {e.get('error_string')} — {e.get('error_detail')}" if e else None
          if err(cl):
              print(f"- {name}: ДОСТУПА НЕТ ({err(cl)})")
          else:
              info = (cl.get("result", {}).get("Clients") or [{}])[0]
              login, cur = info.get("Login", "?"), info.get("Currency", "?")
              if err(ca):
                  print(f"- {name}: клиент {login} ({cur}) виден, но кампании не читаются ({err(ca)})")
              else:
                  camps = ca.get("result", {}).get("Campaigns") or []
                  print(f"- {name}: ДОСТУП ЕСТЬ — кабинет {login}, валюта {cur}, кампаний: {len(camps)}")
                  for c in camps[:10]:
                      print(f"    - {c.get('Id')} «{c.get('Name')}» [{c.get('Type')}] {c.get('State')}/{c.get('Status')}")
          PYEOF
          }
          echo "Проверка $(date -u +'%Y-%m-%d %H:%M') UTC, только чтение (Clients.get, Campaigns.get):" >> "$OUT"
          probe YANDEX_OAUTH        "$T_YANDEX_OAUTH"
          probe DIRECT_TOKEN        "$T_DIRECT_TOKEN"
          probe YANDEX_DIRECT_TOKEN "$T_YANDEX_DIRECT_TOKEN"
          probe WORDSTAT_API_KEY    "$T_WORDSTAT_API_KEY"
          cat "$OUT"
          {
            echo 'result<<EOF'
            cat "$OUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-check — доступ к кабинету Яндекс.Директа\n\n'
                + (process.env.OUT || '(нет вывода)').slice(0, 20000)
                + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
