# Создание тестовой кампании Яндекс.Директа из спецификации round1-spec.json
# (ветка seo-data, reports/seo/ppc/). Запуск кампании разрешён прямым
# поручением владельца 28.08.2026; повторные изменения — только по новому
# подтверждению. Скрипт защищён от дублей: существующая кампания с тем же
# именем останавливает выполнение.
#
# mode=dry-run — собрать payload'ы и проверить лимиты, записи в API нет;
# mode=apply — создать кампанию, группы, фразы, объявления, корректировки
# и отправить объявления на модерацию.
name: ops-direct-apply
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — только показать; apply — создать кампанию"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Fetch spec from seo-data
        run: |
          git fetch --depth=1 origin seo-data
          git show origin/seo-data:reports/seo/ppc/round1-spec.json > /tmp/round1-spec.json
          python3 -c "import json; s=json.load(open('/tmp/round1-spec.json')); print('спецификация:', s['spec_version'], s['date'], '-', s['campaign']['name'])"

      - name: Apply
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_apply.py /tmp/round1-spec.json "$MODE" 2>&1 | tee /tmp/direct-apply.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-apply.log ] || echo "(лог не создан)" > /tmp/direct-apply.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const log = require('fs').readFileSync('/tmp/direct-apply.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-apply (mode=' + process.env.MODE + ')\n\n```\n'
                + log.slice(0, 20000) + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
