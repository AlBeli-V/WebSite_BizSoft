# Проверка внешней публикации: как её видят читатель и поисковый робот.
#
# Зачем воркфлоу, а не запуск из сессии: площадки внешних публикаций
# (dzen.ru, vc.ru, spark.ru) закрыты egress-политикой сессии ассистента, а их
# страницы рисует JavaScript — статический curl отдаёт пустой каркас. Раннер
# GitHub имеет полный доступ и Playwright, как в ops-me-crawl.
#
# Снимает заголовок, описание, meta robots, canonical, объём видимого текста,
# число заголовков и — главное — все ссылки на biz-soft.pro с атрибутом rel:
# закрыта ссылка nofollow или нет, решает, работает она на ссылочный профиль
# или только на переходы.
#
# Результат — комментарий в журнал-issue #22.

name: ops-external-check

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Адрес публикации (полный https)'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Check publication
        env:
          URL: ${{ inputs.url }}
        run: node scripts/marketing/check-external-publication.mjs

      - name: Report to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 22 --repo "${{ github.repository }}" --body-file external-check.md

      - uses: actions/upload-artifact@v4
        with:
          name: external-check
          path: |
            external-check.json
            external-check.md
