# Сторож утренних контуров: запускает ежедневный конвейер, разведку и
# понедельничный комитет тогда, когда наступило нужное время, а не когда
# до слота добрался планировщик.
#
# Зачем. Замер 04–05.09.2026 показал: cron-слоты этого репозитория стартуют в
# среднем на 4–5 часов позже назначенного (слот 06:35 UTC → прогон 11:39 UTC;
# 07:05 → 12:01; 03:07 → 07:52). Утреннее письмо из-за этого приходило к обеду.
# Задержка одинакова для любого часа, поэтому перенос слота не помогает.
#
# Решение руководителя 05.09.2026 — «будильник внутри Actions». Ждать внутри
# job нельзя: репозиторий приватный, ожидание тарифицируется поминутно, а сон
# до утра стоил бы около 8000 минут в месяц. Поэтому сторож просыпается
# каждый час в окне ночь–утро, тратит секунды и сам решает, пора ли. При любой
# задержке планировщика один из часовых слотов попадёт в окно 06–13 МСК.
#
# Расписание в самих контурах оставлено страховкой: если сторож не сработает,
# конвейер всё равно стартует по своему слоту, пусть и с задержкой. Дубля
# письма быть не может — его блокирует маркер last-mailed.txt.
name: seo-morning-gate

on:
  schedule:
    # Каждый час с 22:00 до 09:00 UTC. Ночные слоты нужны потому, что при
    # задержке в 4–5 часов именно они попадают в утреннее окно МСК.
    - cron: "3 22-23,0-9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: seo-morning-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          git fetch --depth=1 origin seo-data --quiet
          mailed=$(git show origin/seo-data:reports/seo/intelligence/last-mailed.txt 2>/dev/null || echo "")
          verdict=$(bash scripts/ops/morning_gate.sh \
            "$(TZ=Europe/Moscow date +%H)" "$(TZ=Europe/Moscow date +%F)" "$mailed")
          echo "$verdict"
          case "$verdict" in
            run:*) echo "run=yes" >> "$GITHUB_OUTPUT" ;;
            *)     echo "run=no"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Контуры запускаются без ожидания: сторож своё дело сделал, а
      # следить за прогонами — задача самих контуров и журнала issue #22.
      - name: Start daily report
        if: steps.decide.outputs.run == 'yes'
        run: bash scripts/ops/gh_dispatch_wait.sh seo-daily-report.yml --ref main --no-wait

      - name: Start competitive intelligence
        if: steps.decide.outputs.run == 'yes'
        run: bash scripts/ops/gh_dispatch_wait.sh competitive-intelligence-daily.yml --ref main --no-wait

      # Комитет — только по понедельникам, и у него свой маркер отправки.
      # 07.09.2026 оба его cron-слота (09:10 и 09:50 МСК) планировщик
      # пропустил, а сторож тогда покрывал лишь два ежедневных контура —
      # письма решений за неделю не было вовсе. Окно и защита от повтора те
      # же, что у ежедневных: morning_gate.sh сверяет час по МСК и маркер.
      - name: Decide committee
        id: committee
        run: |
          if [ "$(TZ=Europe/Moscow date +%u)" != "1" ]; then
            echo "skip: не понедельник — комитет не собирается"
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mailed=$(git show origin/seo-data:reports/seo/intelligence/last-committee-mailed.txt 2>/dev/null || echo "")
          verdict=$(bash scripts/ops/morning_gate.sh \
            "$(TZ=Europe/Moscow date +%H)" "$(TZ=Europe/Moscow date +%F)" "$mailed")
          echo "$verdict"
          case "$verdict" in
            run:*) echo "run=yes" >> "$GITHUB_OUTPUT" ;;
            *)     echo "run=no"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Start growth committee
        if: steps.committee.outputs.run == 'yes'
        run: bash scripts/ops/gh_dispatch_wait.sh seo-committee-build.yml --ref main --no-wait
