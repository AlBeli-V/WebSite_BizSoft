# Отправка ежедневного письма BIZSoft Growth Intelligence (V4) на почту
# после пуша отчёта в ветку-хранилище seo-data. Отправитель — ящик hello@biz-soft.pro
# (SMTP reg.ru, 465/SSL), пароль — repo-секрет SMTP_PASS (тот же, что в ops-mail).
# Ручной запуск: workflow_dispatch (шлёт последний по дате отчёт).
#
# Фолбэка на письма прежних поколений (v3/v2) больше нет: они не генерируются
# с 19.08.2026, и их отправка выдавала бы недельной давности данные за свежие.
# Вместо этого сторожевой запуск по расписанию: если к контрольному времени
# письма за сегодня нет — уходит короткое уведомление о сбое сборки.

name: seo-report-email

on:
  push:
    branches:
      - seo-data
    paths:
      - "reports/seo/intelligence/*-v4-email.html"
      - ".github/workflows/seo-report-email.yml"
  schedule:
    # 07:00 UTC = 10:00 МСК — контроль: письмо за сегодня должно быть уже
    # отправлено (сбор в 05:40 МСК, сборка письма — утренним конвейером).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      subject_prefix:
        description: 'Префикс темы (например «ТЕСТ — »); при непустом префиксе маркер отправки не пишется — тестовый прогон не блокирует штатную доставку'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-data

      # Режим запуска: send | notice | skip.
      #
      # Одно письмо на одну дату отчёта: повторный push тех же файлов (гонка
      # прогонов, ручной перезапуск) без маркера last-mailed отправлял то же
      # письмо ещё раз. Ручной workflow_dispatch маркер игнорирует — явная
      # переотправка остаётся возможной. Уведомление о сбое тоже одно на дату
      # (маркер last-notice): сторожевой запуск раз в сутки.
      - name: Choose mode
        id: guard
        run: |
          today=$(TZ=Europe/Moscow date +%F)
          latest=$(ls reports/seo/intelligence/*-v4-email.html 2>/dev/null | sort | tail -1)
          date=$(basename "$latest" 2>/dev/null | sed 's/-v4-email.html//')
          mailed=$(cat reports/seo/intelligence/last-mailed.txt 2>/dev/null || echo "")
          noticed=$(cat reports/seo/intelligence/last-notice.txt 2>/dev/null || echo "")
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          mode=send
          case "${{ github.event_name }}" in
            push)
              [ -n "$date" ] && [ "$date" = "$mailed" ] && mode=skip
              ;;
            schedule)
              if [ "$date" = "$today" ]; then
                # Письмо за сегодня собрано; если уже и отправлено — тихий выход.
                [ "$mailed" = "$today" ] && mode=skip
              else
                # Письма за сегодня нет к контрольному времени — сбой сборки.
                mode=notice
                [ "$noticed" = "$today" ] && mode=skip
              fi
              ;;
          esac
          [ -z "$date" ] && [ "$mode" = "send" ] && mode=notice
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Режим: $mode (отчёт: ${date:-нет}, сегодня: $today)"

      - name: Send report or failure notice
        if: steps.guard.outputs.mode != 'skip'
        env:
          SMTP_HOST: mail.hosting.reg.ru
          SMTP_PORT: "465"
          SMTP_USER: hello@biz-soft.pro
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: avbelyaev@biz-soft.pro
          MODE: ${{ steps.guard.outputs.mode }}
          TODAY: ${{ steps.guard.outputs.today }}
          SUBJECT_PREFIX: ${{ inputs.subject_prefix || '' }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::Repo-секрет SMTP_PASS не задан (Settings → Secrets and variables → Actions) — письмо не отправлено."
            exit 1
          fi
          python3 - <<'PY'
          import glob, os, smtplib, ssl, pathlib, re
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          mode = os.environ['MODE']
          today = os.environ['TODAY']
          prefix = os.environ.get('SUBJECT_PREFIX', '')
          v4 = sorted(glob.glob('reports/seo/intelligence/*-v4-email.html'))

          msg = EmailMessage()
          msg['From'] = f'BIZSoft SEO-мониторинг <{os.environ["SMTP_USER"]}>'
          msg['To'] = os.environ['MAIL_TO']
          msg['Date'] = formatdate(localtime=True)

          if mode == 'send':
              # V4: письмо «Executive Command Center» с PNG-вложениями (CID).
              if not v4:
                  raise SystemExit('Нет файлов отчётов V4')
              path = v4[-1]
              date = os.path.basename(path).replace('-v4-email.html', '')
              html = pathlib.Path(path).read_text(encoding='utf-8')
              plain = pathlib.Path(
                  f'reports/seo/intelligence/{date}-v4.txt').read_text(encoding='utf-8')
              msg['Subject'] = f'{prefix}BIZSoft Growth Intelligence — {date}'
              msg.set_content(plain)
              # подменяем cid:chart-* на реальные Content-ID и прикрепляем PNG
              charts = {}
              for cid_key in sorted(set(re.findall(r'cid:(chart-[a-z-]+)', html))):
                  png = f'reports/seo/intelligence/charts/{date}-{cid_key.replace("chart-", "")}.png'
                  if not os.path.exists(png):
                      continue
                  real = make_msgid(domain='biz-soft.pro')
                  html = html.replace(f'cid:{cid_key}', f'cid:{real[1:-1]}')
                  charts[real] = png
              msg.add_alternative(html, subtype='html')
              part = msg.get_payload()[-1]
              for real, png in charts.items():
                  part.add_related(pathlib.Path(png).read_bytes(), 'image', 'png',
                                   cid=real, filename=os.path.basename(png),
                                   disposition='inline')
              print(f'V4: {path}, вложений {len(charts)}')
          else:
              # Сбой сборки: честное уведомление вместо устаревшего письма.
              # Старый отчёт под видом свежего — худший из возможных фолбэков.
              last = (os.path.basename(v4[-1]).replace('-v4-email.html', '')
                      if v4 else 'нет ни одного')
              msg['Subject'] = f'{prefix}BIZSoft Growth Intelligence — сбой сборки за {today}'
              msg.set_content(
                  f'Отчёт за {today} не собрался к контрольному времени (10:00 МСК).\n'
                  f'Последнее успешное письмо — за {last}.\n\n'
                  'Показатели дня не потеряны: сырые выгрузки лежат в ветке seo-data,\n'
                  'отчёт можно собрать задним числом после починки конвейера.\n\n'
                  'Что смотреть: журнал операций — issue #22\n'
                  '(https://github.com/AlBeli-V/WebSite_BizSoft/issues/22),\n'
                  'прогоны — https://github.com/AlBeli-V/WebSite_BizSoft/actions.')
              print(f'Уведомление о сбое за {today} (последний отчёт: {last})')

          host, port = os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT'])
          try:
              with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=60) as sm:
                  sm.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                  sm.send_message(msg)
          except (smtplib.SMTPException, OSError) as e:
              print(f'465/SSL не сработал ({e}), пробую 587/STARTTLS')
              with smtplib.SMTP(host, 587, timeout=60) as sm:
                  sm.starttls(context=ssl.create_default_context())
                  sm.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
                  sm.send_message(msg)
          print(f'Письмо отправлено на {os.environ["MAIL_TO"]}')
          PY

      - name: Record marker
        # Тестовая отправка (с префиксом темы) маркер не пишет: она не должна
        # блокировать штатную доставку письма за ту же дату.
        if: steps.guard.outputs.mode != 'skip' && (inputs.subject_prefix || '') == ''
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          if [ "${{ steps.guard.outputs.mode }}" = "send" ]; then
            echo "${{ steps.guard.outputs.date }}" > reports/seo/intelligence/last-mailed.txt
            git add reports/seo/intelligence/last-mailed.txt
            note="Письмо за ${{ steps.guard.outputs.date }} отправлено"
          else
            echo "${{ steps.guard.outputs.today }}" > reports/seo/intelligence/last-notice.txt
            git add reports/seo/intelligence/last-notice.txt
            note="Уведомление о сбое за ${{ steps.guard.outputs.today }} отправлено"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$note"
          for i in 1 2 3; do
            git pull --rebase origin seo-data && git push origin HEAD:seo-data && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Маркер отправки не записан — возможна повторная отправка при следующем запуске."
