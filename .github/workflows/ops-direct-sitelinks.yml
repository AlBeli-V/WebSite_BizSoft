# expires: 2026-09-17 — одноразовое поручение; по истечении срока перенести в .github/workflows-archive/ или продлить через PR.
# Эксперимент «быстрые ссылки» для bs-test-2026-09 (поручение владельца
# 31.08.2026): один B2B-набор из четырёх ссылок (оплата по счёту, договор
# и ЭДО, расчёт стоимости, контакты) привязывается ко всем объявлениям
# кампании. Гипотеза, измерение и критерии решения —
# reports/marketing/direct-sitelinks-experiment-2026-08-31.md.
#
# ВНИМАНИЕ: apply отправляет объявления на перемодерацию — запускать вне
# окна показов (после 19:00 МСК или в выходные).
#
# mode=dry-run — показать набор и план, в API только чтение;
# mode=apply — создать набор и привязать к объявлениям;
# mode=rollback — отвязать наборы (откат эксперимента).
name: ops-direct-sitelinks
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать план; apply — привязать; rollback — отвязать"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply", "rollback"]
permissions:
  contents: read
  issues: write
jobs:
  sitelinks:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Sitelinks
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_sitelinks.py "$MODE" 2>&1 | tee /tmp/direct-sitelinks.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-sitelinks.log ] || echo "(лог не создан)" > /tmp/direct-sitelinks.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-sitelinks.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-sitelinks (mode=' + process.env.MODE + ') — быстрые ссылки bs-test-2026-09\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
