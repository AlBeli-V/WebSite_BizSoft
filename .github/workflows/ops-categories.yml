# Категории каталога («Назначение ПО») в прод-Directus.
#
# Делает три вещи, которые в админке пришлось бы делать руками по одной:
#   1) заводит недостающие разделы каталога;
#   2) сливает дубли разделов: товары переезжают в основной раздел, дубль
#      уходит с витрины (в archived, не удаляется);
#   3) проставляет разделам intro — текст, который покупатель видит на плитке
#      раздела и подзаголовком на странице раздела;
#   4) переносит тексты страниц разделов из блока `content`: seo_text (блок
#      «Как выбрать» под списком товаров), faqs (вопросы раздела), meta_title
#      и meta_description. Поля сравниваются по одному, пишутся только
#      изменившиеся.
#
# Источник — `data/catalog/categories.json` в репозитории: тексты правятся
# ревью в коде, а не вслепую в базе.
#
# apply=false (по умолчанию) — только отчёт: что в базе сейчас, сколько где
# товаров, что изменится. Ничего не пишет. Результат — в журнал issue #22.
name: ops-categories

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true — применить; false — только отчёт"
        required: true
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Copy plan to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: data/catalog/categories.json
          target: /tmp/bz-categories/
          strip_components: 2

      - name: Report / apply
        id: run
        uses: appleboy/ssh-action@v1
        env:
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APPLY
          capture_stdout: true
          command_timeout: 10m
          script: |
            set -e
            python3 - <<'PY'
            import json, os, urllib.request

            apply = os.environ.get('APPLY', 'false') == 'true'
            BASE = 'http://127.0.0.1:8055'

            def read_env(path):
                """Значения из env-файла: split по первому '=', без shell."""
                out = {}
                try:
                    with open(path, encoding='utf-8', errors='replace') as f:
                        for line in f:
                            line = line.strip()
                            if not line or line.startswith('#') or '=' not in line:
                                continue
                            k, v = line.split('=', 1)
                            out[k.strip()] = v.strip().strip('"').strip("'")
                except OSError:
                    pass
                return out

            env = {}
            for path in ('/opt/bizsoft/.env', '/opt/bizsoft/astro.env'):
                for k, v in read_env(path).items():
                    env.setdefault(k, v)

            def call(method, path, body=None, token=None):
                data = json.dumps(body).encode() if body is not None else None
                req = urllib.request.Request(BASE + path, data=data, method=method)
                if token:
                    req.add_header('Authorization', f'Bearer {token}')
                if data:
                    req.add_header('Content-Type', 'application/json')
                with urllib.request.urlopen(req, timeout=180) as r:
                    raw = r.read()
                return json.loads(raw)['data'] if raw else None

            read_token = env.get('DIRECTUS_TOKEN')
            if not read_token:
                raise SystemExit('DIRECTUS_TOKEN не найден')

            # Токен сайта умеет читать, но не писать: первый прогон получил на
            # создании раздела HTTP 403. Расширять права служебной роли ради
            # разовой операции незачем — на запись логинимся администратором,
            # тем же способом, что и ops-directus-schema.
            write_token = None
            email = env.get('ADMIN_EMAIL') or env.get('DIRECTUS_ADMIN_EMAIL')
            password = env.get('ADMIN_PASSWORD') or env.get('DIRECTUS_ADMIN_PASSWORD')
            if email and password:
                try:
                    write_token = call('POST', '/auth/login',
                                       {'email': email, 'password': password})['access_token']
                    print('вход администратором: успешно')
                except Exception as e:  # noqa: BLE001 — причина нужна в журнале
                    print(f'вход администратором не удался: {type(e).__name__}')
            else:
                print('ADMIN_EMAIL/ADMIN_PASSWORD не найдены в /opt/bizsoft/.env')

            plan = json.load(open('/tmp/bz-categories/categories.json'))
            intros = plan.get('intro', {})
            creates = plan.get('create', [])
            merges = plan.get('merge', {})
            # Тексты страниц разделов; ключи с подчёркиванием — заметки редактора.
            contents = {k: v for k, v in plan.get('content', {}).items()
                        if not k.startswith('_')}
            CONTENT_FIELDS = ('seo_text', 'faqs', 'meta_title', 'meta_description')

            def norm(field, value):
                """Сравнимое представление поля: строки без хвостовых пробелов,
                faqs — как список пар без учёта форматирования JSON."""
                if field == 'faqs':
                    items = value if isinstance(value, list) else []
                    return [(str(i.get('q', '')).strip(), str(i.get('a', '')).strip())
                            for i in items if isinstance(i, dict)]
                return (value or '').strip()

            cats = call('GET', '/items/categories?limit=-1'
                        '&fields=id,slug,name,sort,status,intro,'
                        + ','.join(CONTENT_FIELDS) + '&sort=sort,name',
                        token=read_token)
            by_slug = {c['slug']: c for c in cats}

            products = call('GET', '/items/products?limit=-1'
                            '&fields=id,status,vendor,category.slug', token=read_token)
            counts = {}
            for p in products:
                cat = p.get('category') or {}
                slug = cat.get('slug') or '(без категории)'
                row = counts.setdefault(slug, {'published': 0, 'draft': 0,
                                               'archived': 0, 'vendors': {}})
                row[p['status']] = row.get(p['status'], 0) + 1
                v = (p.get('vendor') or '—').strip()
                row['vendors'][v] = row['vendors'].get(v, 0) + 1

            print('РАЗДЕЛЫ КАТАЛОГА')
            print(f"{'слаг':24} {'опубл':>6} {'скрыт':>6} {'intro':>6} {'текст':>6} {'faq':>4}  название / вендоры")
            for c in cats:
                s = c['slug']
                n = counts.get(s, {})
                intro = (c.get('intro') or '').strip()
                text = (c.get('seo_text') or '').strip()
                faqs = c.get('faqs') if isinstance(c.get('faqs'), list) else []
                top = sorted(n.get('vendors', {}).items(), key=lambda x: -x[1])[:5]
                print(f"{s:24} {n.get('published', 0):>6} {n.get('draft', 0):>6} "
                      f"{len(intro):>6} {len(text):>6} {len(faqs):>4}  {c['name']} · "
                      + ', '.join(f'{v} {k}' for v, k in top))
            orphan = counts.get('(без категории)')
            if orphan:
                print(f"\nбез категории: опубл {orphan['published']}, скрыт {orphan['draft']}")

            print('\nЧТО ИЗМЕНИТСЯ')
            todo_create = [c for c in creates if c['slug'] not in by_slug]
            for c in todo_create:
                print(f"  + создать раздел {c['slug']} «{c['name']}» (sort={c.get('sort')})")

            # Слияние дублей: товары переезжают в основной раздел, дубль уходит
            # с витрины. Раздел не удаляем, адрес отдаёт 301 — не 404.
            todo_merge = []
            for dup, canon in merges.items():
                if dup not in by_slug:
                    continue
                if canon not in by_slug:
                    print(f"  ! слияние {dup} → {canon}: основного раздела нет")
                    continue
                moving = [p for p in products
                          if (p.get('category') or {}).get('slug') == dup]
                todo_merge.append((dup, canon, moving))
                print(f"  → слить {dup} в {canon}: переедет товаров {len(moving)}, "
                      f"дубль уходит в archived")

            todo_intro = []
            for slug, text in intros.items():
                cur = by_slug.get(slug)
                if cur is None:
                    if slug not in {c['slug'] for c in creates}:
                        print(f"  ! в плане есть {slug}, а в базе такого раздела нет")
                    continue
                if (cur.get('intro') or '').strip() != text.strip():
                    todo_intro.append((slug, cur))
                    was = (cur.get('intro') or '').strip() or '(пусто)'
                    print(f"  ~ {slug}: было «{was[:60]}» → станет «{text[:60]}…»")
            missing = [c['slug'] for c in cats
                       if c['slug'] not in intros and c['slug'] not in merges]
            if missing:
                print(f"  ? без текста в плане: {', '.join(missing)}")

            # Тексты страниц: по каждому полю отдельно, чтобы отчёт показывал,
            # что именно изменится, а PATCH не трогал совпадающее.
            todo_content = []
            for slug, fields in contents.items():
                cur = by_slug.get(slug)
                if cur is None:
                    print(f"  ! текст страницы для {slug}, а в базе такого раздела нет")
                    continue
                patch = {}
                for f in CONTENT_FIELDS:
                    if f not in fields:
                        continue
                    if norm(f, cur.get(f)) != norm(f, fields[f]):
                        patch[f] = fields[f]
                if not patch:
                    continue
                todo_content.append((slug, cur, patch))
                parts = []
                for f, v in patch.items():
                    was = cur.get(f)
                    if f == 'faqs':
                        parts.append(f"faqs {len(norm(f, was))} → {len(norm(f, v))} вопр.")
                    else:
                        parts.append(f"{f} {len(norm(f, was))} → {len(norm(f, v))} симв.")
                print(f"  ~ {slug}: текст страницы — " + ', '.join(parts))

            if not apply:
                print('\nОТЧЁТ. Ничего не записано (apply=false).')
                raise SystemExit(0)
            if not write_token:
                raise SystemExit('\nЗАПИСЬ НЕВОЗМОЖНА: нет админского доступа к Directus.')

            for c in todo_create:
                created = call('POST', '/items/categories', {
                    'slug': c['slug'], 'name': c['name'], 'status': 'published',
                    'sort': c.get('sort'), 'intro': intros.get(c['slug'], ''),
                }, token=write_token)
                by_slug[c['slug']] = created
                print(f"создан раздел {c['slug']} (id={created['id']})")

            moved = 0
            for dup, canon, moving in todo_merge:
                canon_id = by_slug[canon]['id']
                for p in moving:
                    call('PATCH', f"/items/products/{p['id']}",
                         {'category': canon_id}, token=write_token)
                    moved += 1
                call('PATCH', f"/items/categories/{by_slug[dup]['id']}",
                     {'status': 'archived'}, token=write_token)
                print(f"слито {dup} → {canon}: перенесено {len(moving)}")

            created_slugs = {c['slug'] for c in todo_create}
            patched = 0
            for slug, cur in todo_intro:
                if slug in created_slugs:
                    continue  # intro уже проставлен при создании
                call('PATCH', f"/items/categories/{cur['id']}",
                     {'intro': intros[slug]}, token=write_token)
                patched += 1
            content_patched = 0
            for slug, cur, patch in todo_content:
                target = by_slug[slug]  # созданный в этом прогоне раздел уже в by_slug
                call('PATCH', f"/items/categories/{target['id']}", patch, token=write_token)
                content_patched += 1
                print(f"текст страницы {slug}: {', '.join(patch)}")

            print(f"\nПРИМЕНЕНО: создано разделов {len(todo_create)}, "
                  f"слито дублей {len(todo_merge)} (товаров перенесено {moved}), "
                  f"обновлено описаний {patched}, текстов страниц {content_patched}")
            PY

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-categories · apply=${{ inputs.apply }}"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
