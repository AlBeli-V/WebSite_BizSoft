# Разовая настройка отдачи веб-отчётов Growth Intelligence.
#
# Добавляет в живой nginx-конфиг location из deploy/nginx-biz-soft.conf.template
# (блок seo-reports), создаёт каталог /opt/bizsoft/seo-reports и перечитывает
# nginx. Идемпотентно: повторный запуск ничего не дублирует — блок ищется по
# маркеру. Выкладку самих файлов делает seo-publish-web.
name: ops-nginx-reports
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false — только показать состояние; true — применить"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
  issues: write
jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Extract location block from template
        run: |
          awk '/# Веб-отчёты Growth Intelligence/,/^    }$/' deploy/nginx-biz-soft.conf.template > /tmp/reports-location.conf
          echo "--- блок из шаблона:"; cat /tmp/reports-location.conf
          test -s /tmp/reports-location.conf

      - name: Copy block to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: /tmp/reports-location.conf
          target: /tmp
          strip_components: 1

      - name: Apply on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -e
            CONF=$(sudo grep -rl "server_name biz-soft.pro" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1)
            echo "конфиг: ${CONF:-не найден}"
            [ -n "$CONF" ]
            if sudo grep -q "seo-reports" "$CONF"; then
              echo "блок seo-reports уже есть — пропуск вставки"
            elif [ "$P_APPLY" != "true" ]; then
              echo "apply=false: блока нет, вставка не выполнялась"
            else
              sudo cp -p "$CONF" "$CONF.bak-$(date +%Y%m%d-%H%M%S)"
              # Вставка перед первым «location / {» — как в шаблоне.
              sudo python3 - "$CONF" <<'PYEOF'
            import sys
            conf = sys.argv[1]
            block = open('/tmp/reports-location.conf', encoding='utf-8').read().rstrip('\n')
            text = open(conf, encoding='utf-8').read()
            marker = '    location / {'
            assert 'seo-reports' not in text
            assert marker in text
            text = text.replace(marker, block + '\n\n' + marker, 1)
            open(conf, 'w', encoding='utf-8').write(text)
            print('блок вставлен')
            PYEOF
            fi
            sudo mkdir -p /opt/bizsoft/seo-reports
            sudo chown "$USER" /opt/bizsoft/seo-reports
            sudo nginx -t
            [ "$P_APPLY" = "true" ] && sudo systemctl reload nginx && echo "nginx перечитан" || true
            echo "--- location'ы с отчётами:"; sudo grep -n "r-\|seo-reports" "$CONF" | head -5

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.stdout }}
          MODE: ${{ inputs.apply }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-nginx-reports (apply=' + process.env.MODE + ')\n\n```\n'
                + (process.env.OUT || '(нет вывода)').slice(0, 20000) + '\n```',
            });
