# Тег Яндекс.Метрики со своего домена, с кэшем на nginx (PERF-METRIKA-001).
#
# Зачем: tag.js приходит с mc.yandex.ru отдельным соединением (DNS + TLS к
# чужому домену) и с коротким чужим кэшем — на мобильном профиле PageSpeed
# это ~150–250 мс и постоянное замечание об эффективности кэша на 70 КБ.
# Через свой домен файл едет по уже открытому HTTP/2-соединению.
#
# Что делает: кладёт зону кэша в /etc/nginx/conf.d/ и вставляет в живой
# server{} блок location из deploy/nginx-metrika-locations.conf. Идемпотентно:
# блок ищется по маркеру «PERF-METRIKA-001 begin», повторный запуск ничего
# не дублирует.
#
# Права: у деплой-пользователя нет беспарольного sudo (диагностика 23.08).
# Правка конфига и reload выполняются разово под root через одноразовый
# docker-контейнер (--rm, chroot /host) — тем же способом, что в
# ops-nginx-ratelimit: sudoers не меняется, после выхода контейнера
# повышенных прав не остаётся.
#
# Безопасность применения: перед правкой снимается копия конфига рядом с
# оригиналом. Если nginx -t не проходит, копия возвращается на место,
# conf.d-файл удаляется (если его положил этот же запуск), и шаг падает с
# ненулевым кодом — живой сайт остаётся на прежнем конфиге.
#
# Безопасность для счётчика: сайт грузит тег с /m/tag.js и при ошибке
# загрузки сам подставляет оригинальный адрес mc.yandex.ru (см. Analytics.astro),
# поэтому порядок «сначала код, потом конфиг» тоже безопасен — Метрика
# работает в любом случае.
#
# Результат — комментарий в журнал-issue #22.
name: ops-nginx-metrika-cache
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false — только показать текущее состояние; true — применить"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
  issues: write
jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Checkout
        # always() — шаг журнала ниже тоже always(): без этого при
        # падении раннего шага checkout пропустится и запись не пройдёт.
        if: always()
        uses: actions/checkout@v4

      - name: Проверить, что исходные файлы на месте
        run: |
          MISSING=0
          for f in deploy/nginx-metrika-cache.conf deploy/nginx-metrika-locations.conf; do
            if [ ! -s "$f" ]; then echo "НЕТ файла $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::В main нет файлов кэша Метрики."
            exit 1
          fi
          echo "--- зона кэша:"; cat deploy/nginx-metrika-cache.conf
          echo "--- location:"; cat deploy/nginx-metrika-locations.conf

      - name: Copy configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'deploy/nginx-metrika-cache.conf,deploy/nginx-metrika-locations.conf'
          target: /tmp/bizsoft-metrika
          strip_components: 1

      - name: Apply on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -e
            echo "== окружение =="
            SUDO=""
            sudo -n true 2>/dev/null && SUDO="sudo -n"
            DOCKER=НЕТ
            docker info >/dev/null 2>&1 && DOCKER=да
            echo "пользователь: $(id -un), sudo без пароля: $([ -n "$SUDO" ] && echo да || echo НЕТ), docker: $DOCKER"

            echo
            echo "== текущее состояние =="
            CONF=$(grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v '\.bak' | head -1)
            if [ -z "$CONF" ] && [ -n "$SUDO" ]; then
              CONF=$($SUDO grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v '\.bak' | head -1)
            fi
            echo "конфиг сайта: ${CONF:-НЕ НАЙДЕН}"
            [ -n "$CONF" ]
            if [ -f /etc/nginx/conf.d/bizsoft-metrika-cache.conf ]; then
              echo "зона кэша: файл на месте"
            else
              echo "зона кэша: файла нет"
            fi
            if grep -q "PERF-METRIKA-001" "$CONF" 2>/dev/null; then
              echo "блок location: уже в конфиге"
            else
              echo "блок location: в конфиге нет"
            fi
            echo "--- ошибки IPv6 к mc.yandex.ru в error.log (сейчас + прошлая ротация):"
            IPV6_ERRS=$( (cat /var/log/nginx/error.log /var/log/nginx/error.log.1 2>/dev/null \
              || docker run --rm -v /var/log/nginx:/logs:ro --entrypoint sh postgres:16-alpine -c \
                   'cat /logs/error.log /logs/error.log.1 2>/dev/null' 2>/dev/null) \
              | grep -c 'metrika/tag.js.*Network is unreachable\|Network is unreachable.*metrika/tag.js' || true)
            echo "  записей «Network is unreachable» по /m/tag.js: ${IPV6_ERRS:-0}"
            echo "--- резолверы хоста (/etc/resolv.conf, только IPv4):"
            RESOLVERS=$(grep -E '^nameserver[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' /etc/resolv.conf 2>/dev/null \
              | awk '{print $2}' | tr '\n' ' ' | sed 's/ $//')
            echo "  ${RESOLVERS:-НЕ НАЙДЕНЫ}"
            echo "--- как сейчас отвечает /m/tag.js:"
            curl -s -o /dev/null -w "  без сжатия: код %{http_code}, тип %{content_type}, размер %{size_download} Б\n" \
              https://biz-soft.pro/m/tag.js || echo "  (запрос не прошёл)"
            curl -s -H 'Accept-Encoding: gzip' -o /dev/null -D /tmp/bz-h1 -w "  со сжатием: код %{http_code}, по проводу %{size_download} Б\n" https://biz-soft.pro/m/tag.js || true
            grep -i '^content-encoding' /tmp/bz-h1 | sed 's/^/    /' || echo "    content-encoding отсутствует"
            # Что отдаёт сам Яндекс: прогон #4 показал, что на явный запрос
            # gzip он присылает несжатое, поэтому сжимаем у себя. Строка ниже
            # покажет, если это когда-нибудь изменится.
            curl -s -H 'Accept-Encoding: gzip' -o /dev/null -D /tmp/bz-h2 -w "  апстрим mc.yandex.ru: код %{http_code}, по проводу %{size_download} Б\n" 'https://mc.yandex.ru/metrika/tag.js' || true
            grep -i '^content-encoding' /tmp/bz-h2 | sed 's/^/    /' || echo "    апстрим: content-encoding отсутствует"
            rm -f /tmp/bz-h1 /tmp/bz-h2

            if [ "$P_APPLY" != "true" ]; then
              echo
              echo "apply=false: изменений не делалось"
              rm -rf /tmp/bizsoft-metrika
              exit 0
            fi

            # В блоке location стоит плейсхолдер __RESOLVERS__ — подставляем
            # IPv4-резолверы этого хоста. Без резолвера nginx -t упадёт на
            # proxy_pass с переменной, поэтому при пустом списке останавливаемся
            # до правки конфига.
            if [ -z "$RESOLVERS" ]; then
              echo "::error::В /etc/resolv.conf нет ни одного IPv4-резолвера — конфиг не применяю"
              rm -rf /tmp/bizsoft-metrika
              exit 1
            fi
            sed -i "s/__RESOLVERS__/$RESOLVERS/" /tmp/bizsoft-metrika/nginx-metrika-locations.conf
            grep -n 'resolver ' /tmp/bizsoft-metrika/nginx-metrika-locations.conf | sed 's/^/  подставлено: /'

            # Скрипт, исполняемый под root. Идемпотентен и самооткатываем:
            # при неудачном nginx -t возвращает конфиг из копии и падает.
            cat > /tmp/bz-metrika-apply.sh <<'ROOTEOF'
            #!/bin/bash
            set -e
            conf=$(grep -rl "server_name biz-soft.pro" /etc/nginx | grep -v '\.bak' | head -1)
            stamp=$(date +%Y%m%d-%H%M%S)
            backup="$conf.bak-metrika-$stamp"
            zone=/etc/nginx/conf.d/bizsoft-metrika-cache.conf
            zone_added=нет

            cp -p "$conf" "$backup"
            echo "копия конфига: $backup"

            if [ -f "$zone" ]; then
              cp -p "$zone" "$zone.bak-$stamp"
              echo "зона уже была, копия: $zone.bak-$stamp"
            else
              zone_added=да
            fi
            cp /tmp/bizsoft-metrika/nginx-metrika-cache.conf "$zone"
            echo "зона кэша записана: $zone"

            mkdir -p /var/cache/nginx/metrika
            chown -R www-data:www-data /var/cache/nginx/metrika 2>/dev/null || true
            echo "каталог кэша готов: /var/cache/nginx/metrika"

            python3 - "$conf" <<'PYEOF'
            import re
            import sys
            conf = sys.argv[1]
            block = open('/tmp/bizsoft-metrika/nginx-metrika-locations.conf',
                         encoding='utf-8').read().rstrip('\n')
            text = open(conf, encoding='utf-8').read()
            if 'PERF-METRIKA-001' in text:
                # Блок уже стоит — заменяем целиком на версию из репозитория,
                # иначе правки конфига (например, режим сжатия) не доезжали бы
                # до сервера: повторный запуск видел маркер и ничего не делал.
                pattern = re.compile(
                    r'[ \t]*#[^\n]*PERF-METRIKA-001 begin.*?#[^\n]*PERF-METRIKA-001 end[^\n]*\n',
                    re.S)
                new_text, n = pattern.subn(block + '\n', text)
                assert n == 1, f'ожидался один блок PERF-METRIKA-001, найдено {n}'
                open(conf, 'w', encoding='utf-8').write(new_text)
                print('блок location обновлён из репозитория')
            else:
                marker = '    location / {'
                assert marker in text, 'маркер "location / {" не найден'
                open(conf, 'w', encoding='utf-8').write(
                    text.replace(marker, block + '\n\n' + marker, 1))
                print('блок location вставлен перед location /')
            PYEOF

            # Точка проверки. Всё, что ниже, выполняется только на исправном
            # конфиге; иначе откат и ненулевой код возврата.
            if ! nginx -t; then
              echo "nginx -t НЕ ПРОШЁЛ — откатываю"
              cp -p "$backup" "$conf"
              if [ "$zone_added" = "да" ]; then rm -f "$zone"; else cp -p "$zone.bak-$stamp" "$zone"; fi
              nginx -t && echo "конфиг возвращён в исходное состояние"
              exit 1
            fi

            systemctl reload nginx 2>/dev/null && echo 'nginx перечитан (systemctl)' \
              || { nginx -s reload && echo 'nginx перечитан (nginx -s reload)'; }

            # Кэш очищается на каждом применении: в нём лежит ответ, снятый по
            # прежним правилам, и смена этих правил его не касается. Прогон #3
            # обновил конфиг на сжатую версию, но отдавалась старая несжатая
            # копия (HIT, 288 КБ). Файл один и перезаполняется первым же
            # запросом, поэтому чистить безопасно.
            find /var/cache/nginx/metrika -type f -delete 2>/dev/null || true
            echo "кэш очищен — следующий запрос возьмёт свежую копию"
            # Прогрев: заполняем кэш сжатой версией, чтобы первый посетитель
            # не ждал похода к Яндексу.
            curl -s -H 'Accept-Encoding: gzip' -o /dev/null -w "  прогрев: код %{http_code}, по проводу %{size_download} Б\n" \
              https://biz-soft.pro/m/tag.js || true
            ROOTEOF
            chmod +x /tmp/bz-metrika-apply.sh

            if [ -n "$SUDO" ]; then
              $SUDO /tmp/bz-metrika-apply.sh
            elif [ "$DOCKER" = "да" ]; then
              echo "sudo нет — разовое выполнение под root в одноразовом контейнере (--rm)"
              docker run --rm --pid=host -v /:/host alpine:3 chroot /host /bin/bash /tmp/bz-metrika-apply.sh
            else
              echo "ни sudo, ни docker — применить нечем"
              exit 1
            fi

            rm -f /tmp/bz-metrika-apply.sh
            rm -rf /tmp/bizsoft-metrika
            echo "временные файлы удалены; sudoers не менялся, контейнер удалён — повышенных прав не осталось"

            echo
            echo "== проверка после применения =="
            sleep 2
            for i in 1 2; do
              curl -s -o /tmp/bz-tag.js -D /tmp/bz-tag.h -w "  попытка $i: код %{http_code}, размер %{size_download} Б\n" \
                https://biz-soft.pro/m/tag.js || true
              grep -i "^x-cache-status\|^content-type\|^cache-control" /tmp/bz-tag.h | sed 's/^/    /' || true
            done
            echo "  первые байты файла: $(head -c 60 /tmp/bz-tag.js 2>/dev/null)"
            rm -f /tmp/bz-tag.js /tmp/bz-tag.h
            if grep -q 'resolver .* ipv6=off' "$CONF" 2>/dev/null; then
              echo "  ✓ в живом конфиге resolver с ipv6=off — новых ошибок IPv6 к mc.yandex.ru быть не должно"
            else
              echo "  ✗ в живом конфиге нет resolver ipv6=off — блок не обновился"
              exit 1
            fi

      # Приёмка снаружи: файл действительно отдаётся и это скрипт Метрики.
      - name: Probe metrika tag
        if: inputs.apply == 'true'
        run: |
          URL="https://biz-soft.pro/m/tag.js"
          CODE=$(curl -s -o /tmp/tag.js -w '%{http_code}' --max-time 20 "$URL")
          TYPE=$(curl -s -o /dev/null -w '%{content_type}' --max-time 20 "$URL")
          SIZE=$(stat -c%s /tmp/tag.js 2>/dev/null || echo 0)
          echo "без сжатия: код $CODE, тип $TYPE, размер $SIZE Б"
          if [ "$CODE" != "200" ] || [ "$SIZE" -lt 10000 ]; then
            echo "::error::Тег Метрики не отдаётся со своего домена — сайт продолжит грузить его с mc.yandex.ru через фолбэк, но выигрыша нет."
            exit 1
          fi
          # Признак настоящего тега: в нём есть обращение к mc.yandex.ru.
          if grep -qi "yandex" /tmp/tag.js; then
            echo "✓ отдан настоящий тег Метрики"
          else
            echo "::error::По адресу отдаётся не тег Метрики."
            exit 1
          fi

          # Главная проверка выигрыша: браузер запрашивает сжатие, и по проводу
          # должно уехать ~70 КБ, как с mc.yandex.ru. Без сжатия это 288 КБ —
          # вчетверо хуже, чем было до кэша, поэтому здесь красный статус.
          GZ=$(curl -s -H 'Accept-Encoding: gzip' -o /tmp/tag.gz -D /tmp/tag.h -w '%{size_download}' --max-time 20 "$URL")
          ENC=$(grep -i '^content-encoding' /tmp/tag.h | tr -d '\r' | head -1)
          VARY=$(grep -i '^vary' /tmp/tag.h | tr -d '\r' | head -1)
          echo "со сжатием: по проводу $GZ Б; ${ENC:-content-encoding отсутствует}; ${VARY:-vary отсутствует}"
          if [ "$GZ" -gt 120000 ]; then
            echo "::error::Тег отдаётся несжатым ($GZ Б). Проверьте gzip/gunzip в блоке PERF-METRIKA-001 и gzip_types в http-блоке."
            exit 1
          fi
          echo "✓ сжатие работает: экономия $(( (SIZE - GZ) / 1024 )) КБ на загрузку"

      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-nginx-metrika-cache (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
