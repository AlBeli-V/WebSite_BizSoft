# Тестовый прогон форм сайта «как есть» (поручение руководителя 28.08):
# отправляет НАСТОЯЩУЮ заявку и НАСТОЯЩИЙ запрос КП через API прода
# (localhost:3000), e-mail клиента подменяется адресом менеджера — все
# письма (клиентские и менеджерские) падают в его ящик в том виде, в каком
# их видят получатели. Записи в CRM помечены «ТЕСТ» — удалить после разбора.
name: ops-form-test
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Run test submissions on server
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          command_timeout: 5m
          script: |
            set -e
            MGR=$(sed -n 's/^MANAGER_EMAIL=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            echo "адрес менеджера (получит все письма теста): $MGR"

            echo "== 1. Заявка с сайта (форма v2: реквизиты как у КП, включая ИНН; менеджеру — HTML с источником) =="
            curl -sf -X POST http://127.0.0.1:3000/api/lead -H 'Content-Type: application/json' -d "{
              \"name\": \"Тест Заявка с сайта\",
              \"inn\": \"7736207543\",
              \"attribution\": {\"last\": {\"utm_source\": \"yandex\", \"utm_medium\": \"cpc\", \"utm_campaign\": \"bs-test-2026-09\", \"utm_content\": \"k1-claude\", \"utm_term\": \"claude купить\", \"landing_path\": \"/vendors/anthropic\"}, \"first\": {\"referrer\": \"https://yandex.ru/search/\", \"landing_path\": \"/vendors/anthropic\", \"ts\": \"2026-08-28T10:00:00Z\"}},
              \"company\": \"ТЕСТ — прогон форм 28.08 (удалить из воронки)\",
              \"email\": \"$MGR\",
              \"phone\": \"+7 (000) 000-00-00\",
              \"message\": \"ТЕСТ: прогон формы заявки как есть. Клиент при этой форме письма НЕ получает — только экранное подтверждение; это письмо видит только менеджер.\",
              \"consent\": true,
              \"source\": \"ТЕСТ Заявка с сайта\",
              \"product_ref\": \"ТЕСТ Заявка с сайта\"
            }"
            echo

            echo "== 2. Запрос КП (запрос КП: письмо менеджеру теперь с блоком источника) =="
            curl -sf -X POST http://127.0.0.1:3000/api/quote -H 'Content-Type: application/json' -d "{
              \"buyer_company\": \"ТЕСТ КП — прогон форм 28.08 (удалить)\",
              \"attribution\": {\"last\": {\"utm_source\": \"yandex\", \"utm_medium\": \"cpc\", \"utm_campaign\": \"bs-test-2026-09\", \"utm_content\": \"k1-claude\", \"utm_term\": \"claude купить\", \"landing_path\": \"/vendors/anthropic\"}, \"first\": {\"referrer\": \"https://yandex.ru/search/\", \"landing_path\": \"/vendors/anthropic\", \"ts\": \"2026-08-28T10:00:00Z\"}},
              \"buyer_inn\": \"7736207543\",
              \"contact_name\": \"Тест КП\",
              \"email\": \"$MGR\",
              \"phone\": \"+7 (000) 000-00-00\",
              \"consent\": true,
              \"items\": [{\"sku\": \"ANTHROPIC-TEAM\", \"qty\": 1}]
            }"
            echo

            sleep 6
            echo "== Хвост логов почты =="
            cd /opt/bizsoft
            docker compose logs --tail 200 astro | grep -iE 'mailer|lead mail|quote' | tail -15 || echo "(строк mailer нет)"

      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-form-test — тестовый прогон форм как есть"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
