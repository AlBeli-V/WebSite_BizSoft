# Проба веб-поиска Yandex Search API (SERP) существующим ключом Wordstat.
#
# Wordstat уже работает через Yandex Cloud Search API (WORDSTAT_API_KEY);
# веб-поиск /v2/web/search — тот же сервис. Проба делает РОВНО ОДИН платный
# запрос и отвечает: работает ли ключ для SERP, или называет недостающую
# роль/тариф. Read-only, сайт и кабинеты не трогает. Результат — комментарием
# в журнал-issue #22. Ручной запуск — только с main (правило CLAUDE.md).
name: ops-serp-probe
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Поисковый запрос пробы'
        required: false
        default: 'купить figma'
      folder_id:
        description: 'folderId каталога Yandex Cloud (если API попросит его явно)'
        required: false
        default: ''
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Запуск разрешён только с ветки main (правило проекта)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe SERP
        id: run
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          SEARCH_API_FOLDER_ID: ${{ inputs.folder_id }}
          QUERY: ${{ inputs.query }}
        run: |
          pip install --quiet requests
          {
            echo 'result<<SERP_EOF'
            python3 scripts/seo/serp_probe.py "$QUERY" || true
            echo 'SERP_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Post to issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body: '### ops-serp-probe · ' + new Date().toISOString() + '\n\n```\n' + process.env.RESULT + '\n```',
            });
