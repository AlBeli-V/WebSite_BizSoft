# Диагностика сервера: утилизация ресурсов хоста, docker-контейнеры,
# статистика nginx-логов за последние 7 дней. Только чтение, ничего не меняет.
# Результат публикуется комментарием в журнал-issue #22 (как ops-perf).

name: ops-server-stats

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Collect server stats over SSH
        id: probe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          command_timeout: 15m
          script: |
            # Не валим весь сбор из-за одной недоступной секции.
            S=""; sudo -n true 2>/dev/null && S="sudo -n"

            echo "════ ХОСТ ════"
            hostname; uname -r; grep PRETTY /etc/os-release 2>/dev/null
            echo "CPU: $(nproc) ядер"; uptime
            echo
            echo "── Память (МБ) ──"; free -m
            echo
            echo "── Диск ──"; df -h | grep -vE 'tmpfs|udev|overlay|shm'
            df -i / | tail -1 | awk '{print "inodes использовано: "$5}'
            echo
            echo "── Load / vmstat (3 замера) ──"
            cat /proc/loadavg
            vmstat 1 3 2>/dev/null || true
            echo
            echo "── Топ процессов по CPU/MEM ──"
            ps aux --sort=-%cpu | head -8
            ps aux --sort=-%mem | head -8

            echo
            echo "════ ИСТОРИЯ УТИЛИЗАЦИИ (sar, 7 дней) ════"
            if command -v sar >/dev/null 2>&1; then
              for i in 6 5 4 3 2 1 0; do
                d=$(date -d "-$i day" +%d 2>/dev/null)
                dt=$(date -d "-$i day" +%F 2>/dev/null)
                for f in /var/log/sysstat/sa$d /var/log/sa/sa$d; do
                  if [ -f "$f" ]; then
                    echo "── $dt: CPU (avg/max %idle → загрузка) ──"
                    sar -u -f "$f" 2>/dev/null | tail -2 | head -1
                    sar -u -f "$f" 2>/dev/null | awk 'NR>3 && $NF ~ /^[0-9.]+$/ {if(min==""||$NF<min)min=$NF} END {print "  min %idle за день: " min}'
                    echo "── $dt: память ──"
                    sar -r -f "$f" 2>/dev/null | tail -2 | head -1
                    echo "── $dt: очередь/load ──"
                    sar -q -f "$f" 2>/dev/null | tail -2 | head -1
                    break
                  fi
                done
              done
            else
              echo "sysstat/sar не установлен — истории утилизации по дням нет"
            fi

            echo
            echo "════ DOCKER ════"
            cd /opt/bizsoft 2>/dev/null || true
            docker compose ps 2>/dev/null || $S docker compose ps 2>/dev/null || echo "(docker недоступен)"
            echo
            docker stats --no-stream 2>/dev/null || $S docker stats --no-stream 2>/dev/null || true
            echo
            echo "── Рестарты/OOM контейнеров ──"
            for c in $(docker ps --format '{{.Names}}' 2>/dev/null); do
              echo "  $c: restarts=$(docker inspect -f '{{.RestartCount}}' $c) oomkilled=$(docker inspect -f '{{.State.OOMKilled}}' $c) started=$(docker inspect -f '{{.State.StartedAt}}' $c)"
            done
            echo
            echo "── docker system df ──"
            docker system df 2>/dev/null || true

            echo
            echo "── Ошибки в логах astro (7 дней, последние 25) ──"
            docker logs --since 168h bizsoft-astro-1 2>&1 | grep -iE 'error|fatal|unhandled|ECONN|ETIMEDOUT|EADDR' | tail -25 || echo "  (нет)"
            echo "── Ошибки в логах directus (7 дней, последние 25) ──"
            docker logs --since 168h bizsoft-directus-1 2>&1 | grep -iE '"level":50|error|fatal' | grep -viE 'errors":0' | tail -25 || echo "  (нет)"

            echo
            echo "════ OOM / ЯДРО (7 дней) ════"
            ($S journalctl -k --since "7 days ago" 2>/dev/null || dmesg 2>/dev/null) | grep -iE 'oom|out of memory|killed process' | tail -15
            [ $? -ne 0 ] && echo "  (событий OOM нет или журнал недоступен)"

            echo
            echo "════ NGINX: СТАТИСТИКА ЗА 7 ДНЕЙ ════"
            NL=/var/log/nginx
            readlogs() {
              if [ -r "$NL/access.log" ]; then
                for f in "$NL"/access.log "$NL"/access.log.1; do
                  [ -f "$f" ] && cat "$f" 2>/dev/null
                done
                for f in "$NL"/access.log.*.gz; do
                  [ -f "$f" ] && zcat "$f" 2>/dev/null
                done
              else
                # Файлы www-data:adm недоступны deploy напрямую — читаем
                # read-only через docker (deploy в группе docker); образ уже на хосте.
                docker run --rm -v "$NL":/logs:ro --entrypoint sh postgres:16-alpine -c \
                  'cat /logs/access.log /logs/access.log.1 2>/dev/null; for f in /logs/access.log.*.gz; do zcat "$f" 2>/dev/null; done' 2>/dev/null
              fi
            }
            readerr() {
              if [ -r "$NL/error.log" ]; then
                cat "$NL/error.log" 2>/dev/null
              else
                docker run --rm -v "$NL":/logs:ro --entrypoint sh postgres:16-alpine -c \
                  'cat /logs/error.log 2>/dev/null' 2>/dev/null
              fi
            }
            CUTOFF=$(date -d "-7 day" +%s)
            readlogs | awk -v cutoff="$CUTOFF" '
              BEGIN {
                split("Jan:01 Feb:02 Mar:03 Apr:04 May:05 Jun:06 Jul:07 Aug:08 Sep:09 Oct:10 Nov:11 Dec:12", mm, " ")
                for (i in mm) { split(mm[i], pp, ":"); mon[pp[1]] = pp[2] }
              }
              {
                # $4 = [19/Aug/2026:12:00:00
                d = substr($4, 2)
                day = substr(d,1,2); m = substr(d,4,3); y = substr(d,8,4)
                ts = mktime(y" "mon[m]" "day" 00 00 00")
                if (ts < cutoff) next
                date = y"-"mon[m]"-"day
                total++
                perday[date]++
                st = $9; cls = substr(st,1,1)"xx"
                status[st]++; perday_cls[date" "cls]++
                bytes += $10 + 0
                hr = substr(d,13,2)
                hourcnt[date" "hr]++
                if (cls == "5xx" && n5 < 10) { n5++; sample5[n5] = $1" "d" \""$6" "$7"\" "st }
                # путь без query
                path = $7; sub(/\?.*/, "", path)
                paths[path]++
                if (st == "404") p404[path]++
                ip[$1]++
                # UA — всё после пятой кавычки
                ua = $0; nq = split(ua, q, "\"")
                agent = (nq >= 6) ? q[6] : "-"
                if (tolower(agent) ~ /bot|crawl|spider|slurp|petal|ahrefs|semrush|yandex|bingpreview|gpt|claude|scan/) bots++
                uacnt[substr(agent,1,90)]++
                # ── Обход поисковиками (SEO-GBOT-001) ──
                # Зачем отдельный разрез: разбор покрытия 08.09.2026 показал,
                # что 490 из 729 путей инвентаря Googlebot не скачивал ни разу,
                # а сам обход шёл темпом единиц URL в сутки. Из общей сводки
                # причину не видно: там не различить «бот не приходил» от
                # «приходил и получал ошибки». Здесь считается, сколько
                # запросов делает каждый поисковый бот, с какими кодами и
                # какую долю обхода он тратит на служебное.
                #
                # Определяем по User-Agent: это подсказка, а не доказательство
                # (UA подделывается). Ниже печатаются адреса — сверять с
                # официальными диапазонами Google и Яндекса, если понадобится.
                lua = tolower(agent)
                bot = ""
                if (lua ~ /googlebot|google-inspectiontool|storebot-google/) bot = "Googlebot"
                else if (lua ~ /yandexbot|yandexrenderresourcesbot|yandeximages/) bot = "YandexBot"
                else if (lua ~ /bingbot/) bot = "Bingbot"
                # Подпись User-Agent ничего не доказывает. Первый же прогон
                # этого разреза (08.09.2026) показал 3312 запросов с UA
                # Googlebot, из которых 3002 — ответы 404 на /wp-config.php,
                # /.git/index, /.env и /yarn.lock с адресов 94.154.46.243–247.
                # Это сканер уязвимостей, представляющийся Googlebot; на
                # реальный обход приходилось 70 запросов, то есть 2%.
                # Без разделения по адресу разрез мерил бы шум сканеров и
                # контрольные точки программы сравнивали бы не то.
                #
                # Диапазоны: Googlebot ходит из 66.249.64.0/19 (сюда же
                # Google-InspectionTool), Яндекс — из своих публичных сетей.
                # Проверка по префиксу адреса грубее обратного DNS, но не
                # требует резолвинга ста тысяч строк лога и достаточна,
                # чтобы отделить настоящего робота от самозванца.
                if (bot != "") {
                  official = 0
                  if (bot == "Googlebot" && $1 ~ /^66\.249\./) official = 1
                  if (bot == "YandexBot" && $1 ~ /^(5\.45\.|5\.255\.|37\.9\.|77\.88\.|87\.250\.|93\.158\.|95\.108\.|141\.8\.|178\.154\.|213\.180\.)/) official = 1
                  if (bot == "Bingbot" && $1 ~ /^(40\.77\.|13\.66\.|13\.67\.|52\.167\.|157\.55\.|207\.46\.)/) official = 1
                  if (official) { botreal[bot]++; if (st ~ /^[45]/) boterrreal[bot]++
                                  if (path ~ /^\/(_astro|img|og|brand|favicon|m\/)/ || path ~ /\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$/) botassetreal[bot]++
                                  else { botpagereal[bot]++; botpathreal[bot" "path]++ }
                                  botdayreal[bot" "date]++ }
                  else botfake[bot]++
                }
                if (bot != "") {
                  botreq[bot]++
                  botday[bot" "date]++
                  botst[bot" "st]++
                  botip[bot" "$1]++
                  botpath[bot" "path]++
                  # Обход, потраченный не на страницы: ассеты, служебное, ошибки.
                  if (path ~ /^\/(_astro|img|og|brand|favicon|m\/)/ || path ~ /\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$/) botasset[bot]++
                  else botpage[bot]++
                  if (st ~ /^[45]/) boterr[bot]++
                }
              }
              END {
                printf "Всего запросов за 7 дней: %d (~%.0f/день, ~%.2f/сек в среднем)\n", total, total/7, total/(7*86400)
                printf "Трафик (body bytes): %.2f ГБ\n\n", bytes/1073741824
                print "── Запросы по дням ──"
                n = asorti(perday, sd)
                for (i=1;i<=n;i++) {
                  d = sd[i]
                  printf "  %s: %6d  (2xx:%d 3xx:%d 4xx:%d 5xx:%d)\n", d, perday[d], perday_cls[d" 2xx"], perday_cls[d" 3xx"], perday_cls[d" 4xx"], perday_cls[d" 5xx"]
                }
                print "\n── Коды ответов ──"
                n = asorti(status, ss)
                for (i=1;i<=n;i++) printf "  %s: %d\n", ss[i], status[ss[i]]
                printf "\nДоля бото-трафика (по UA): %.1f%%\n", (total ? bots*100.0/total : 0)
                printf "Уникальных IP: %d\n", length(ip)
                mx = 0; mh = "-"
                for (h in hourcnt) if (hourcnt[h] > mx) { mx = hourcnt[h]; mh = h }
                printf "Пиковый час: %s → %d запросов (~%.2f rps)\n", mh, mx, mx/3600.0
                if (n5) { print "\n── Примеры 5xx ──"; for (i=1;i<=n5;i++) print "  " sample5[i] }
                print "\n════ ОБХОД ПОИСКОВИКАМИ (по User-Agent) ════"
                nb = asorti(botreq, bs)
                if (nb == 0) print "  за окно не зафиксировано ни одного запроса поисковых ботов"
                for (bi=1; bi<=nb; bi++) {
                  b = bs[bi]
                  printf "\n── %s ──\n", b
                  printf "   ПОДТВЕРЖДЁННЫЙ ОБХОД (адрес из сетей поисковика): %d запросов за 7 дней (~%.1f/день)\n", botreal[b]+0, (botreal[b]+0)/7.0
                  printf "     страницы: %d, ассеты/служебное: %d, ответы 4xx/5xx: %d\n", botpagereal[b]+0, botassetreal[b]+0, boterrreal[b]+0
                  line = ""
                  delete dl; dn = 0
                  for (k in botdayreal) { split(k, kk, " "); if (kk[1] == b) dl[++dn] = kk[2]" "botdayreal[k] }
                  if (dn) { asort(dl); for (i=1;i<=dn;i++) line = line dl[i] "; " }
                  printf "     по дням: %s\n", line ? line : "(нет)"
                  delete arr; m2 = 0
                  for (k in botpathreal) { split(k, kk, " "); if (kk[1] == b) arr[++m2] = sprintf("%08d %s", botpathreal[k], kk[2]) }
                  if (m2) {
                    n = asort(arr); c = 0
                    print "     топ-8 страниц подтверждённого обхода:"
                    for (i=n; i>=1 && c<8; i--) { c++; ix = index(arr[i], " "); printf "       %d  %s\n", substr(arr[i],1,ix-1)+0, substr(arr[i],ix+1) }
                  }
                  printf "   Самозванцы (тот же UA с чужих адресов): %d запросов — в счёт обхода не идут\n", botfake[b]+0
                  printf "   ВСЕГО по подписи UA: %d (~%.1f/день) — справочно\n", botreq[b], botreq[b]/7.0
                  printf "     страницы: %d, ассеты/служебное: %d, ответы 4xx/5xx: %d\n", botpage[b]+0, botasset[b]+0, boterr[b]+0
                  # коды ответов этому боту
                  line = ""
                  for (k in botst) { split(k, kk, " "); if (kk[1] == b) line = line sprintf("%s:%d ", kk[2], botst[k]) }
                  printf "   коды: %s\n", line
                  # по дням — виден ли провал или ровный темп
                  line = ""
                  delete dl; dn = 0
                  for (k in botday) { split(k, kk, " "); if (kk[1] == b) dl[++dn] = kk[2]" "botday[k] }
                  if (dn) { asort(dl); for (i=1;i<=dn;i++) line = line dl[i] "; " }
                  printf "   по дням: %s\n", line
                  # куда уходит обход
                  delete arr; m2 = 0
                  for (k in botpath) { split(k, kk, " "); if (kk[1] == b) arr[++m2] = sprintf("%08d %s", botpath[k], kk[2]) }
                  if (m2) {
                    n = asort(arr); c = 0
                    print "   топ-8 путей:"
                    for (i=n; i>=1 && c<8; i--) { c++; ix = index(arr[i], " "); printf "     %d  %s\n", substr(arr[i],1,ix-1)+0, substr(arr[i],ix+1) }
                  }
                  delete arr; m2 = 0
                  for (k in botip) { split(k, kk, " "); if (kk[1] == b) arr[++m2] = sprintf("%08d %s", botip[k], kk[2]) }
                  if (m2) {
                    n = asort(arr); c = 0
                    print "   топ-5 адресов (сверять с официальными диапазонами):"
                    for (i=n; i>=1 && c<5; i--) { c++; ix = index(arr[i], " "); printf "     %d  %s\n", substr(arr[i],1,ix-1)+0, substr(arr[i],ix+1) }
                  }
                }

                print "\n── Топ-15 путей ──"
                m2 = 0
                for (p in paths) { arr[++m2] = sprintf("%08d %s", paths[p], p) }
                n = asort(arr); c = 0
                for (i=n; i>=1 && c<15; i--) { c++; split(arr[i], z, " "); printf "  %d  %s\n", z[1]+0, z[2] }
                print "\n── Топ-10 IP ──"
                delete arr; m2 = 0
                for (p in ip) { arr[++m2] = sprintf("%08d %s", ip[p], p) }
                n = asort(arr); c = 0
                for (i=n; i>=1 && c<10; i--) { c++; split(arr[i], z, " "); printf "  %d  %s\n", z[1]+0, z[2] }
                print "\n── Топ-10 путей 404 ──"
                delete arr; m2 = 0
                for (p in p404) { arr[++m2] = sprintf("%08d %s", p404[p], substr(p,1,80)) }
                n = asort(arr); c = 0
                for (i=n; i>=1 && c<10; i--) { c++; ix = index(arr[i], " "); printf "  %d  %s\n", substr(arr[i],1,ix-1)+0, substr(arr[i],ix+1) }
                print "\n── Топ-8 User-Agent ──"
                delete arr; m2 = 0
                for (p in uacnt) { arr[++m2] = sprintf("%08d %s", uacnt[p], p) }
                n = asort(arr); c = 0
                for (i=n; i>=1 && c<8; i--) { c++; ix = index(arr[i], " "); printf "  %d  %s\n", substr(arr[i],1,ix-1)+0, substr(arr[i],ix+1) }
              }' || echo "(логи nginx недоступны для пользователя $(whoami))"
            echo
            echo "── nginx error.log (последние 20) ──"
            readerr | tail -20 || echo "  (недоступен или пуст)"
            echo
            echo "── Ротация логов nginx ──"
            ls -lh "$NL"/ 2>/dev/null | head -15 || $S ls -lh "$NL"/ 2>/dev/null | head -15 || true
            echo
            echo "✓ Сбор завершён: $(date -u +%FT%TZ)"

      # Локальному action нужен репозиторий в рабочей копии. if: always() —
      # потому что шаг журнала тоже always(): без этого при падении основного
      # шага checkout пропускается, и запись в журнал снова не проходит.
      - name: Checkout for journal action
        if: always()
        uses: actions/checkout@v4
      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-server-stats"
          outcome: ${{ steps.probe.outcome }}
          body: ${{ steps.probe.outputs.stdout }}
