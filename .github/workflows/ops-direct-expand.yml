# expires: 2026-09-17 — одноразовое поручение; по истечении срока перенести в .github/workflows-archive/ или продлить через PR.
# Расширение кампании bs-test-2026-09 по поручению владельца 29.08.2026:
# укоротить Title и вернуть Title2 семи объявлениям (потеряны при создании,
# предупреждение 10254), добавить группы Cursor и Adobe под товарные
# запросы с наибольшим чистым коммерческим спросом Вордстата — компенсация
# ожидаемого падения объёма после EXACT-only автотаргетинга. Бюджет
# кампании не меняется.
#
# mode=dry-run — показать текущие тексты и план, записи в API нет;
# mode=apply — применить: обновить заголовки, создать группы, фразы,
# объявления (на модерацию), ограничить автотаргетинг новых групп.
name: ops-direct-expand
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать план; apply — применить"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Expand
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_expand.py "$MODE" 2>&1 | tee /tmp/direct-expand.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-expand.log ] || echo "(лог не создан)" > /tmp/direct-expand.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-expand.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-expand (mode=' + process.env.MODE + ') — Title2 и группы Cursor/Adobe\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
