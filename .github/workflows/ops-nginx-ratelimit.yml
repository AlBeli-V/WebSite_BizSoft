# Применение порогов обращений к публичным формам на прод-nginx (SEC-RL-001).
#
# Кладёт зоны учёта в /etc/nginx/conf.d/ и вставляет в живой server{} блок
# location'ов из deploy/nginx-rate-limit-locations.conf. Идемпотентно: блок
# ищется по маркеру «SEC-RL-001 begin», повторный запуск ничего не дублирует.
#
# Права: у деплой-пользователя нет беспарольного sudo (диагностика 23.08).
# Правка конфига и reload выполняются разово под root через одноразовый
# docker-контейнер (--rm, chroot /host) — тем же способом, что и в
# ops-nginx-reports: пользователь состоит в группе docker, sudoers не
# меняется, после выхода контейнера повышенных прав не остаётся.
#
# Безопасность применения: перед правкой снимается копия конфига рядом с
# оригиналом. Если nginx -t не проходит, копия возвращается на место,
# conf.d-файл удаляется (если его положил этот же запуск), и шаг падает с
# ненулевым кодом — живой сайт остаётся на прежнем конфиге.
#
# Результат — комментарий в журнал-issue #22.
name: ops-nginx-ratelimit
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false — только показать текущее состояние; true — применить"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
  issues: write
jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      # Зоны учёта приезжают вместе с защитой форм (PR #143). Без них
      # location'ы сошлются на несуществующую зону и nginx -t не пройдёт —
      # честнее упасть здесь, с внятной причиной, чем на сервере.
      - name: Проверить, что исходные файлы на месте
        run: |
          MISSING=0
          for f in deploy/nginx-rate-limit.conf deploy/nginx-rate-limit-locations.conf; do
            if [ ! -s "$f" ]; then echo "НЕТ файла $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::В main нет файлов рубежа 1. Сначала слейте PR с защитой публичных форм (SEC-RL-001)."
            exit 1
          fi
          echo "--- зоны:"; cat deploy/nginx-rate-limit.conf
          echo "--- location'ы:"; cat deploy/nginx-rate-limit-locations.conf

      - name: Copy configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'deploy/nginx-rate-limit.conf,deploy/nginx-rate-limit-locations.conf'
          target: /tmp/bizsoft-ratelimit
          strip_components: 1

      - name: Apply on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -e
            echo "== окружение =="
            SUDO=""
            sudo -n true 2>/dev/null && SUDO="sudo -n"
            DOCKER=НЕТ
            docker info >/dev/null 2>&1 && DOCKER=да
            echo "пользователь: $(id -un), sudo без пароля: $([ -n "$SUDO" ] && echo да || echo НЕТ), docker: $DOCKER"

            echo
            echo "== текущее состояние =="
            CONF=$(grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v '\.bak' | head -1)
            if [ -z "$CONF" ] && [ -n "$SUDO" ]; then
              CONF=$($SUDO grep -rl "server_name biz-soft.pro" /etc/nginx 2>/dev/null | grep -v '\.bak' | head -1)
            fi
            echo "конфиг сайта: ${CONF:-НЕ НАЙДЕН}"
            [ -n "$CONF" ]
            if [ -f /etc/nginx/conf.d/bizsoft-rate-limit.conf ]; then
              echo "зоны учёта: файл на месте"
            else
              echo "зоны учёта: файла нет"
            fi
            if grep -q "SEC-RL-001" "$CONF" 2>/dev/null; then
              echo "блок location'ов: уже в конфиге"
            else
              echo "блок location'ов: в конфиге нет"
            fi
            echo "--- limit_req в конфиге сайта:"
            grep -n "limit_req" "$CONF" 2>/dev/null || echo "  (нет)"

            if [ "$P_APPLY" != "true" ]; then
              echo
              echo "apply=false: изменений не делалось"
              rm -rf /tmp/bizsoft-ratelimit
              exit 0
            fi

            # Скрипт, исполняемый под root. Идемпотентен и самооткатываем:
            # при неудачном nginx -t возвращает конфиг из копии и падает.
            cat > /tmp/bz-ratelimit-apply.sh <<'ROOTEOF'
            #!/bin/bash
            set -e
            conf=$(grep -rl "server_name biz-soft.pro" /etc/nginx | grep -v '\.bak' | head -1)
            stamp=$(date +%Y%m%d-%H%M%S)
            backup="$conf.bak-ratelimit-$stamp"
            zones=/etc/nginx/conf.d/bizsoft-rate-limit.conf
            zones_added=нет

            cp -p "$conf" "$backup"
            echo "копия конфига: $backup"

            if [ -f "$zones" ]; then
              cp -p "$zones" "$zones.bak-$stamp"
              echo "зоны уже были, копия: $zones.bak-$stamp"
            else
              zones_added=да
            fi
            cp /tmp/bizsoft-ratelimit/nginx-rate-limit.conf "$zones"
            echo "зоны учёта записаны: $zones"

            python3 - "$conf" <<'PYEOF'
            import sys
            conf = sys.argv[1]
            block = open('/tmp/bizsoft-ratelimit/nginx-rate-limit-locations.conf',
                         encoding='utf-8').read().rstrip('\n')
            text = open(conf, encoding='utf-8').read()
            if 'SEC-RL-001' in text:
                print('блок location’ов уже есть — файл не меняю')
            else:
                marker = '    location / {'
                assert marker in text, 'маркер "location / {" не найден'
                open(conf, 'w', encoding='utf-8').write(
                    text.replace(marker, block + '\n\n' + marker, 1))
                print('блок location’ов вставлен перед location /')
            PYEOF

            # Точка проверки. Всё, что ниже, выполняется только на исправном
            # конфиге; иначе откат и ненулевой код возврата.
            if ! nginx -t; then
              echo "nginx -t НЕ ПРОШЁЛ — откатываю"
              cp -p "$backup" "$conf"
              if [ "$zones_added" = "да" ]; then rm -f "$zones"; else cp -p "$zones.bak-$stamp" "$zones"; fi
              nginx -t && echo "конфиг возвращён в исходное состояние"
              exit 1
            fi

            systemctl reload nginx 2>/dev/null && echo 'nginx перечитан (systemctl)' \
              || { nginx -s reload && echo 'nginx перечитан (nginx -s reload)'; }
            grep -n "limit_req\|SEC-RL-001" "$conf" | head -8
            ROOTEOF
            chmod +x /tmp/bz-ratelimit-apply.sh

            if [ -n "$SUDO" ]; then
              $SUDO /tmp/bz-ratelimit-apply.sh
            elif [ "$DOCKER" = "да" ]; then
              echo "sudo нет — разовое выполнение под root в одноразовом контейнере (--rm)"
              docker run --rm --pid=host -v /:/host alpine:3 chroot /host /bin/bash /tmp/bz-ratelimit-apply.sh
            else
              echo "ни sudo, ни docker — применить нечем"
              exit 1
            fi

            rm -f /tmp/bz-ratelimit-apply.sh
            rm -rf /tmp/bizsoft-ratelimit
            echo "временные файлы удалены; sudoers не менялся, контейнер удалён — повышенных прав не осталось"

      # Проверка снаружи: порог действительно срабатывает.
      #
      # Запрос из двух символов выбран намеренно. Эндпоинт отсекает такие
      # ещё до справочника (`if (q.length < 3) return json({ items: [] })`),
      # то есть проверка не стоит ни одного платного вызова DaData, а зона
      # nginx считает запросы независимо от строки запроса. Формы
      # /api/lead и /api/quote не трогаются вовсе — заявок не создаётся.
      - name: Probe rate limit
        if: inputs.apply == 'true'
        run: |
          URL="https://biz-soft.pro/api/suggest/party?q=ab"
          echo "40 запросов к $URL (без обращения к справочнику)"
          CODES=""
          for i in $(seq 1 40); do
            CODES="$CODES $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL")"
          done
          echo "коды ответов:$CODES"
          case "$CODES" in
            *429*) echo "✓ порог срабатывает: 429 получен" ;;
            *) echo "::error::429 не получен ни разу — зоны не подключены. Проверьте include /etc/nginx/conf.d/*.conf в nginx.conf"; exit 1 ;;
          esac

      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-nginx-ratelimit (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
