# Ежедневный сбор SEO-данных из Google Search Console и Яндекс.Вебмастера
# в reports/seo/data/ ветки-хранилища seo-data (утренний отчёт читает эти
# файлы). Код исполняется из main, данные живут отдельно — обмен через
# scripts/seo/data_sync.sh.
# Расписание: 03:07 UTC = 06:07 МСК — до формирования отчёта.
# Время в cron задаётся в UTC; московское указано рядом (правило проекта).
# Минута выбрана «некруглой» сознательно: слот 02:40 системно дрейфовал у
# GitHub на часы (фактические запуски в 13:00+ UTC), письмо уходило по
# вчерашним данным. Некруглые слоты планировщик задерживает меньше.
# Секреты: GSC_SERVICE_ACCOUNT_JSON, YANDEX_WEBMASTER_TOKEN,
# YANDEX_METRIKA_TOKEN, YANDEX_METRIKA_COUNTER_ID, GA4_PROPERTY_ID,
# YANDEX_DIRECT_TOKEN.

name: seo-data-collect

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-data-collect.yml"
      - "scripts/seo/collect.py"
      - "scripts/seo/collect_daily.py"
      - "scripts/seo/sitemap_inventory.py"
      - "scripts/seo/index_coverage.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Данные накатываются до прогона: push отправляет каталоги данных
      # целиком, и без предварительного pull он затёр бы хранилище
      # устаревшими копиями из main.
      - name: Pull data branch
        run: bash scripts/seo/data_sync.sh pull

      - name: Install deps
        run: pip install --quiet requests google-auth

      - name: Collect GSC + Yandex data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ secrets.YANDEX_METRIKA_COUNTER_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 scripts/seo/collect.py

      # Дневная факт-витрина (reports/seo/data/daily/): ряды «дата → значение»
      # без скользящих окон. Первый прогон забирает историю с июня, дальше —
      # только хвост. Сбой шага виден в статусе прогона, но данные агрегатного
      # пути уже записаны и уйдут в хранилище (push стоит if: always()).
      - name: Collect daily series
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ secrets.YANDEX_METRIKA_COUNTER_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 scripts/seo/collect_daily.py

      # Статистика Яндекс.Директа (Direct Control Report, этап A): группы и
      # реальные поисковые запросы кампании → reports/seo/ppc/direct-stats.json.
      # Без токена шаг тихо пропускается, сбой выгрузки не стирает прежнюю
      # витрину — письмо продолжает строиться по последней удачной.
      - name: Collect Direct stats
        if: always()
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        run: python3 scripts/ppc/direct_report.py

      # Инвентарь URL из живого sitemap прода (секретов не требует: sitemap
      # публичный; у сессии egress к проду закрыт, у раннера — открыт).
      # Основа zero-impression отчёта и реестра first-seen (Indexation SLA).
      - name: Collect sitemap inventory
        if: always()
        run: python3 scripts/seo/sitemap_inventory.py

      # Покрытие индекса по каждому URL инвентаря: URL Inspection Google
      # (квота 2000/сутки, прогон берёт ≤1800) и выборки Вебмастера — страницы
      # в поиске и причины исключения. Даёт zero-impression отчёту причину
      # вместо общего «разобрать». Шаг идёт после инвентаря: без него
      # инспектировать нечего; секреты — те же, что у основного сбора.
      - name: Collect index coverage
        if: always()
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
        run: python3 scripts/seo/index_coverage.py

      - name: Push data
        if: always()
        run: bash scripts/seo/data_sync.sh push "SEO-данные GSC/Яндекс за $(date -u +%F)" "reports/seo/data reports/seo/ppc"

      # Копии почтового и публикационного workflow обязаны совпадать с main:
      # push-события seo-data исполняют именно копию, и отставшая копия делает
      # фиксы в main недействующими (так жил дефект guard из #169). Сверка и
      # обновление — ежедневно, здесь, потому что этот прогон и так держит
      # обе ветки под рукой.
      # Только сверка: пуш workflow-файлов из Actions невозможен в принципе —
      # GITHUB_TOKEN не имеет права workflows (проверено 28.08: remote
      # rejected). Актуальность копий поддерживает сессия при data_sync push;
      # этот шаг лишь поднимает предупреждение, если копия отстала.
      - name: Check workflow copies in seo-data
        if: always()
        run: |
          set -e
          git fetch origin seo-data
          stale=""
          for f in seo-report-email.yml seo-publish-web.yml; do
            src=".github/workflows/$f"
            if ! git cat-file -e "origin/seo-data:$src" 2>/dev/null; then
              stale="$stale $f(нет)"
              continue
            fi
            # Первые 4 строки копии — примечание «КОПИЯ ИЗ MAIN», дальше —
            # байт в байт содержимое файла из main.
            if ! cmp -s <(git show "origin/seo-data:$src" | tail -n +5) "$src"; then
              stale="$stale $f"
            fi
          done
          if [ -n "$stale" ]; then
            echo "::warning::копии workflow в seo-data отстали от main:$stale — обновит сессия при ближайшем data_sync push (Actions пушить workflow-файлы не может)"
          else
            echo "копии совпадают с main"
          fi
