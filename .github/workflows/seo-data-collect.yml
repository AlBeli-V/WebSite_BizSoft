# Ежедневный сбор SEO-данных из Google Search Console и Яндекс.Вебмастера
# в reports/seo/data/ ветки-хранилища seo-data (утренний отчёт читает эти
# файлы). Код исполняется из main, данные живут отдельно — обмен через
# scripts/seo/data_sync.sh.
# Расписание: 02:40 UTC = 05:40 МСК — до формирования отчёта.
# Время в cron задаётся в UTC; московское указано рядом (правило проекта).
# Секреты: GSC_SERVICE_ACCOUNT_JSON, YANDEX_WEBMASTER_TOKEN,
# YANDEX_METRIKA_TOKEN, YANDEX_METRIKA_COUNTER_ID, GA4_PROPERTY_ID.

name: seo-data-collect

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-data-collect.yml"
      - "scripts/seo/collect.py"
      - "scripts/seo/collect_daily.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Данные накатываются до прогона: push отправляет каталоги данных
      # целиком, и без предварительного pull он затёр бы хранилище
      # устаревшими копиями из main.
      - name: Pull data branch
        run: bash scripts/seo/data_sync.sh pull

      - name: Install deps
        run: pip install --quiet requests google-auth

      - name: Collect GSC + Yandex data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ secrets.YANDEX_METRIKA_COUNTER_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 scripts/seo/collect.py

      # Дневная факт-витрина (reports/seo/data/daily/): ряды «дата → значение»
      # без скользящих окон. Первый прогон забирает историю с июня, дальше —
      # только хвост. Сбой шага виден в статусе прогона, но данные агрегатного
      # пути уже записаны и уйдут в хранилище (push стоит if: always()).
      - name: Collect daily series
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ secrets.YANDEX_METRIKA_COUNTER_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python3 scripts/seo/collect_daily.py

      - name: Push data
        if: always()
        run: bash scripts/seo/data_sync.sh push "SEO-данные GSC/Яндекс за $(date -u +%F)"

      # Копии почтового и публикационного workflow обязаны совпадать с main:
      # push-события seo-data исполняют именно копию, и отставшая копия делает
      # фиксы в main недействующими (так жил дефект guard из #169). Сверка и
      # обновление — ежедневно, здесь, потому что этот прогон и так держит
      # обе ветки под рукой.
      - name: Sync workflow copies to seo-data
        if: always()
        run: |
          set -e
          tmp=$(mktemp -d)
          git fetch origin seo-data
          git worktree add --detach "$tmp" origin/seo-data
          changed=""
          for f in seo-report-email.yml seo-publish-web.yml; do
            src=".github/workflows/$f"
            dst="$tmp/.github/workflows/$f"
            mkdir -p "$tmp/.github/workflows"
            note="# КОПИЯ ИЗ MAIN. Push-триггер срабатывает только если файл workflow есть\n# в самой пушенной ветке, поэтому в ветке-хранилище seo-data лежит копия.\n# Обновляется автоматически шагом Sync workflow copies в seo-data-collect.\n"
            printf "%b" "$note" > "$dst.new"
            cat "$src" >> "$dst.new"
            if ! cmp -s "$dst.new" "$dst"; then
              mv "$dst.new" "$dst"
              changed="$changed $f"
            else
              rm "$dst.new"
            fi
          done
          if [ -n "$changed" ]; then
            git -C "$tmp" config user.name "Claude"
            git -C "$tmp" config user.email "noreply@anthropic.com"
            git -C "$tmp" add .github/workflows
            git -C "$tmp" commit -m "Синхронизация копий workflow с main:$changed"
            git -C "$tmp" push origin HEAD:seo-data || echo "::warning::копии workflow не синхронизированы (гонка push) — повтор завтра"
            echo "обновлено:$changed"
          else
            echo "копии совпадают с main"
          fi
          git worktree remove --force "$tmp"
