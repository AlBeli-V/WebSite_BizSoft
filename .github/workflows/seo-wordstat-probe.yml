# Разовая проверка API Вордстата (Yandex Cloud Search API v2): какие методы доступны,
# как ведут себя регион, устройства, типы соответствия, какие лимиты.
# Ключ не печатается — только статусы, форма ответа и примеры строк.
# Запуск: вручную (workflow_dispatch) или пушем самого файла воркфлоу.

name: seo-wordstat-probe

on:
  push:
    branches:
      - claude/biz-soft-rating-tracking-5rf03g
    paths:
      - ".github/workflows/seo-wordstat-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install --quiet requests

      - name: Probe Wordstat API
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          import requests

          TOKEN = os.environ["WORDSTAT_API_KEY"].strip()
          BASE = "https://searchapi.api.cloud.yandex.net/v2/wordstat"
          H = {"Authorization": f"Api-Key {TOKEN}", "Content-Type": "application/json"}

          def call(path, body, label=""):
              try:
                  r = requests.post(BASE + path, json=body, headers=H, timeout=40)
              except Exception as e:
                  print(f"  {path} {label}: сеть {type(e).__name__}")
                  return None
              print(f"  {path} {label}: HTTP {r.status_code}")
              if r.status_code != 200:
                  print(f"      {r.text[:280] or '(пусто)'}")
                  return None
              try:
                  return r.json()
              except Exception:
                  print("      не JSON")
                  return None

          print("== dynamics: подбор значений period и дат ==")
          for period in ("PERIOD_MONTHLY", "MONTHLY", "monthly", "PERIOD_DAILY", "PERIOD_WEEKLY"):
              d = call("/dynamics", {"phrase": "canva", "period": period,
                                     "fromDate": "2025-08-01", "toDate": "2026-08-01"}, period)
              if d:
                  print("      ключи:", list(d))
                  print("      ", json.dumps(d, ensure_ascii=False)[:700])
                  break

          print("== dynamics: недельный период, короткое окно ==")
          d = call("/dynamics", {"phrase": "canva", "period": "PERIOD_WEEKLY",
                                 "fromDate": "2026-06-01", "toDate": "2026-08-01",
                                 "regions": ["225"]}, "weekly+регион")
          if d:
              print("      ", json.dumps(d, ensure_ascii=False)[:700])

          print("== regions: полный формат ==")
          d = call("/regions", {"phrase": "canva"}, "canva")
          if d:
              print("      ключи:", list(d))
              rows = d.get("results") or []
              print(f"      строк: {len(rows)}")
              for row in sorted(rows, key=lambda x: -int(x.get("count", 0)))[:5]:
                  print("       ", json.dumps(row, ensure_ascii=False))

          print("== getRegionsTree: размер справочника ==")
          d = call("/getRegionsTree", {}, "")
          if d:
              def count(nodes):
                  return sum(1 + count(n.get("children") or []) for n in nodes)
              print("      узлов:", count(d.get("regions") or []))
              for n in (d.get("regions") or [])[:3]:
                  print("       корень:", n.get("id"), n.get("name"))

          print("== numPhrases: верхняя граница ==")
          for n in (200, 2000, 2001):
              d = call("/topRequests", {"phrase": "canva", "numPhrases": n, "regions": ["225"]}, f"n={n}")
              if d:
                  print("      получено строк:", len(d.get("results") or []),
                        "| ассоциаций:", len(d.get("associations") or []))
          PY
