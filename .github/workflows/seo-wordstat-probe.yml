# Разовая проверка доступа к API Вордстата: живой ли ключ, какой хост и схема авторизации,
# какие методы доступны и какие поля возвращаются. Ключ не печатается — только статусы,
# сертификаты хостов, форма ответа и обезличенные примеры строк.
# Запуск: вручную (workflow_dispatch) или пушем самого файла воркфлоу
# (dispatch по API недоступен, пока файла нет в main).

name: seo-wordstat-probe

on:
  push:
    branches:
      - claude/biz-soft-rating-tracking-5rf03g
    paths:
      - ".github/workflows/seo-wordstat-probe.yml"
  workflow_dispatch:
    inputs:
      phrase:
        description: "Фраза для пробного запроса"
        required: true
        default: "оплата canva для юридических лиц"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install --quiet requests

      - name: Probe Wordstat API
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          PHRASE: ${{ inputs.phrase || 'оплата canva для юридических лиц' }}
        run: |
          if [ -z "$WORDSTAT_API_KEY" ]; then
            echo "::error::Секрет WORDSTAT_API_KEY не задан"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, socket, ssl, time
          import requests

          TOKEN = os.environ["WORDSTAT_API_KEY"].strip()
          PHRASE = os.environ.get("PHRASE") or "оплата canva для юридических лиц"

          print(f"== 0. формат ключа: длина {len(TOKEN)}, префикс {TOKEN[:4]}…, "
                f"точек {TOKEN.count('.')}, дефисов {TOKEN.count('-')} ==")

          HOSTS = [
              "api.wordstat.yandex.net",
              "api.wordstat.yandex.ru",
              "wordstat.yandex.ru",
              "api-wordstat.yandex.net",
              "api.direct.yandex.com",
          ]

          print("== 1. DNS и сертификаты хостов ==")
          for host in HOSTS:
              try:
                  ip = socket.gethostbyname(host)
              except Exception as e:
                  print(f"  {host}: DNS не резолвится ({type(e).__name__})")
                  continue
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              try:
                  with socket.create_connection((host, 443), timeout=15) as sock:
                      with ctx.wrap_socket(sock, server_hostname=host) as ss:
                          cert = ss.getpeercert()
                  cn = dict(x[0] for x in cert.get("subject", ())).get("commonName", "?")
                  san = [v for k, v in cert.get("subjectAltName", ()) if k == "DNS"]
                  print(f"  {host} → {ip}; CN={cn}; SAN({len(san)}): {', '.join(san[:8])}")
              except Exception as e:
                  print(f"  {host} → {ip}; TLS-ошибка {type(e).__name__}: {e}")

          print("== 2. перебор баз, путей и схем авторизации ==")
          BASES = [
              "https://api.wordstat.yandex.net",
              "https://api.wordstat.yandex.ru",
          ]
          AUTHS = {
              "Bearer": f"Bearer {TOKEN}",
              "Api-Key": f"Api-Key {TOKEN}",
              "OAuth": f"OAuth {TOKEN}",
          }
          PATHS = ["/v1/topRequests", "/v1/regions"]
          ok = []
          for base in BASES:
              for path in PATHS:
                  for name, value in AUTHS.items():
                      body = {"phrase": PHRASE, "numPhrases": 5} if "top" in path else {"phrase": PHRASE}
                      t0 = time.time()
                      try:
                          r = requests.post(base + path, json=body, timeout=30,
                                            headers={"Authorization": value,
                                                     "Content-Type": "application/json"})
                      except Exception as e:
                          msg = str(e)
                          short = "hostname mismatch" if "Hostname mismatch" in msg else type(e).__name__
                          print(f"  {base}{path} [{name}]: сеть/TLS — {short}")
                          continue
                      ms = int((time.time() - t0) * 1000)
                      print(f"  {base}{path} [{name}]: HTTP {r.status_code} за {ms} мс; "
                            f"тело: {r.text[:200]}")
                      for k in ("X-RateLimit-Limit", "X-RateLimit-Remaining", "Retry-After"):
                          if k in r.headers:
                              print(f"      заголовок {k}: {r.headers[k]}")
                      if r.status_code == 200:
                          ok.append((base, path, name, r))

          print("== 3. структура успешных ответов ==")
          if not ok:
              print("  успешных ответов нет")
          for base, path, name, r in ok:
              try:
                  data = r.json()
              except Exception:
                  print(f"  {base}{path} [{name}]: ответ не JSON")
                  continue
              def walk(node, p=""):
                  if isinstance(node, dict):
                      for k, v in node.items():
                          walk(v, f"{p}.{k}")
                  elif isinstance(node, list) and node and isinstance(node[0], dict):
                      print(f"    примеры из {p} (до 5):")
                      for row in node[:5]:
                          print("      ", json.dumps(row, ensure_ascii=False)[:160])
              print(f"  {base}{path} [{name}]: ключи верхнего уровня "
                    f"{list(data)[:12] if isinstance(data, dict) else type(data).__name__}")
              walk(data)
          PY
