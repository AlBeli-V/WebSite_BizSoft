# Зачистка долларовых цен из приписок к цене (price_note) в прод-Directus.
# Пользователь должен видеть только рублёвые цены: фрагменты вида «($19/мес)»,
# «($20/мес при годовой оплате)» убираются; если в убранном была годовая оплата —
# приписка получает хвост «при годовой схеме оплаты»; «за место/пользователя» →
# «за 1 место/пользователя». Товары с «$» в short_description только перечисляются.
# apply=false — показать план (было/стало) без записи. Результат — в issue #22.
name: ops-strip-usd-notes
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true — применить изменения, false — только показать план'
        required: true
        default: 'false'
permissions:
  issues: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Strip USD from price notes
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL | tr -d '\r')
            ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD | tr -d '\r')
            export ADMIN_EMAIL ADMIN_PASSWORD
            python3 - <<'PYEOF'
            import json, os, re, urllib.request
            base = 'http://127.0.0.1:8055'
            def req(method, path, data=None, token=None):
                r = urllib.request.Request(base + path, method=method,
                    data=json.dumps(data).encode() if data is not None else None,
                    headers={'Content-Type': 'application/json',
                             **({'Authorization': f'Bearer {token}'} if token else {})})
                return json.load(urllib.request.urlopen(r))
            auth = req('POST', '/auth/login', {'email': os.environ['ADMIN_EMAIL'], 'password': os.environ['ADMIN_PASSWORD']})
            tok = auth['data']['access_token']
            apply = os.environ.get('P_APPLY', 'false').lower() == 'true'
            rows = req('GET', '/items/products?fields=id,slug,price_note,short_description&limit=-1', token=tok)['data']

            def transform(note):
                out = note
                annual = False
                def drop(m):
                    nonlocal annual
                    if 'годов' in m.group(0): annual = True
                    return ''
                out = re.sub(r'\s*\([^)]*\$[^)]*\)', drop, out)          # скобки с $
                if '$' in out:                                            # $ вне скобок
                    if 'годов' in out: annual = True
                    out = re.sub(r'[,;]?\s*[-—–]?\s*\$\s?\d[\d\s.,]*(?:/мес\.?|/год|\s*в\s+мес(?:яц)?)?[^,;.)]*', '', out)
                out = re.sub(r'\bза место\b', 'за 1 место', out)
                out = re.sub(r'\bза пользователя\b', 'за 1 пользователя', out)
                out = re.sub(r'\s{2,}', ' ', out).strip(' ,;—-')
                if annual and 'годов' not in out:
                    out += ' при годовой схеме оплаты'
                return out

            changed = 0
            for r in rows:
                note = r.get('price_note') or ''
                if '$' in note:
                    new = transform(note)
                    print(f"[{r['slug']}]")
                    print(f"  было:  {note}")
                    print(f"  стало: {new}")
                    if apply:
                        req('PATCH', f"/items/products/{r['id']}", {'price_note': new}, token=tok)
                    changed += 1
            print(f"\nprice_note с $: {changed} | режим: {'ПРИМЕНЕНО' if apply else 'план (без записи)'}")
            sd = [r['slug'] for r in rows if '$' in (r.get('short_description') or '')]
            print(f"short_description с $ (только список, не меняем): {len(sd)}")
            for s in sd: print('  -', s)
            PYEOF
      - name: Save result to file
        run: |
          cat > /tmp/ops-strip.txt <<'OPS_STRIP_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_STRIP_EOF
      - name: Post to issue
        uses: actions/github-script@v7
        env:
          APPLY: ${{ inputs.apply }}
        with:
          script: |
            const out = require('fs').readFileSync('/tmp/ops-strip.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: `### ops-strip-usd-notes (apply=${process.env.APPLY})\n\n\`\`\`\n${out}\n\`\`\``,
            });
