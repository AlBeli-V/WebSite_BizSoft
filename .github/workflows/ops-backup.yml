# Управление резервным копированием biz-soft.pro.
#
# Саму копию снимает сервер: /opt/bizsoft/backup.sh, запускаемый ночным cron
# сервера. Этот workflow — пульт к нему: ставит и обновляет скрипт, заводит
# расписание, показывает состояние и позволяет снять копию вне очереди.
#
# Почему не schedule этого workflow. 27.08.2026 планировщик GitHub не выдал
# ни одного запуска по расписанию за шесть часов: ежечасный workflow
# репозитория пропустил пять слотов подряд, ночная копия не снялась, RPO в
# 24 часа оказался нарушен. События schedule в Actions не гарантированы —
# при нагрузке их откладывают, а «круглые» слоты выбрасывают первыми.
# Резервное копирование не может зависеть от очереди без обязательств,
# поэтому расписание живёт в cron самого сервера.
#
# Режимы:
#   check     — осмотр без записи: контейнеры, место, секреты, доступ к
#               Google Drive, наличие строки в crontab, итог прошлой ночи;
#   backup    — снять копию вне очереди (ночная снимается сама);
#   install   — залить скрипт, настройки, конфиг rclone и поставить cron;
#   uninstall — снять строку из crontab (файлы и копии остаются на месте).
#
# Любой режим сначала обновляет /opt/bizsoft/backup.sh из репозитория:
# ручной прогон и ночной исполняют один и тот же код.
name: ops-backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — осмотр; backup — снять копию; install — поставить/обновить; uninstall — снять расписание"
        required: true
        default: "check"
        type: choice
        options: ["check", "backup", "install", "uninstall"]
      verify:
        description: "Проверять копию восстановлением во временный Postgres"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      offsite:
        description: "Выгружать зашифрованную копию в Google Drive"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      mail:
        description: "Письмо по итогу прогона (ночные шлют always из настроек сервера)"
        required: false
        default: "error"
        type: choice
        options: ["error", "always", "never"]
      mail_to:
        description: "Кому слать отчёты о ночных копиях (записывается при install)"
        required: false
        default: "avbelyaev@biz-soft.pro"
      keep_daily:
        description: "Сколько ежедневных копий хранить"
        required: false
        default: "7"
      keep_weekly:
        description: "Сколько еженедельных копий хранить"
        required: false
        default: "4"
      keep_monthly:
        description: "Сколько ежемесячных копий хранить"
        required: false
        default: "6"

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Скрипт и открытая инструкция едут на сервер в base64: так кириллица
      # и переносы строк переживают путь через ssh-action без искажений.
      - name: Prepare payload
        id: payload
        run: |
          echo "script=$(base64 -w0 scripts/ops/backup.sh)" >> "$GITHUB_OUTPUT"
          echo "runbook=$(base64 -w0 docs/DR-RUNBOOK.md)" >> "$GITHUB_OUTPUT"

      # Секрет принимаем в любом виде — и как base64, и как обычный текст
      # rclone.conf: разбираться, в каком виде его положили, должна машина,
      # а не человек в момент замены токена. Здесь же снимаются CR, из-за
      # которых строка "[gdrive]\r" не считалась секцией.
      - name: Normalize rclone config
        id: rcconf
        env:
          RAW: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          if [ -z "${RAW:-}" ]; then
            echo "секрет GDRIVE_RCLONE_CONF не задан"
            echo "b64=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEC=$(printf '%s' "$RAW" | tr -d '\r\n ' | base64 -d 2>/dev/null | tr -d '\r' || true)
          if printf '%s' "$DEC" | grep -q '^\[.*\]$'; then
            SRC="$DEC"; echo "секрет распознан как base64"
          else
            SRC="$RAW"; echo "секрет распознан как текст rclone.conf"
          fi
          NORM=$(printf '%s' "$SRC" | tr -d '\r')
          if ! printf '%s' "$NORM" | grep -q '^\[.*\]$'; then
            # Содержимое не печатаем — внутри refresh-токен Google.
            echo "✗ ни как base64, ни как текст в секрете не нашлось строки вида [имя]:"
            echo "  это не конфиг rclone. Длина значения: $(printf '%s' "$RAW" | wc -c) байт."
          fi
          B64=$(printf '%s' "$NORM" | base64 -w0)
          echo "::add-mask::$B64"
          echo "b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Run over SSH
        id: run
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          P_MODE: ${{ inputs.mode }}
          P_VERIFY: ${{ inputs.verify || 'true' }}
          P_OFFSITE: ${{ inputs.offsite || 'true' }}
          P_MAIL: ${{ inputs.mail || 'error' }}
          P_MAIL_TO: ${{ inputs.mail_to || 'avbelyaev@biz-soft.pro' }}
          P_KEEP_D: ${{ inputs.keep_daily || '7' }}
          P_KEEP_W: ${{ inputs.keep_weekly || '4' }}
          P_KEEP_M: ${{ inputs.keep_monthly || '6' }}
          P_PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          P_RCLONE: ${{ steps.rcconf.outputs.b64 }}
          P_SCRIPT: ${{ steps.payload.outputs.script }}
          P_RUNBOOK: ${{ steps.payload.outputs.runbook }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_MODE,P_VERIFY,P_OFFSITE,P_MAIL,P_MAIL_TO,P_KEEP_D,P_KEEP_W,P_KEEP_M,P_PASS,P_RCLONE,P_SCRIPT,P_RUNBOOK
          capture_stdout: true
          command_timeout: 40m
          script: |
            set -uo pipefail
            BASE=/opt/bizsoft
            mkdir -p "$BASE"

            # ── доставка кода ──────────────────────────────────────────
            # Скрипт обновляется при любом режиме: расхождение между тем,
            # что лежит в репозитории, и тем, что исполняет ночной cron, —
            # источник ошибок, которые обнаруживаются в момент аварии.
            printf '%s' "$P_SCRIPT" | base64 -d > "$BASE/backup.sh.new" 2>/dev/null
            if [ ! -s "$BASE/backup.sh.new" ]; then
              echo "✗ backup.sh не доехал — на сервере ничего не меняем"; rm -f "$BASE/backup.sh.new"; exit 1
            fi
            # Битый скрипт не должен заменить рабочий: проверяем синтаксис
            # до подмены, иначе ночная копия сломается молча.
            if ! bash -n "$BASE/backup.sh.new" 2>/dev/null; then
              echo "✗ доехавший backup.sh не проходит проверку синтаксиса — оставляем прежний"
              rm -f "$BASE/backup.sh.new"; exit 1
            fi
            mv "$BASE/backup.sh.new" "$BASE/backup.sh" && chmod 700 "$BASE/backup.sh"
            printf '%s' "$P_RUNBOOK" | base64 -d > "$BASE/README-RESTORE.md" 2>/dev/null
            echo "backup.sh: $(wc -l < "$BASE/backup.sh") строк; README-RESTORE.md: $(wc -c < "$BASE/README-RESTORE.md") байт"
            echo

            case "$P_MODE" in
              install)
                echo "════ УСТАНОВКА ════"
                umask 077
                # Настройки ночного прогона. Пароль нужен здесь же: без него
                # cron не сможет зашифровать архив перед выгрузкой.
                {
                  echo "# Настройки резервного копирования biz-soft.pro."
                  echo "# Создан workflow ops-backup (режим install), правки руками перетрутся."
                  echo "# Пароль продублирован в менеджере паролей руководителя и в секрете"
                  echo "# GitHub BACKUP_PASSPHRASE — при смене менять во всех трёх местах."
                  echo "BACKUP_PASSPHRASE=$P_PASS"
                  echo "MAIL_TO=$P_MAIL_TO"
                  echo "MAIL_ON=always"
                  echo "VERIFY=$P_VERIFY"
                  echo "OFFSITE=$P_OFFSITE"
                  echo "KEEP_D=$P_KEEP_D"
                  echo "KEEP_W=$P_KEEP_W"
                  echo "KEEP_M=$P_KEEP_M"
                } > "$BASE/backup.env"
                chmod 600 "$BASE/backup.env"
                echo "backup.env записан (пароль: $([ -n "$P_PASS" ] && echo задан || echo НЕ ЗАДАН), отчёты: $P_MAIL_TO)"

                if [ -n "${P_RCLONE:-}" ]; then
                  printf '%s' "$P_RCLONE" | base64 -d 2>/dev/null | tr -d '\r' > "$BASE/rclone.conf"
                  chmod 600 "$BASE/rclone.conf"
                  RN=$(sed -n 's/^\[\(.*\)\]$/\1/p' "$BASE/rclone.conf" | head -1)
                  echo "rclone.conf записан, хранилище: ${RN:-НЕ РАСПОЗНАНО}"
                else
                  echo "⚠ секрет GDRIVE_RCLONE_CONF пуст — конфиг rclone не записан, выгрузки не будет"
                fi

                # Время в crontab — локальное для сервера. Вычисляем его из
                # 00:30 UTC, чтобы прогон шёл в 03:30 МСК независимо от того,
                # в каком поясе живёт машина.
                CRON_HM=$(date -d '2026-06-15 00:30 UTC' +'%M %H')
                TMPC=$(mktemp)
                crontab -l 2>/dev/null | sed '/bizsoft-backup >>>/,/bizsoft-backup <<</d' > "$TMPC"
                {
                  echo '# >>> bizsoft-backup >>>'
                  echo '# Ночная резервная копия biz-soft.pro (03:30 МСК). Ставится и'
                  echo '# снимается только через workflow ops-backup (install/uninstall).'
                  echo "$CRON_HM * * * $BASE/backup.sh backup >/dev/null 2>&1"
                  echo '# <<< bizsoft-backup <<<'
                } >> "$TMPC"
                if crontab "$TMPC"; then
                  rm -f "$TMPC"
                  echo "расписание установлено (время сервера $(date +%Z%z)):"
                  crontab -l | sed -n '/bizsoft-backup >>>/,/bizsoft-backup <<</p' | sed 's/^/  /'
                else
                  rm -f "$TMPC"; echo "✗ crontab не принял расписание"; exit 1
                fi
                echo
                echo "════ ПРОВЕРОЧНЫЙ ОСМОТР ════"
                MODE=check VERIFY="$P_VERIFY" OFFSITE="$P_OFFSITE" \
                  BACKUP_PASSPHRASE="$P_PASS" MAIL_ON=never \
                  "$BASE/backup.sh" check
                ;;

              uninstall)
                echo "════ СНЯТИЕ РАСПИСАНИЯ ════"
                TMPC=$(mktemp)
                crontab -l 2>/dev/null | sed '/bizsoft-backup >>>/,/bizsoft-backup <<</d' > "$TMPC"
                crontab "$TMPC" && rm -f "$TMPC"
                echo "строка из crontab удалена; скрипт, настройки и снятые копии остались на месте"
                echo "ночных копий больше не будет — снимать вручную режимом backup"
                ;;

              *)
                # Значения из окружения перекрывают файл настроек: ручной
                # прогон должен слушаться полей ввода, а не ночных настроек.
                MODE="$P_MODE" VERIFY="$P_VERIFY" OFFSITE="$P_OFFSITE" \
                  KEEP_D="$P_KEEP_D" KEEP_W="$P_KEEP_W" KEEP_M="$P_KEEP_M" \
                  BACKUP_PASSPHRASE="$P_PASS" RCLONE_CONF_B64="$P_RCLONE" \
                  MAIL_ON="$P_MAIL" MAIL_TO="$P_MAIL_TO" \
                  "$BASE/backup.sh" "$P_MODE"
                ;;
            esac

      - name: Post results to journal (issue #22)
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.stdout }}
          RESULT: ${{ steps.run.outcome }}
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const out = (process.env.OUT || '(нет вывода)').slice(0, 60000);
            const mark = process.env.RESULT === 'success' ? '✓' : '✗';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body: `### ops-backup (${process.env.MODE}) ${mark} · ` +
                new Date().toISOString() + '\n```\n' + out + '\n```',
            });

      - name: Fail the run if it failed
        # Шаг по SSH помечен continue-on-error, чтобы отчёт в журнал попадал
        # и при поломке. Красный статус прогона возвращаем здесь.
        if: steps.run.outcome != 'success'
        run: |
          echo "Прогон завершился с ошибкой — подробности в issue #22"
          exit 1
