# Перенос ранее скачанных КП в воронку заявок.
#
# До появления воронки скачивание КП уходило письмом и оседало в коллекции
# quotes, но заявкой не становилось: канал с самыми полными данными (компания,
# ИНН, контакты, состав корзины) в аналитике не существовал.
#
# Нажимать «Подтянуть КП» руками в /admin не нужно — тот же вызов делается
# отсюда. Токен админ-инструментов читается на сервере из astro.env и в
# параметры запуска не попадает: они видны всем, у кого есть доступ к
# репозиторию.
#
# По умолчанию сухой прогон: показывает, что будет заведено, ничего не меняя.
# apply=true выполняет перенос. Операция идемпотентна — КП, уже отражённое
# заявкой, второй раз не заводится.
name: ops-crm-backfill

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false — только показать план; true — выполнить перенос"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Import quotes into funnel
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          capture_stdout: true
          command_timeout: 10m
          script: |
            set -e
            TOKEN=$(sed -n 's/^ADMIN_TOOLS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            if [ -z "$TOKEN" ]; then
              echo "ADMIN_TOOLS_TOKEN не задан в /opt/bizsoft/astro.env — перенос невозможен"
              exit 1
            fi
            APPLY=${P_APPLY:-false}
            echo "режим: $([ "$APPLY" = "true" ] && echo 'перенос' || echo 'сухой прогон')"

            # Разбор ответа лежит отдельным файлом, а путь к данным приходит
            # аргументом: `python3 -` читает программу со стандартного ввода,
            # поэтому передать туда же данные нельзя — они не дойдут.
            cat > /tmp/crm-backfill.py <<'PYEOF'
            import json, sys
            code, path = sys.argv[1], sys.argv[2]
            try:
                raw = open(path, encoding="utf-8").read()
                d = json.loads(raw)
            except Exception:
                raw = locals().get("raw", "")
                print(f"HTTP {code}, ответ не разобран: {raw[:600] or '(пусто)'}")
                sys.exit(1)
            if "error" in d:
                print(f"HTTP {code}, ошибка: {d['error']}")
                sys.exit(1)
            s = d["summary"]
            print(f"КП в базе: {d['quotes_total']}")
            print(f"уже в воронке (пропущено): {s['skipped']}")
            if s.get("skipped_no_number"):
                print(f"без номера, сопоставить нечем: {s['skipped_no_number']} — разобрать вручную")
            print(f"к переносу: {s['planned']}")
            if d["dry_run"]:
                print("сухой прогон — ничего не изменено")
            else:
                print(f"заведено заявок: {s['created']}")
                print(f"добавлено событий к открытым заявкам: {s['attached']}")
            for p in d["planned"]:
                total = f"{p['total']:,}".replace(",", " ")
                print(f"  № {p['quote_no']} — {p['company'] or 'без компании'} — {total} ₽ — {p['action']}")
            PYEOF

            CODE=$(curl -sS --max-time 120 -o /tmp/crm-backfill.json -w '%{http_code}' \
              -X POST http://127.0.0.1:3000/api/admin/crm/import-quotes \
              -H "Content-Type: application/json" \
              -H "x-admin-token: $TOKEN" \
              -d "{\"apply\": $APPLY}" || echo "000")
            python3 /tmp/crm-backfill.py "$CODE" /tmp/crm-backfill.json
            rm -f /tmp/crm-backfill.json /tmp/crm-backfill.py
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-crm-backfill (${{ inputs.apply == 'true' && 'перенос' || 'сухой прогон' }})"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
