# Перевод каталога Directus на артикулы единой системы (docs/rules/sku-system.md):
# по карте data/catalog/sku-map.json (старый → новый) переименовать sku и
# parent_sku у всех позиций любого статуса. Сначала apply=false — план
# в журнал issue #22; затем apply=true. Идемпотентно: позиция с уже новым
# артикулом пропускается. Позиции без записи в карте (черновики,
# заведённые после среза) перечисляются в отчёте и не трогаются.
# После apply=true — прогон ops-catalog-watch с baseline=true: сторож
# сравнивает снимки по артикулу, иначе покажет 1561 «исчезновение».
name: ops-sku-migrate
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true — применить; false — только план'
        required: false
        default: 'false'
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Migrate SKUs in Directus
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL | tr -d '\r')
            ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD | tr -d '\r')
            export ADMIN_EMAIL ADMIN_PASSWORD
            python3 - <<'PYEOF'
            import datetime, json, os, re, urllib.error, urllib.request
            SRC = '/opt/bizsoft/astro-src/data/catalog/sku-map.json'
            base = 'http://127.0.0.1:8055'
            APPLY = os.environ.get('P_APPLY', 'false').strip().lower() == 'true'
            SYSTEM = re.compile(r'^[A-Z][A-Z0-9]{1,3}-(LIC|ADD|CRD|GFT|SVC)-[A-Z0-9]{2,12}-(TEAM|IND|UNI)-([1-9]\d?[MY]|PERP|BAL)-(USER|DEV|SRV|CCU|ORG|PROJ|PACK|NOM)(-[A-Z0-9]{1,12})?$')
            def req(method, path, data=None, token=None):
                r = urllib.request.Request(base + path, method=method,
                    data=json.dumps(data).encode() if data is not None else None,
                    headers={'Content-Type': 'application/json',
                             **({'Authorization': f'Bearer {token}'} if token else {})})
                try:
                    return json.load(urllib.request.urlopen(r))
                except urllib.error.HTTPError as e:
                    print('HTTP', e.code, e.read().decode()[:500]); raise
            if not os.path.exists(SRC):
                print('файл не найден:', SRC); print('карты на сервере нет: деплой её не разложил'); raise SystemExit(1)
            mtime = datetime.datetime.utcfromtimestamp(os.path.getmtime(SRC)).isoformat()
            skumap = json.load(open(SRC, encoding='utf-8'))['map']
            print(f'карта: {SRC} (обновлена {mtime} UTC), записей: {len(skumap)}')
            token = req('POST', '/auth/login', {'email': os.environ['ADMIN_EMAIL'], 'password': os.environ['ADMIN_PASSWORD']})['data']['access_token']
            rows = req('GET', '/items/products?fields=id,sku,parent_sku,status,name,slug&limit=-1', token=token)['data']
            print(f'позиций в базе (любой статус): {len(rows)}')
            taken = {r['sku'] for r in rows}
            plan, done, unmapped, collisions = [], 0, [], []
            for r in rows:
                sku = r.get('sku') or ''
                parent = r.get('parent_sku') or None
                new = skumap.get(sku)
                new_parent = skumap.get(parent) if parent else None
                if new is None and SYSTEM.match(sku):
                    done += 1
                elif new is None:
                    unmapped.append(f"{sku} [{r.get('status')}] {r.get('name')} (slug: {r.get('slug')})")
                if new is None and new_parent is None:
                    continue
                patch = {'id': r['id']}
                if new is not None:
                    if new in taken:
                        collisions.append(f'{sku} → {new}: новый артикул уже занят другой позицией'); continue
                    patch['sku'] = new
                if new_parent is not None:
                    patch['parent_sku'] = new_parent
                plan.append((sku, patch))
            print(f'к переименованию: {len(plan)}; уже в новой системе: {done}; без записи в карте: {len(unmapped)}; коллизий: {len(collisions)}')
            for line in collisions: print('  ✖', line)
            if unmapped:
                print('без записи в карте (не трогаются):')
                for line in unmapped: print('  -', line)
            for sku, patch in plan[:15]:
                print(f"  {sku} → {patch.get('sku', '(sku без изменений)')}" + (f" [parent → {patch['parent_sku']}]" if 'parent_sku' in patch else ''))
            if len(plan) > 15: print(f'  … и ещё {len(plan) - 15}')
            if collisions: raise SystemExit(1)
            if not APPLY:
                print('DRY-RUN: ничего не записано; запустите с apply=true'); raise SystemExit(0)
            applied = 0
            for i in range(0, len(plan), 100):
                batch = [patch for _, patch in plan[i:i + 100]]
                req('PATCH', '/items/products', batch, token=token)
                applied += len(batch)
            print(f'APPLY: переименовано позиций: {applied}')
            # Контроль: старых артикулов из карты в базе не осталось.
            rows2 = req('GET', '/items/products?fields=sku,parent_sku&limit=-1', token=token)['data']
            left = [r['sku'] for r in rows2 if r.get('sku') in skumap]
            left_parent = [r['parent_sku'] for r in rows2 if r.get('parent_sku') in skumap]
            print(f'осталось старых sku: {len(left)}, старых parent_sku: {len(left_parent)}')
            if left or left_parent: raise SystemExit(1)
            PYEOF

      - name: Save result to file
        if: always()
        run: |
          cat > /tmp/ops-sku-migrate.txt <<'OPS_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_EOF
      - name: Checkout for journal action
        if: always()
        uses: actions/checkout@v4
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-sku-migrate (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body-file: /tmp/ops-sku-migrate.txt
