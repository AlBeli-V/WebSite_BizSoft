# Применение схемы Directus на проде (scripts/directus-setup.mjs).
# Скрипт идемпотентен: существующие коллекции и поля не трогает, добавляет
# недостающие. Запускается в одноразовом контейнере на внутренней docker-сети,
# потому что Directus наружу не смотрит.
#
# ВНИМАНИЕ. Скрипт делает две вещи сверх схемы:
#   1) пересоздаёт токен служебной учётки и кладёт его в /tmp/bz/token;
#   2) досыпает демо-каталог (4 раздела, 7 товаров) при их отсутствии.
# После него ОБЯЗАТЕЛЬНО запускать ops-directus-token-sync: иначе сайт остаётся
# со старым токеном, каталог пустеет и карточки отдают 404. Проверено 20.08.2026
# на проде — именно это и произошло.
#
# Результат — комментарий в журнал issue #22.

name: ops-directus-schema

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "schema-only — только добавить поля (безопасно); full — полный прогон с пересозданием токена и демо-данными"
        required: true
        default: "schema-only"
        type: choice
        options: ["schema-only", "full"]

permissions:
  contents: read
  issues: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - name: Checkout
        # always() — шаг журнала ниже тоже always(): без этого при
        # падении раннего шага checkout пропустится и запись не пройдёт.
        if: always()
        uses: actions/checkout@v4

      - name: Выбрать режим
        id: mode
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            echo "SETUP_ARGS=" >> "$GITHUB_ENV"
            echo "Режим: полный прогон — токен будет пересоздан, демо-данные досыпаны."
          else
            echo "SETUP_ARGS=--schema-only" >> "$GITHUB_ENV"
            echo "Режим: только схема — токен не трогаем, демо-данные не досыпаем."
          fi

      - name: Copy setup script to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: scripts/directus-setup.mjs
          target: /tmp/
          strip_components: 1

      - name: Apply schema
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          command_timeout: 10m
          envs: SETUP_ARGS
          script: |
            set -e
            mkdir -p /tmp/bz
            docker run --rm --network bizsoft_default \
              -e DIRECTUS_URL=http://directus:8055 \
              -e ENV_FILE=/env -e TOKEN_OUT=/out/token \
              -v /opt/bizsoft/.env:/env:ro \
              -v /tmp/bz:/out \
              -v /tmp/directus-setup.mjs:/setup.mjs:ro \
              node:22-alpine node /setup.mjs ${SETUP_ARGS}

      - name: Warn about token reset
        if: inputs.mode == 'full'
        run: |
          echo "::warning::Полный прогон пересоздал токен служебной учётки. Запустите ops-directus-token-sync, иначе сайт потеряет доступ к базе и карточки начнут отдавать 404."

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-directus-schema"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
