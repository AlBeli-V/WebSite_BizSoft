# Применение схемы Directus на проде (scripts/directus-setup.mjs).
# Скрипт идемпотентен: существующие коллекции и поля не трогает, добавляет
# недостающие. Запускается в одноразовом контейнере на внутренней docker-сети,
# потому что Directus наружу не смотрит.
# Результат — комментарий в журнал issue #22.

name: ops-directus-schema

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy setup script to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: scripts/directus-setup.mjs
          target: /tmp/
          strip_components: 1

      - name: Apply schema
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          command_timeout: 10m
          script: |
            set -e
            mkdir -p /tmp/bz
            docker run --rm --network bizsoft_default \
              -e DIRECTUS_URL=http://directus:8055 \
              -e ENV_FILE=/env -e TOKEN_OUT=/out/token \
              -v /opt/bizsoft/.env:/env:ro \
              -v /tmp/bz:/out \
              -v /tmp/directus-setup.mjs:/setup.mjs:ro \
              node:22-alpine node /setup.mjs

      - name: Post results to journal (issue #22)
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.stdout }}
        with:
          script: |
            const out = (process.env.OUT || '(нет вывода)').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body: `### ops-directus-schema · ${new Date().toISOString()}\n\n\`\`\`\n${out}\n\`\`\``,
            });
