# Открытие/закрытие товарных фидов на проде (рубильник YANDEX_FEEDS_ENABLED).
#
# Правило руководителя 29.08.2026 (CLAUDE.md): решения о публикации фидов
# принимает только он. Этот workflow — исполнение такой команды: пишет
# значение в /opt/bizsoft/astro.env, перезапускает контейнер astro (env_file
# действует в рантайме, пересборка не нужна) и проверяет фактический статус
# каждого фида. Результат — комментарием в журнал-issue #22.
#
# enabled: "" (пусто) — закрыть все; "all" — открыть все;
#          "yandex-direct" или список через запятую — открыть перечисленные.

name: ops-yandex-feeds-toggle

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: 'YANDEX_FEEDS_ENABLED: пусто=закрыть все, all=все, или список id (yandex-products,yandex-business,yandex-direct,yandex-market)'
        required: false
        default: ''

permissions:
  issues: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Toggle feeds on server
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_ENABLED: ${{ inputs.enabled }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_ENABLED
          command_timeout: 10m
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            STAMP=$(date +%Y%m%d-%H%M%S)
            cp -p ./astro.env "./astro.env.bak-$STAMP"
            sed -i '/^YANDEX_FEEDS_ENABLED=/d' ./astro.env
            if [ -n "$P_ENABLED" ]; then
              printf 'YANDEX_FEEDS_ENABLED=%s\n' "$P_ENABLED" >> ./astro.env
              echo "YANDEX_FEEDS_ENABLED=$P_ENABLED записан в astro.env"
            else
              echo "YANDEX_FEEDS_ENABLED удалён из astro.env — все фиды закрыты"
            fi
            # Перезапуск, а не restart: env_file читается при создании контейнера.
            docker compose up -d --force-recreate astro
            sleep 8
            echo
            echo "== Фактический статус фидов =="
            for p in yandex-products.yml yandex-business.xml yandex-direct.yml yandex-market.yml; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://biz-soft.pro/$p")
              DIS=$(curl -sI --max-time 30 "https://biz-soft.pro/$p" | grep -i '^x-feed-status:' | tr -d '\r' || true)
              if [ "$CODE" = "200" ]; then
                OFFERS=$(curl -sf --max-time 60 "https://biz-soft.pro/$p" | grep -c '<offer ' || true)
                echo "  /$p → HTTP $CODE, ОТКРЫТ, офферов: $OFFERS"
              else
                echo "  /$p → HTTP $CODE ${DIS:+($DIS)}"
              fi
            done

      # Локальному action нужен репозиторий в рабочей копии. if: always() —
      # потому что шаг журнала тоже always(): без этого при падении основного
      # шага checkout пропускается, и запись в журнал снова не проходит.
      - name: Checkout for journal action
        if: always()
        uses: actions/checkout@v4
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: 'ops-yandex-feeds-toggle · enabled="${{ inputs.enabled }}"'
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
