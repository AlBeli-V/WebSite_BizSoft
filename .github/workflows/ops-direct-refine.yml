# Доводка кампании bs-test-2026-09, раунд 2 — по фактам дня 01.09.2026:
# минус-слова «активация/активировать/ключ», групповая минус-фраза
# «команды для» в Claude Code, перенос подтверждённых запросов в фразы.
# Обоснование — reports/marketing/direct-refine-plan-2026-09-02.md.
#
# Перед изменениями скрипт проверяет, что ни один минус не задевает
# собственную ключевую фразу, и падает, если задевает.
#
# mode=dry-run — показать план, в API только чтение;
# mode=apply — применить изменения в кабинете.
name: ops-direct-refine
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать план; apply — применить"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Refine
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_refine.py "$MODE" 2>&1 | tee /tmp/direct-refine.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-refine.log ] || echo "(лог не создан)" > /tmp/direct-refine.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-refine.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-refine (mode=' + process.env.MODE + ') — доводка bs-test-2026-09, раунд 2\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
