# Ежедневная переоценка каталога по курсу ЦБ.
# 1) action=refresh — подтянуть курс USD/EUR с cbr.ru в Directus;
# 2) action=reprice-apply (scope all) — пересчитать все привязанные к валюте
#    товары (peg_to_usd) по формуле себестоимость × курс × коэффициент;
#    зафиксированные вручную (price_locked) не трогаются.
# Выполняется на сервере: админ-API слушает 127.0.0.1:3000, токен —
# ADMIN_TOOLS_TOKEN из /opt/bizsoft/astro.env. Результат — в журнал issue #22.

name: ops-currency-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * *' # ежедневно 07:10 МСК

permissions:
  contents: read
  issues: write

jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Refresh CBR rate and reprice pegged products
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          capture_stdout: true
          script: |
            set -e -o pipefail
            TOKEN=$(sed -n 's/^ADMIN_TOOLS_TOKEN=//p' /opt/bizsoft/astro.env | tr -d '"\r')
            if [ -z "$TOKEN" ]; then echo "ADMIN_TOOLS_TOKEN не найден в astro.env — переоценка не выполнена"; exit 1; fi
            # Таймаут 60 секунд был рассчитан на каталог в тысячу позиций.
            # После партии ManageEngine их около шести тысяч, и запрос,
            # не уложившись, обрывался бы на середине: часть цен обновлена,
            # часть нет, и в журнале «ошибка сети» вместо внятной причины.
            api() {
              curl -sSf --max-time 600 -X POST http://127.0.0.1:3000/api/admin/currency \
                -H "Content-Type: application/json" -H "x-admin-token: $TOKEN" -d "$1"
            }
            echo "== refresh курса ЦБ =="
            api '{"action":"refresh"}' | head -c 1500; echo
            echo "== переоценка привязанных товаров =="
            # Замеряем длительность: это единственное место, где видно, во что
            # обходится ночная переоценка выросшего каталога. Без замера
            # «успевает или нет» остаётся догадкой до первого сбоя.
            START=$(date +%s)
            api '{"action":"reprice-apply","scope":{"type":"all"}}' | head -c 1500; echo
            echo "== длительность переоценки: $(( $(date +%s) - START )) с =="
            echo "   (было рассчитано на ~1100 позиций, стало ~5900)"

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-currency-refresh"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.stdout }}
