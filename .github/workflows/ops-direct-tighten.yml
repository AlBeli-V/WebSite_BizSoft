# Затяжка кампании bs-test-2026-09 по поручению владельца 31.08.2026:
# автотаргетинг последней discovery-группы (Claude Code) → только «целевые
# запросы» (EXACT), групповые минусы по фактам двух дней открутки (включая
# «cloud» — Google Cloud Code), перенос целевых поисковых запросов в фразы.
# Обоснование — ops-direct-stats за 28.08 и 31.08 в issue #22 и
# reports/marketing/direct-tighten-plan-2026-08-31.md.
#
# mode=dry-run — показать план, в API только чтение;
# mode=apply — применить изменения в кабинете.
name: ops-direct-tighten
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать план; apply — применить"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Tighten
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_tighten.py "$MODE" 2>&1 | tee /tmp/direct-tighten.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-tighten.log ] || echo "(лог не создан)" > /tmp/direct-tighten.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-tighten.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-tighten (mode=' + process.env.MODE + ') — затяжка bs-test-2026-09\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
