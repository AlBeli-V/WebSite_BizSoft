# Проба Google SERP через DataForSEO (контур конкурентной разведки).
#
# Делает один бесплатный вызов проверки аккаунта (баланс) и РОВНО ОДИН платный
# запрос Google organic (live/advanced, ~$0.002) — отвечает: работают ли
# учётные данные DATAFORSEO_LOGIN/DATAFORSEO_PASSWORD и что видно в выдаче.
# Read-only, сайт и кабинеты не трогает. Результат — комментарием в
# журнал-issue #22. Ручной запуск — только с main (правило CLAUDE.md).
name: ci-serp-probe
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Поисковый запрос пробы'
        required: false
        default: 'купить figma'
      location_code:
        description: 'Гео Google: 2643 = Россия, 1011969 = Москва'
        required: false
        default: '2643'
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Запуск разрешён только с ветки main (правило проекта)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe DataForSEO
        id: run
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          QUERY: ${{ inputs.query }}
          LOCATION_CODE: ${{ inputs.location_code }}
        run: |
          pip install --quiet requests
          {
            echo 'result<<SERP_EOF'
            python3 competitive-intelligence/serp/dataforseo_probe.py || true
            echo 'SERP_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Post to issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body: '### ci-serp-probe (DataForSEO) · ' + new Date().toISOString() + '\n\n```\n' + process.env.RESULT + '\n```',
            });
