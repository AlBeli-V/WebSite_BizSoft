# Статистика кампании Яндекс.Директа bs-test-2026-09: только чтение.
#
# Собирает состояние кампании/групп/объявлений/фраз и отчёты Reports API
# (по дням, условиям показа, поисковым запросам с классификацией интента
# A–E и кандидатами в фразы, устройствам, площадкам), а из Метрики —
# конверсии кампании в разбивке по целям и поведение визитов по запросам
# и посадочным (поручение владельца 31.08, пункт P1 аудита).
# Результат публикуется в журнал issue #22.
# Ничего не создаёт, не меняет и не удаляет ни в кабинете, ни на проде.
# Токен в лог не попадает.
#
# Расписание: по будням в 04:10 UTC = 07:10 МСК, после готовности данных
# Директа за вчерашний день (механизм накопления опыта, P3 аудита
# direct-audit-2026-08-29.md).
name: ops-direct-stats
on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 1-5"  # 07:10 МСК, будни
permissions:
  contents: read
  issues: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect stats
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_METRIKA_COUNTER_ID: ${{ secrets.YANDEX_METRIKA_COUNTER_ID }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_stats.py 2>&1 | tee /tmp/direct-stats.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-stats.log ] || echo "(лог не создан)" > /tmp/direct-stats.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-stats.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-stats — статистика кампании bs-test-2026-09\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
