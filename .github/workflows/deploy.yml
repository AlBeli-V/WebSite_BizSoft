# Автодеплой BizSoft по git-пушу в main.
# ТРЕБУЕТ настройки секретов репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST   — IP/хост сервера (напр. 159.194.216.59)
#   SSH_USER   — deploy
#   SSH_KEY    — приватный SSH-ключ с доступом к серверу
# Совместим с GitHub / GitLab (для GitLab переписать на .gitlab-ci.yml аналогично).

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # версия берётся из package.json (packageManager: pnpm@9.15.9)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & test & build (проверка перед деплоем)
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      # Раньше здесь был сторонний easingthemes/ssh-deploy@main. Ссылка на
      # подвижную ветку означала, что любой новый коммит в чужом репозитории
      # автоматически исполнялся на нашем раннере с приватным ключом от
      # прод-сервера. Закрепить по SHA — тоже вариант, но вызов и так
      # укладывается в несколько строк rsync, поэтому зависимость убрана.
      # Флаги и список исключений сохранены дословно.
      - name: Sync source to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # --delete: без него на сервере навсегда остаются файлы, которых нет
          # в репозитории (напр. старый src/pages/vendors/adobe.astro продолжал
          # перекрывать актуальный шаблон [slug].astro при каждой сборке).
          # Исключённые пути (node_modules, dist, .env) rsync при --delete
          # не трогает — они защищены самими правилами exclude.
          rsync -rlgoDzvc -i --delete \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.astro/' \
            --exclude '.git/' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:/opt/bizsoft/astro-src"

      - name: Rebuild & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: bash /opt/bizsoft/deploy.sh
