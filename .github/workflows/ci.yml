# Проверки качества на каждый push и pull request.
#
# Задача — ловить поломку до деплоя. deploy.yml запускает свой набор перед
# выкладкой, но срабатывает только на push в main, то есть уже поздно.
#
# Блокирующий состав наращивается по мере устранения находок аудита.
# С 21.08.2026 блокирует всё: тесты, типы, сборка, проверки артефакта и смоук.
#
# Режим отчёта снят потому, что именно в нём копился долг. Пока смоук и
# проверки артефакта не роняли сборку, в них годами жили дубли <loc> в карте
# сайта, отсутствующий раздел /vendors, каталог, отдающий 200 с пустой
# страницей при недоступной базе, и внутренние ссылки с завершающим слешем —
# при trailingSlash: 'never'. Ни одна из этих находок не была замечена
# человеком: отчёт, который ничего не останавливает, никто не читает.
name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ВНИМАНИЕ: имя джоба verify зарегистрировано как обязательная проверка
  # (required status check) в ruleset main-protection. Поэтому:
  #   - НЕ переименовывать джоб verify;
  #   - НЕ добавлять ему name: (ruleset сверяется с отображаемым именем чека);
  #   - НЕ добавлять workflow фильтры paths / paths-ignore;
  #   - НЕ вешать на джоб условные if:.
  # Любое из этих изменений приведёт к тому, что в части PR чек verify вообще
  # не будет создан, и такой PR навсегда зависнет в ожидании несуществующей
  # обязательной проверки.
  #
  # PR, изменяющий сам ci.yml, может заблокировать собственное слияние:
  # для события pull_request GitHub берёт workflow из merge-коммита, поэтому
  # удаление файла, переименование джоба или добавление фильтра путей приведёт
  # к тому, что требуемый чек не появится, а слить PR, чтобы это починить,
  # будет нельзя.
  #
  # Порядок разблокировки: Settings → Rules → Rulesets → main-protection →
  # Enforcement status: Disabled → слить PR → вернуть Active.
  # Bypass list пуст намеренно, иного выхода нет.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit-тесты
        run: pnpm test

      # Аналитика, исследование спроса и выравнивание веток написаны на
      # Python, и их тесты до сих пор запускались только вручную. Тест,
      # который никто не гоняет, регрессию не ловит: так в выравнивание
      # веток уехал вызов несуществующей команды pnpm check, и первый же
      # рабочий прогон отбраковал все ветки подряд.
      - name: Python-тесты
        # Каталог тестов задан и как стартовый, и как корневой: пакетов
        # __init__.py в проекте нет, и с корнем репозитория discover
        # отказывается импортировать стартовый каталог.
        #
        # Число найденных тестов проверяется отдельно: discover, не нашедший
        # ничего, выходит с кодом 0 и печатает «Ran 0 tests». Шаг был бы
        # зелёным и не проверял ничего — ровно та беда, ради которой он и
        # добавлен.
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/seo/tests -t scripts/seo/tests \
            -p 'test_*.py' 2>&1 | tee /tmp/py-tests.log
          grep -qE '^Ran [1-9][0-9]* tests' /tmp/py-tests.log \
            || { echo 'Тестов не найдено — проверка ничего не значит'; exit 1; }

      - name: Проверка типов
        run: pnpm typecheck

      - name: Сборка
        run: pnpm build

      - name: Проверки артефакта
        run: pnpm check:artifacts

      - name: Смоук против стаба Directus
        run: pnpm smoke
