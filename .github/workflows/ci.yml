# Проверки качества на каждый pull request.
#
# Задача — ловить поломку до деплоя. deploy.yml запускает свой набор перед
# выкладкой, но срабатывает только на push в main, то есть уже поздно.
#
# Блокирующий состав наращивается по мере устранения находок аудита.
# С 21.08.2026 блокирует всё: тесты, типы, сборка, проверки артефакта и смоук.
#
# Режим отчёта снят потому, что именно в нём копился долг. Пока смоук и
# проверки артефакта не роняли сборку, в них годами жили дубли <loc> в карте
# сайта, отсутствующий раздел /vendors, каталог, отдающий 200 с пустой
# страницей при недоступной базе, и внутренние ссылки с завершающим слешем —
# при trailingSlash: 'never'. Ни одна из этих находок не была замечена
# человеком: отчёт, который ничего не останавливает, никто не читает.
#
# Триггер push снят 03.09.2026: событие срабатывало на каждый push в ветку
# с открытым PR наравне с pull_request, и verify гонялся дважды на один и
# тот же коммит (702 прогона за три недели). workflow_dispatch оставлен для
# ручного перезапуска.
name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  # ВНИМАНИЕ: имя джоба verify зарегистрировано как обязательная проверка
  # (required status check) в ruleset main-protection. Поэтому:
  #   - НЕ переименовывать джоб verify;
  #   - НЕ добавлять ему name: (ruleset сверяется с отображаемым именем чека);
  #   - НЕ добавлять workflow фильтры paths / paths-ignore;
  #   - НЕ вешать на джоб условные if:.
  # Любое из этих изменений приведёт к тому, что в части PR чек verify вообще
  # не будет создан, и такой PR навсегда зависнет в ожидании несуществующей
  # обязательной проверки.
  #
  # PR, изменяющий сам ci.yml, может заблокировать собственное слияние:
  # для события pull_request GitHub берёт workflow из merge-коммита, поэтому
  # удаление файла, переименование джоба или добавление фильтра путей приведёт
  # к тому, что требуемый чек не появится, а слить PR, чтобы это починить,
  # будет нельзя.
  #
  # Порядок разблокировки: Settings → Rules → Rulesets → main-protection →
  # Enforcement status: Disabled → слить PR → вернуть Active.
  # Bypass list пуст намеренно, иного выхода нет.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit-тесты
        run: pnpm test

      # Аналитика, исследование спроса и выравнивание веток написаны на
      # Python, и их тесты до сих пор запускались только вручную. Тест,
      # который никто не гоняет, регрессию не ловит: так в выравнивание
      # веток уехал вызов несуществующей команды pnpm check, и первый же
      # рабочий прогон отбраковал все ветки подряд.
      # Локальный action journal-post — это файлы репозитория: без checkout
      # в том же job раннер его не находит, и запись результата в журнал
      # операций не проходит. 03.09.2026 так одновременно ослепли 50 ops-
      # воркфлоу — работа выполнялась, отчёт не доезжал. Сторож дешевле, чем
      # ловить это по одному упавшему прогону.
      - name: Журнал операций — checkout перед локальным action
        run: python3 scripts/ci/check-workflow-journal.py

      # Синтаксис встроенных python-скриптов воркфлоу: ошибка внутри heredoc
      # иначе обнаруживается только на сервере.
      - name: Python-скрипты воркфлоу
        run: python3 scripts/ci/check-workflow-python.py

      - name: Python-тесты
        # Каталог тестов задан и как стартовый, и как корневой: пакетов
        # __init__.py в проекте нет, и с корнем репозитория discover
        # отказывается импортировать стартовый каталог.
        #
        # Число найденных тестов проверяется отдельно: discover, не нашедший
        # ничего, выходит с кодом 0 и печатает «Ran 0 tests». Шаг был бы
        # зелёным и не проверял ничего — ровно та беда, ради которой он и
        # добавлен.
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/seo/tests -t scripts/seo/tests \
            -p 'test_*.py' 2>&1 | tee /tmp/py-tests.log
          grep -qE '^Ran [1-9][0-9]* tests' /tmp/py-tests.log \
            || { echo 'Тестов не найдено — проверка ничего не значит'; exit 1; }

      - name: Тесты конкурентной разведки
        # Отдельный контур со своим кодом и своими данными, поэтому и прогон
        # отдельный: падение его тестов не должно выглядеть как поломка
        # базового SEO-конвейера. Проверка «Ran N tests» — по той же причине,
        # что и выше: пустой discover выходит с кодом 0.
        run: |
          set -o pipefail
          python3 -m unittest discover -s competitive-intelligence/tests \
            -t competitive-intelligence/tests -p 'test_*.py' 2>&1 \
            | tee /tmp/ci-tests.log
          grep -qE '^Ran [1-9][0-9]* tests' /tmp/ci-tests.log \
            || { echo 'Тестов не найдено — проверка ничего не значит'; exit 1; }

      - name: Тесты операционных сторожей
        # Сторож каталога решает, уходит ли письмо руководителю: ложное
        # срабатывание на ежедневной переоценке по курсу ЦБ сделало бы его
        # шумом, а пропущенное снятие карточки с витрины — бесполезным.
        # Проверка «Ran N tests» — по той же причине, что и выше.
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/ops/tests \
            -t scripts/ops/tests -p 'test_*.py' 2>&1 \
            | tee /tmp/ops-tests.log
          grep -qE '^Ran [1-9][0-9]* tests' /tmp/ops-tests.log \
            || { echo 'Тестов не найдено — проверка ничего не значит'; exit 1; }

      - name: Проверка типов
        run: pnpm typecheck

      - name: Сборка
        run: pnpm build

      - name: Проверки артефакта
        run: pnpm check:artifacts

      - name: Смоук против стаба Directus
        run: pnpm smoke

      # Инцидент 04–08.09.2026: тег Метрики перевели на прокси своего
      # домена, и сайт четверо суток не собирал визиты. Ни одна проверка
      # не заметила: все смотрели на код ответа и размер файла, а прокси
      # отдавал 200 и файл нужного размера — браузер считал скрипт
      # загруженным, счётчик не запускался. Здесь проверяется другое: что
      # в браузере дошло до вызова ym(id, 'init', …). Тег подменяется
      # заглушкой, поэтому шаг не зависит от чужой сети.
      # Браузера на раннере нет: Playwright ставится как пакет, но бинарь
      # тянется отдельно. Ставим только Chromium — остальные движки
      # проверке не нужны.
      - name: Установка Chromium для браузерных проверок
        run: pnpm exec playwright install --with-deps chromium

      # Предел времени: браузерные шаги ходят в сеть и поднимают Chromium,
      # и 22.09.2026 check:mobile завис на раннере — тридцать секунд работы
      # превратились в сорок минут тишины, а снять прогон не вышло даже
      # отменой: зависший раннер не отвечает и на неё. Без предела такой
      # шаг молчит до шестичасового потолка job'а и держит PR без сигнала.
      # Пять минут — вдесятеро больше обычного прогона: настоящий отказ
      # виден сразу, а медленный раннер в предел укладывается.
      - name: Счётчик запускается в браузере
        timeout-minutes: 5
        run: pnpm check:metrika

      # Горизонтальная прокрутка на телефоне — не мелочь вёрстки: Safari
      # отдаёт странице всю ширину документа, и сайт съезжает к левому краю
      # с пустой полосой справа. Ни один из прежних сторожей ширину layout'а
      # не мерил, и дефект нашёлся глазами на iPhone (12.09.2026).
      # Живой сайт с настоящим контентом сторожит ops-mobile-layout.
      - name: Вёрстка на узких экранах
        timeout-minutes: 5
        run: pnpm check:mobile
