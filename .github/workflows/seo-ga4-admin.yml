# Разовая утилита: настройка key events в GA4 через Admin API
# (сервисный аккаунт GSC_SERVICE_ACCOUNT_JSON, property GA4_PROPERTY_ID).
# Помечает form_submit как key event (конверсию). Требует роль Editor
# у сервисного аккаунта в Property access management.

name: seo-ga4-admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-ga4-admin.yml"

jobs:
  keyevent:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install --quiet requests google-auth
      - name: Mark form_submit as key event
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          info = json.loads(os.environ['GSC_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/analytics.edit'])
          creds.refresh(Request())
          h = {'Authorization': f'Bearer {creds.token}'}
          prop = os.environ['GA4_PROPERTY_ID'].strip()
          base = f'https://analyticsadmin.googleapis.com/v1beta/properties/{prop}/keyEvents'

          r = requests.get(base, headers=h, timeout=30)
          print('Существующие key events:', r.status_code, r.text[:500])
          existing = [k.get('eventName') for k in r.json().get('keyEvents', [])] if r.ok else []

          for event in ('form_submit', 'generate_lead'):
              if event in existing:
                  print(f'{event}: уже помечен как key event')
                  continue
              r = requests.post(base, headers=h, timeout=30,
                                json={'eventName': event, 'countingMethod': 'ONCE_PER_EVENT'})
              print(f'{event}: HTTP {r.status_code}: {r.text[:400]}')
          PY
