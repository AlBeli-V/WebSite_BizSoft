# expires: 2026-09-17 — одноразовое поручение; по истечении срока перенести в .github/workflows-archive/ или продлить через PR.
# Пакет минус-слов кампании bs-test-2026-09 (поручение владельца 03.09.2026).
# Добавляет маркеры пиратского и активационного интента по фактам поведения
# визитов: такие запросы дают 100% отказов и 0-1 секунду на сайте.
# Обоснование и разбор — reports/marketing/direct-negatives-v4-2026-09-03.md.
#
# Перед добавлением каждое слово проверяется на пересечение с действующими
# фразами кампании: режущее свою семантику в пакет не попадает.
# Минус-слова применяются мгновенно, перемодерация не нужна — запуск
# безопасен в рабочее время показов.
#
# mode=dry-run — показать пакет и проверку, в API только чтение;
# mode=apply — применить.
name: ops-direct-negatives
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — показать пакет; apply — применить"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "apply"]
permissions:
  contents: read
  issues: write
jobs:
  negatives:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Negatives
        id: run
        env:
          DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/ppc/direct_negatives.py "$MODE" 2>&1 | tee /tmp/direct-negatives.log

      - name: Save log for issue
        if: always()
        run: |
          [ -f /tmp/direct-negatives.log ] || echo "(лог не создан)" > /tmp/direct-negatives.log

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/direct-negatives.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
              body: '### ops-direct-negatives (mode=' + process.env.MODE + ') — минус-слова bs-test-2026-09\n\n```\n'
                + log.slice(0, 58000)
                + '\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
