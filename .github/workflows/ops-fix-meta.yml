# Починка мета-тегов товарных карточек в прод-Directus по правилам.
# Тексты не выдумываются: title собирается из названия товара, description —
# из существующего short_description; правится только то, что сломано.
#   meta_title       — пусто / старое написание «BizSoft» / длиннее 60
#   meta_description — пусто / обрыв фразы «…» / длиннее 160
# apply=false — план (было/стало) без записи. Журнал — issue #22.
name: ops-fix-meta
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true — записать в Directus, false — только план'
        required: true
        default: 'false'
      only:
        description: 'Ограничить слагами через запятую (пусто — весь каталог)'
        required: false
permissions:
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает (см. прогон #41
      # ops-yandex-recrawl 03.09.2026).
      - uses: actions/checkout@v4

      - name: Fix meta tags
        id: run
        uses: appleboy/ssh-action@v1
        env:
          P_APPLY: ${{ inputs.apply }}
          P_ONLY: ${{ inputs.only }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: P_APPLY,P_ONLY
          capture_stdout: true
          script: |
            set -e
            cd /opt/bizsoft
            ADMIN_EMAIL=$(docker compose exec -T directus printenv ADMIN_EMAIL | tr -d '\r')
            ADMIN_PASSWORD=$(docker compose exec -T directus printenv ADMIN_PASSWORD | tr -d '\r')
            export ADMIN_EMAIL ADMIN_PASSWORD
            python3 - <<'PYEOF'
            import datetime, json, os, re, urllib.error, urllib.parse, urllib.request
            base = 'http://127.0.0.1:8055'
            BRAND = 'BIZSoft'
            TAIL = ' Оплата по счёту, закрывающие через ЭДО.'
            TAIL_SHORT = ' Оплата по счёту, ЭДО.'
            TITLE_MAX, DESC_MAX = 60, 160

            def req(method, path, data=None, token=None):
                r = urllib.request.Request(base + path, method=method,
                    data=json.dumps(data).encode() if data is not None else None,
                    headers={'Content-Type': 'application/json',
                             **({'Authorization': f'Bearer {token}'} if token else {})})
                return json.load(urllib.request.urlopen(r))

            # служебные слова, на которых нельзя обрывать фразу
            STOP = {'с', 'в', 'на', 'и', 'для', 'по', 'из', 'к', 'у', 'о', 'от', 'до', 'за',
                    'при', 'над', 'под', 'а', 'но', 'или', 'что', 'как', 'же', 'то', 'из-за'}

            def trim_words(text, limit):
                """Обрезка по границе слова без многоточия внутри фразы."""
                if len(text) <= limit:
                    return text
                cut = text[:limit]
                sp = cut.rfind(' ')
                return (cut[:sp] if sp > limit * 0.6 else cut).rstrip(' ,;:-—')

            def tidy(body):
                """Снимаем висящий хвост: предлог, союз, одинокое число, обрывок слова."""
                while True:
                    words = body.split()
                    if len(words) < 2:
                        return body
                    w = words[-1].strip('.,;:—-()«»').lower()
                    if w in STOP or w.isdigit() or len(w) <= 1:
                        body = ' '.join(words[:-1])
                        continue
                    return body

            # След обрезки: перед брендом осталась висящая пунктуация —
            # «ManageEngine DataSecurity Plus Professional, | BIZSoft».
            CUT_MARK = re.compile(r'[,;:\-–—(]\s*\|\s*' + re.escape(BRAND) + r'\s*$')

            def is_cut(t, name):
                """Заголовок — обрезок названия, а не самостоятельная формулировка.

                Снимаем бренд и хвост «— купить для юрлица»: если остаток
                оказался строгим началом названия товара, значит его отрезали
                по словам и различитель линейки потерян
                («ManageEngine Mobile Device Manager Plus MSP» вместо
                «…MSP Professional, Single User License with 50 Mobile Devices»).
                Написанные руками заголовки началом названия не являются и под
                это правило не попадают.
                """
                if not t or not t.rstrip().endswith(f'| {BRAND}'):
                    return False
                body = t.rsplit('|', 1)[0].strip()
                body = re.sub(r'\s*—\s*купить для юрлица$', '', body).strip()
                body = body.rstrip(' ,;:—–-')
                return bool(body) and name.startswith(body) and body != name.strip()

            def build_title(name, cur, free=lambda t: True):
                t = (cur or '').replace('BizSoft', BRAND).strip()
                if CUT_MARK.search(t) or is_cut(t, name):
                    t = ''          # обрезанный огрызок пересобираем с нуля
                if not t:
                    t = f'{name} — купить для юрлица | {BRAND}'
                if len(t) <= TITLE_MAX and free(t):
                    return t
                # длинный заголовок укорачиваем целыми смысловыми кусками,
                # а не обрезкой посередине скобки. Кандидат без скобочной части
                # пропускаем, если он уже занят соседом: у пар вида
                # «WordPress.com Business (первая покупка)» и «(продление)»
                # различие живёт именно в скобках.
                short = re.sub(r'\s*\([^)]*\)', '', name).strip()
                for cand in (f'{short} — купить для юрлица | {BRAND}',
                             f'{name} — купить для юрлица | {BRAND}',
                             f'{name} | {BRAND}',
                             f'{short} | {BRAND}'):
                    if len(cand) <= TITLE_MAX and free(cand):
                        return cand
                # Обрезать название по словам нельзя: у линеек вроде
                # «ManageEngine DataSecurity Plus Professional, Data Leak
                # Prevention, 100 Workstations» под нож идёт именно различитель,
                # и соседние карточки получают один заголовок-огрызок
                # («…Professional, | BIZSoft»). Прогон 01.09.2026 так создал
                # 75 групп дублей там, где их не было. Поэтому поле остаётся
                # пустым: заголовком станет полное название товара — длинное,
                # но различимое. Уже записанный огрызок затирается.
                return '' if not t or t.rstrip().endswith(f'| {BRAND}') else t

            def build_desc(short, cur):
                cur = (cur or '').strip()
                if cur and '…' not in cur and len(cur) <= DESC_MAX:
                    return cur                        # хорошее описание не трогаем
                lead = (short or '').strip()
                if not lead:
                    return cur
                for tail in (TAIL, TAIL_SHORT, ''):
                    room = DESC_MAX - len(tail)
                    body = lead if len(lead) <= room else trim_words(lead, room)
                    if len(lead) > room:
                        # заканчиваем последним завершённым предложением,
                        # иначе — последним элементом перечисления
                        dot = body.rfind('.')
                        if dot > room * 0.5:
                            body = body[:dot]
                        else:
                            comma = body.rfind(',')
                            if comma > room * 0.5:
                                body = body[:comma]
                        # не оставляем разорванную скобку «(Photoshop, ... и др.»
                        if body.count('(') > body.count(')'):
                            body = body[:body.rfind('(')]
                        body = tidy(body)
                    body = body.rstrip(' .,;:-—') + '.'
                    if len(body) + len(tail) <= DESC_MAX:
                        return (body + tail).strip()
                return trim_words(lead, DESC_MAX).rstrip(' .,;:-—') + '.'

            TEXT_FIELDS = ('short_description', 'description', 'seo_text',
                           'for_whom', 'features', 'use_cases', 'faq')

            def fix_brand(v):
                """Написание бренда внутри строк, списков и объектов."""
                if isinstance(v, str):
                    return v.replace('BizSoft', BRAND)
                if isinstance(v, list):
                    return [fix_brand(i) for i in v]
                if isinstance(v, dict):
                    return {k: fix_brand(i) for k, i in v.items()}
                return v

            def noindex(sku):
                s = (sku or '').upper()
                return s.startswith('JB-PLG-') or (s.startswith('JB-') and s.endswith('-IND'))

            apply = os.environ.get('P_APPLY', 'false').lower() == 'true'
            only = [s.strip() for s in os.environ.get('P_ONLY', '').split(',') if s.strip()]
            auth = req('POST', '/auth/login', {'email': os.environ['ADMIN_EMAIL'], 'password': os.environ['ADMIN_PASSWORD']})
            tok = auth['data']['access_token']
            flt = {'status': {'_eq': 'published'}}
            if only:
                flt['slug'] = {'_in': only}
            url = ('/items/products?limit=-1&sort[]=vendor&sort[]=name'
                   '&fields=id,slug,name,sku,meta_title,meta_description,' + ','.join(TEXT_FIELDS)
                   + f'&filter={urllib.parse.quote(json.dumps(flt))}')
            rows = [r for r in req('GET', url, token=tok)['data'] if not noindex(r.get('sku'))]
            print(f'карточек к проверке: {len(rows)} | режим: '
                  f"{'ПРИМЕНЕНО' if apply else 'план (без записи)'}\n")
            stats = {'title': 0, 'desc': 0}
            changed = 0
            # какие описания уже заняты в каталоге: и чтобы не плодить дубли,
            # и чтобы видеть коллизии внутри самого прогона
            taken_desc = {}
            taken_title = {}
            for r in rows:
                d = (r.get('meta_description') or '').strip()
                if d:
                    taken_desc.setdefault(d, r['slug'])
                tt = (r.get('meta_title') or '').strip()
                # занятыми считаем только исправные заголовки: огрызки и так
                # будут переписаны, держать их в реестре незачем
                if tt and not (CUT_MARK.search(tt) or is_cut(tt, r['name'])):
                    taken_title.setdefault(tt, r['slug'])
            for r in rows:
                patch = {}
                # единое написание бренда во всех текстовых полях карточки,
                # включая списки (features, use_cases, faq)
                for f in TEXT_FIELDS:
                    cur = r.get(f)
                    fixed = fix_brand(cur)
                    if fixed != cur:
                        patch[f] = fixed
                nt = build_title(r['name'], r.get('meta_title'),
                                 lambda cand: taken_title.get(cand, r['slug']) == r['slug'])
                if nt != (r.get('meta_title') or ''):
                    patch['meta_title'] = nt
                if nt:
                    taken_title[nt] = r['slug']
                nd = build_desc(r.get('short_description'), r.get('meta_description'))
                # short_description у линейки часто общий на все объёмы и
                # редакции — тогда описание получают одинаковое. Разводим
                # названием товара: оно уже несёт различитель.
                if nd and taken_desc.get(nd, r['slug']) != r['slug']:
                    marked = build_desc(f"{r['name']}. {(r.get('short_description') or '').strip()}", '')
                    if marked and taken_desc.get(marked, r['slug']) == r['slug']:
                        nd = marked
                if nd and nd != (r.get('meta_description') or ''):
                    patch['meta_description'] = nd
                if nd:
                    taken_desc[nd] = r['slug']
                if not patch:
                    continue
                changed += 1
                print(f"[{r['slug']}]")
                for f in ('meta_title', 'meta_description') + TEXT_FIELDS:
                    if f in patch:
                        if f in TEXT_FIELDS:
                            stats['brand'] = stats.get('brand', 0) + 1
                            print(f'  {f}: написание бренда приведено к {BRAND}')
                            continue
                        stats['title' if f == 'meta_title' else 'desc'] += 1
                        print(f"  {f} было ({len(r.get(f) or '')}): {r.get(f) or '—'}")
                        print(f"  {f} стало ({len(patch[f])}): {patch[f]}")
                if apply:
                    # Штамп содержательного изменения для lastmod в sitemap;
                    # без поля в схеме — запись без штампа (см. ops-apply-descriptions).
                    stamp = {**patch, 'content_updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
                    try:
                        req('PATCH', f"/items/products/{r['id']}", stamp, token=tok)
                    except urllib.error.HTTPError:
                        req('PATCH', f"/items/products/{r['id']}", patch, token=tok)
            print(f"\nизменено карточек: {changed} | meta_title: {stats['title']}, "
                  f"meta_description: {stats['desc']}, бренд в текстах: {stats.get('brand', 0)}")
            PYEOF
      - name: Save to file
        if: always()
        run: |
          cat > /tmp/ops-fixmeta.txt <<'OPS_FIXMETA_EOF'
          ${{ steps.run.outputs.stdout }}
          OPS_FIXMETA_EOF
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-fix-meta (apply=${{ inputs.apply }})"
          outcome: ${{ steps.run.outcome }}
          body-file: /tmp/ops-fixmeta.txt
