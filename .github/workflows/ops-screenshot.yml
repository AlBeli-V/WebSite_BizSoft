# Скриншот живой страницы сайта Chrome'ом на runner'е (у сессий Claude нет
# прямого доступа к проду — визуальная проверка через artifact этого workflow).
name: ops-screenshot
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Полный URL страницы'
        required: true
        default: 'https://biz-soft.pro/'
      window:
        description: 'Размер окна WxH'
        required: false
        default: '1440x1000'
      dsf:
        description: 'device-scale-factor'
        required: false
        default: '1'
permissions:
  issues: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Screenshot
        env:
          URL: ${{ inputs.url }}
          WIN: ${{ inputs.window }}
          DSF: ${{ inputs.dsf }}
        run: |
          W="${WIN%x*}"; H="${WIN#*x}"
          # Chrome исполняет JS, поэтому снимок страницы — это полноценный
          # визит: page_view в обеих системах и автоцель просмотра лендинга.
          # При дневном трафике около семи визитов один служебный снимок даёт
          # заметную долю. Домены счётчиков блокируются на уровне резолвера,
          # чтобы скриншот не попадал в отчёты.
          echo "127.0.0.1 mc.yandex.ru" | sudo tee -a /etc/hosts >/dev/null
          echo "127.0.0.1 www.googletagmanager.com" | sudo tee -a /etc/hosts >/dev/null
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size="$W,$H" --force-device-scale-factor="$DSF" \
            --virtual-time-budget=15000 --hide-scrollbars \
            --screenshot=shot.png "$URL"
          ls -la shot.png
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shot.png
          retention-days: 3
      # Сессии Claude не могут скачать artifact (blob-хранилище закрыто прокси) —
      # дублируем PNG базой64 комментариями в журнал-issue #22.
      - name: Post base64 to issue
        uses: actions/github-script@v7
        env:
          SHOT_URL: ${{ inputs.url }}
        with:
          script: |
            const b64 = require('fs').readFileSync('shot.png').toString('base64');
            const parts = [];
            for (let i = 0; i < b64.length; i += 50000) parts.push(b64.slice(i, i + 50000));
            for (let i = 0; i < parts.length; i++) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: 22,
                body: `### ops-screenshot b64 (${i + 1}/${parts.length}) · ${process.env.SHOT_URL}\n\n\`\`\`\n${parts[i]}\n\`\`\``,
              });
            }
