# Замер производительности прода по страницам — из раннера: сессия
# ассистента до biz-soft.pro не достаёт. Только чтение, ничего не меняет.
#
# Два движка (вход `engine`):
#   psi        — PageSpeed Insights, тот же отчёт, что pagespeed.web.dev.
#                Ключ PSI_API_KEY (Google Cloud → PageSpeed Insights API)
#                необязателен, но без него замер упирается в общую квоту (429).
#   lighthouse — Lighthouse прямо на раннере, с разбором трассы. Нужен, когда
#                PSI не считает метрику (NO_LCP) и по сводке не видно, были ли
#                кандидаты LCP и что их отзывает; заодно замер повторяемый
#                (вход `runs` — сколько прогонов, в итог идёт медиана).
#
# Результат — в журнал-issue #22.

name: ops-pagespeed

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Пути через запятую'
        required: false
        default: '/,/catalog/ai,/product/chatgpt-business'
      strategy:
        description: 'mobile | desktop | both (для engine=psi)'
        required: false
        default: 'mobile'
      engine:
        description: 'psi | lighthouse'
        required: false
        default: 'psi'
      runs:
        description: 'Прогонов на страницу (для engine=lighthouse)'
        required: false
        default: '1'

permissions:
  contents: read
  issues: write

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard - only default branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Запуск разрешён только с ветки main. Текущий ref: ${{ github.ref_name }}"
            exit 1
          fi
      # Локальный action journal-post лежит в репозитории — без checkout
      # раннер его не находит, и запись в журнал падает. always() — чтобы
      # запись прошла и после отказа сторожа.
      - name: Checkout
        if: always()
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Lighthouse ставится только для своего движка: для psi он не нужен.
      # Кэш npm обязателен — без него установка съедала 7 минут из 12-минутного
      # прогона (замер 04.09.2026).
      - name: Cache npm
        if: inputs.engine == 'lighthouse'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-lighthouse-13-${{ runner.os }}
      - name: Install Lighthouse
        if: inputs.engine == 'lighthouse'
        run: npm install --no-save --no-audit --no-fund lighthouse@13

      - name: Measure
        id: run
        env:
          URLS: ${{ inputs.urls }}
          STRATEGY: ${{ inputs.strategy }}
          RUNS: ${{ inputs.runs }}
          FORM: ${{ inputs.strategy }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          PSI_RAW_DIR: psi-raw
        run: |
          # Отчёт сохраняется и при сбое, а шаг после этого краснеет.
          rc=0
          if [ "${{ inputs.engine }}" = "lighthouse" ]; then
            # На раннере ubuntu-latest предустановлен Chrome — Lighthouse
            # находит его сам; PATH нужен, чтобы npx взял локальную установку.
            PATH="$PWD/node_modules/.bin:$PATH" node scripts/ops/lighthouse-trace.mjs > pagespeed.txt || rc=$?
          else
            node scripts/ops/pagespeed.mjs > pagespeed.txt || rc=$?
          fi
          cat pagespeed.txt
          exit $rc

      # Сырые ответы PSI — для разбора причин, когда сводки в журнале мало
      # (например, метрика не вычислена). Читаются офлайн:
      # node scripts/ops/pagespeed.mjs --from psi-raw/<страница>-mobile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-raw
          path: psi-raw/
          if-no-files-found: ignore

      - name: Post results to journal (issue #22)
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-pagespeed (${{ inputs.engine }}, ${{ inputs.strategy }})"
          outcome: ${{ steps.run.outcome }}
          body-file: pagespeed.txt
