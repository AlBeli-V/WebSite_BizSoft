# Проверка и ротация токена админ-инструментов (ADMIN_TOOLS_TOKEN).
#
# Токен живёт в /opt/bizsoft/astro.env на проде — не в секретах GitHub и не в
# репозитории. Им закрыты /admin/prices и /admin/leads.
#
# Режим check (по умолчанию): сообщает только, задан ли токен и какой он длины.
# Значение не печатается: журнал issue #22 — не место для действующего пароля.
#
# Режим rotate: выпускает новый токен, записывает в astro.env с резервной копией,
# перезапускает приложение и кладёт значение в /root/admin-token.txt на сервере
# с правами 600. Забрать его оттуда — одной командой по SSH. В журнал уходят
# только первые и последние четыре символа, чтобы можно было сверить.

name: ops-admin-token

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — проверить; rotate — выпустить новый"
        required: true
        default: "check"
        type: choice
        options: [check, rotate]

permissions:
  contents: read
  issues: write

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Check or rotate
        id: run
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: MODE
          capture_stdout: true
          command_timeout: 10m
          script: |
            set -e
            ENV_FILE=/opt/bizsoft/astro.env
            CUR=$(sed -n 's/^ADMIN_TOOLS_TOKEN=//p' "$ENV_FILE" | tr -d '"\r')

            if [ "$MODE" = "check" ]; then
              if [ -z "$CUR" ]; then
                echo "ADMIN_TOOLS_TOKEN не задан в $ENV_FILE — админ-страницы работать не будут"
              elif [ ${#CUR} -lt 8 ]; then
                echo "ADMIN_TOOLS_TOKEN задан, но короче 8 символов (${#CUR}) — код считает такой токен ненастроенным"
              else
                echo "ADMIN_TOOLS_TOKEN задан, длина ${#CUR} символов, начинается на $(printf %.4s "$CUR")… — админ-страницы работают"
              fi
              echo "Забрать значение: ssh <сервер> \"grep '^ADMIN_TOOLS_TOKEN=' $ENV_FILE\""
              exit 0
            fi

            NEW=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
            cp "$ENV_FILE" "${ENV_FILE}.bak.$(date -u +%Y%m%d%H%M%S)"
            if grep -q '^ADMIN_TOOLS_TOKEN=' "$ENV_FILE"; then
              sed -i "s|^ADMIN_TOOLS_TOKEN=.*|ADMIN_TOOLS_TOKEN=${NEW}|" "$ENV_FILE"
            else
              echo "ADMIN_TOOLS_TOKEN=${NEW}" >> "$ENV_FILE"
            fi
            printf '%s\n' "$NEW" > /root/admin-token.txt
            chmod 600 /root/admin-token.txt

            cd /opt/bizsoft && docker compose up -d --force-recreate astro
            sleep 8
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "x-admin-token: ${NEW}" http://127.0.0.1:3000/api/admin/leads || echo 000)

            echo "Выпущен новый токен: $(printf %.4s "$NEW")…$(printf '%s' "$NEW" | tail -c 4), длина ${#NEW}"
            echo "Проверка /api/admin/leads с новым токеном: HTTP $CODE (200 — работает)"
            echo "Значение лежит в /root/admin-token.txt (права 600)."
            echo "Забрать: ssh <сервер> \"sudo cat /root/admin-token.txt\""
            echo "ВНИМАНИЕ: старый токен больше не действует — обновите его в браузере на /admin/prices и /admin/leads."

      - name: Post results to journal (issue #22)
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ steps.run.outputs.stdout }}
        with:
          script: |
            const out = (process.env.OUT || '(нет вывода)').slice(0, 20000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body: `### ops-admin-token · ${new Date().toISOString()}\n\n\`\`\`\n${out}\n\`\`\``,
            });
