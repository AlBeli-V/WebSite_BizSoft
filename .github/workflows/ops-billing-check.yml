# Проверка доступа к Billing API Yandex Cloud по требованию.
#
# Прогоняет scripts/seo/yc_billing.py с секретом YC_BILLING_SA_KEY и кладёт
# дословный результат в журнал-issue #22: либо остаток/тарифы, либо точную
# причину (ключ не читается / IAM отказал / роль billing.accounts.viewer не
# выдана). Read-only: ничего не меняет ни в облаке, ни на сайте.
# Ручной запуск — только с main (правило CLAUDE.md).
name: ops-billing-check
on:
  workflow_dispatch:
permissions:
  contents: write   # data_sync push результата (cloud-billing.json) в seo-data
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Запуск разрешён только с ветки main (правило проекта)"
          exit 1
      - uses: actions/checkout@v4
      - name: Pull data branch
        run: bash scripts/seo/data_sync.sh pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check billing access
        id: run
        env:
          YC_BILLING_SA_KEY: ${{ secrets.YC_BILLING_SA_KEY }}
        run: |
          pip install --quiet requests pyjwt cryptography
          # Вывод обоих скриптов попадает в журнал и при сбое, а шаг краснеет:
          # трейсбек в stderr и код возврата больше не прячутся за || true.
          rc=0
          {
            echo 'result<<BILLING_EOF'
            python3 scripts/seo/yc_billing.py 2>&1 || rc=$?
            echo '---'
            python3 scripts/seo/cloud_budget.py 2>&1 || rc=$?
            echo 'BILLING_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Push data
        if: always()
        run: bash scripts/seo/data_sync.sh push "Проверка биллинга $(date -u +%FT%TZ)" || true
      - name: Post to issue
        if: always()
        uses: ./.github/actions/journal-post
        with:
          title: "ops-billing-check"
          outcome: ${{ steps.run.outcome }}
          body: ${{ steps.run.outputs.result }}
