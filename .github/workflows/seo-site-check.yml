# Проверка живого сайта biz-soft.pro с раннера (из среды мониторинга egress закрыт):
# какие счётчики аналитики реально отдаёт прод (GA4 gtag, Яндекс.Метрика).
# Запуск: вручную (workflow_dispatch) или пушем этого файла.

name: seo-site-check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/biz-soft-rating-tracking-5rf03g
    paths:
      - ".github/workflows/seo-site-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage and grep analytics tags
        run: |
          curl -sSL --max-time 30 https://biz-soft.pro/ -o home.html
          echo "== HTTP размер: $(wc -c < home.html) байт =="
          echo "== GA4 (gtag) =="
          grep -o 'gtag/js?id=[A-Z0-9-]*' home.html | sort -u || echo "gtag НЕ найден"
          echo "== Яндекс.Метрика =="
          grep -o 'metrika/tag.js?id=[0-9]*' home.html | sort -u || echo "метрика НЕ найдена"
          echo "== title =="
          grep -o '<title>[^<]*</title>' home.html | head -1

      - name: Check experiment snippets on live vendor pages
        run: |
          for p in canva depositphotos coreldraw heygen marmoset; do
            code=$(curl -sSL --max-time 30 -o page.html -w '%{http_code}' "https://biz-soft.pro/vendors/$p")
            title=$(grep -o '<title>[^<]*</title>' page.html | head -1)
            faq=$(grep -c 'FAQPage' page.html || true)
            echo "== /vendors/$p (HTTP $code) =="
            echo "   $title"
            echo "   FAQPage-разметка: $faq вхожд."
          done
