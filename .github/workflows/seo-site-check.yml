# Проверка живого сайта biz-soft.pro с раннера (из среды мониторинга egress закрыт):
# какие счётчики аналитики реально отдаёт прод и в каком состоянии страницы эксперимента.
# Результат сохраняется в reports/seo/intelligence/site-check-<дата>.json — из него
# отчёт V4 берёт фактическую экспозицию эксперимента (сколько страниц уже обновлено).
# Запуск: вручную (workflow_dispatch) или пушем этого файла.

name: seo-site-check

on:
  # Ежедневно 02:37 UTC = 05:37 МСК — до сбора данных (06:07 МСК) и письма:
  # активированный здесь эксперимент в тот же день получает выгрузку
  # baseline-окна. Минута некруглая сознательно (см. seo-data-collect).
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-site-check.yml"
      - "scripts/seo/experiment_windows.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull data branch
        run: bash scripts/seo/data_sync.sh pull

      - name: Verify live analytics tags
        # Проверка счётчиков прода была и раньше, но её результат уходил в лог
        # шага и терялся: ничего не сохранялось и ничто не падало. Это
        # единственное место, где видно, что реально отдаёт прод, — поломка
        # тега иначе обнаруживается только по исчезновению трафика в отчётах,
        # то есть через несколько дней.
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys, datetime as dt

          EXPECTED_METRIKA = {"110206070"}
          EXPECTED_GA = {"G-V9BK2D1431"}

          html = subprocess.run(
              ["curl", "-sSL", "--max-time", "30", "https://biz-soft.pro/"],
              capture_output=True, text=True).stdout
          # Идентификатор Метрики склеивается в рантайме: в разметке стоит
          # 'tag.js?id=' + metrikaId, а значение объявлено переменной выше.
          # Проверка только по URL находила пустоту и молча сообщала, что
          # счётчика нет, — на всех прогонах до 21.08.2026.
          metrika = set(re.findall(r"metrika/tag\.js\?id=(\d+)", html))
          metrika |= set(re.findall(r"metrikaId\s*=\s*[\"'](\d+)[\"']", html))
          metrika |= set(re.findall(r"ym\(\s*(?:Number\()?\s*(\d{6,})", html))
          ga = set(re.findall(r"gtag/js\?id=([A-Z0-9-]+)", html))
          ga |= set(re.findall(r"gaId\s*=\s*[\"'](G-[A-Z0-9]+)[\"']", html))
          loaders = len(re.findall(r"metrika/tag\.js", html))
          title = (re.search(r"<title>([^<]*)</title>", html) or [None, ""])[1]

          problems = []
          if metrika != EXPECTED_METRIKA:
              problems.append(f"Метрика: на проде {sorted(metrika) or 'нет'}, "
                              f"ожидается {sorted(EXPECTED_METRIKA)}")
          if ga != EXPECTED_GA:
              problems.append(f"GA4: на проде {sorted(ga) or 'нет'}, "
                              f"ожидается {sorted(EXPECTED_GA)}")
          if loaders > 1:
              problems.append(f"Метрика подключена {loaders} раза")

          out = {
              "checked_at": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds"),
              "html_bytes": len(html),
              "title": title,
              "metrika_ids": sorted(metrika),
              "metrika_loaders": loaders,
              "ga_ids": sorted(ga),
              "expected": {"metrika": sorted(EXPECTED_METRIKA), "ga": sorted(EXPECTED_GA)},
              "ok": not problems,
              "problems": problems,
          }
          path = pathlib.Path("reports/seo/intelligence/tags-check.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=1))
          if problems:
              print("::error::" + "; ".join(problems))
              sys.exit(1)
          PY

      # Активация запланированных экспериментов (перезапуск SEO-EXP-002,
      # 03.09.2026): эксперимент со статусом planned становится running в тот
      # день, когда все его страницы отдают новый вариант, — дата старта
      # равна факту выката, а не дате коммита; окна baseline/experiment
      # записываются в реестр, выгружает их seo-data-collect.
      - name: Activate planned experiments
        run: python3 scripts/seo/experiment_windows.py activate

      # Страницы берутся из реестра экспериментов: до 31.08 проверялся только
      # SEO-EXP-001 (захардкоженный список), и остальные эксперименты вечно
      # значились «выкат не подтверждён» (проверка руководителя 31.08.2026).
      # Признак внедрённого варианта — по title_marker эксперимента из реестра
      # (по умолчанию — коммерческий заголовок «оплата/купить»).
      - name: Check experiment pages and store exposure
        run: |
          python3 - <<'PY'
          import datetime as dt, json, pathlib, re, subprocess

          reg = json.loads(pathlib.Path(
              "reports/seo/intelligence/seo-experiments.json").read_text(encoding="utf-8"))
          experiments = {}
          for e in reg.get("experiments", []):
              if e.get("status") not in ("running", "observing"):
                  continue
              marker = re.compile(e.get("title_marker") or r"(оплат|купить)", re.I)
              rows, live, snippets = [], 0, 0
              for page in e.get("pages") or []:
                  url = f"https://biz-soft.pro{page}"
                  html = subprocess.run(["curl", "-sSL", "--max-time", "30", url],
                                        capture_output=True, text=True).stdout
                  title = (re.search(r"<title>([^<]*)</title>", html) or [None, ""])[1]
                  faq = html.count("FAQPage")
                  new_snippet = bool(marker.search(title))
                  live += 1 if html else 0
                  snippets += 1 if new_snippet else 0
                  rows.append({"page": page, "http_ok": bool(html),
                               "title": title, "faqpage_blocks": faq,
                               "new_snippet_detected": new_snippet})
                  print(f"{page}: FAQPage={faq} новый заголовок={new_snippet}")
                  print(f"   {title}")
              experiments[e["id"]] = {
                  "pages_total": len(rows),
                  "pages_recrawled": live,
                  "new_snippets_detected": snippets,
                  "pages": rows}

          out = {"checked_at": dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds"),
                 "experiments": experiments}
          date = dt.date.today().isoformat()
          path = pathlib.Path(f"reports/seo/intelligence/site-check-{date}.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=1), encoding="utf-8")
          print(f"сохранено: {path}")
          PY

      # Каталог-владение (этап 3.1): пуш только intelligence, чтобы устаревшая
      # копия других каталогов не затирала параллельные прогоны.
      - name: Push result
        if: always()
        run: |
          bash scripts/seo/data_sync.sh push \
            "Проверка живых страниц экспериментов ($(date -u +%F))" \
            "reports/seo/intelligence"
