<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 342' width='100%' role='img' aria-label='Воронка поиска: показы, клики, визиты, целевые события; лиды и сделки — нет данных' style='max-width:660px;height:auto'><title>Воронка поиска: показы, клики, визиты, целевые события; лиды и сделки — нет данных</title><rect width='660' height='342' fill='#ffffff'/><text x='16' y='24' font-family='Arial,Helvetica,sans-serif' font-size='14' font-weight='bold' fill='#1d1d1f'>Воронка поиска (по доступным источникам)</text><text x='16' y='42' font-family='Arial,Helvetica,sans-serif' font-size='11' fill='#66666e'>Источники: Яндекс.Вебмастер, Яндекс.Метрика, CRM (не подключена) · единицы: события</text><rect x='16' y='70' width='380' height='24' rx='4' fill='#f2591d'/><text x='404' y='87' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>926</text><text x='428' y='87' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Показы (Яндекс, выборка топ-100 запросов) · 05–17.08</text><rect x='16' y='112' width='4' height='24' rx='4' fill='#f2591d'/><text x='28' y='129' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>6</text><text x='36' y='129' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Клики (Яндекс, та же выборка) · 05–17.08</text><rect x='16' y='154' width='15' height='24' rx='4' fill='#f2591d'/><text x='39' y='171' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>37</text><text x='55' y='171' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Органические визиты (Метрика) · 05–18.08</text><rect x='16' y='196' width='4' height='24' rx='4' fill='#f2591d'/><text x='28' y='213' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>3</text><text x='36' y='213' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Целевые события органики (Метрика) · 05–18.08</text><rect x='16' y='238' width='380' height='24' rx='4' fill='#c7c7cf' stroke='#b9b9c2' stroke-dasharray='4,3'/><text x='404' y='255' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>нет данных</text><text x='484' y='255' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Квалифицированные лиды · CRM не подключена</text><rect x='16' y='280' width='380' height='24' rx='4' fill='#c7c7cf' stroke='#b9b9c2' stroke-dasharray='4,3'/><text x='404' y='297' font-family='Arial,Helvetica,sans-serif' font-size='12' font-weight='bold' fill='#1d1d1f'>нет данных</text><text x='484' y='297' font-family='Arial,Helvetica,sans-serif' font-size='10.5' fill='#66666e'>Сделки / выручка · CRM не подключена</text><text x='16' y='326' font-family='Arial,Helvetica,sans-serif' font-size='10' fill='#66666e'>Этапы измеряются разными системами и окнами — воронка не является сквозной цепочкой одних и тех же сессий.</text></svg>