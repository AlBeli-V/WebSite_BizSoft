    # SEC-RL-001 begin — вставлено воркфлоу ops-nginx-ratelimit, вручную не править
    #
    # Пороги обращений к публичным формам. Зоны учёта объявлены в
    # /etc/nginx/conf.d/bizsoft-rate-limit.conf (файл deploy/nginx-rate-limit.conf):
    # limit_req_zone живёт в http-контексте, внутри server{} nginx его не примет.
    #
    # Блоки самодостаточны — каждый несёт полный набор proxy-заголовков и
    # ничего не наследует. Так сделано намеренно: proxy_set_header
    # наследуется только целым набором, и location, объявивший хотя бы один
    # свой заголовок, теряет все унаследованные. Автоматическая правка,
    # которая переносила бы заголовки на уровень server{}, означала бы
    # структурную хирургию по живому конфигу; здесь же ни одна существующая
    # строка не трогается — блок только добавляется перед location /.
    #
    # В deploy/nginx-biz-soft.conf.template те же location'ы записаны короче,
    # с наследованием от server{}: это форма для конфига, собираемого с нуля.
    # Поведение обеих форм одинаково.

    # Подсказки по организациям: платный вызов справочника на каждый ввод от
    # трёх символов. 20 в минуту с адреса, всплеск до 10 — живой набор с
    # паузой 250 мс укладывается в это с запасом.
    location = /api/suggest/party {
        limit_req zone=bz_suggest burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Заявка и запрос КП — самые дорогие обращения на сайте: справочник
    # организаций, три документа и письмо с вложением. nginx срезает шторм,
    # ровный порог «5 в час» и «30 в сутки» считает приложение
    # (src/lib/form-guard.ts): limit_req умеет только r/s и r/m.
    location = /api/lead {
        limit_req zone=bz_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/quote {
        limit_req zone=bz_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ответ nginx на превышение. Форма на сайте читает JSON и показывает текст
    # из поля error; страница ошибки nginx по умолчанию — HTML, и человек за
    # корпоративным NAT увидел бы вместо объяснения глухое «Не удалось
    # отправить». proxy_intercept_errors выключен (умолчание), поэтому 429,
    # который вернуло само приложение, сюда не попадает и доходит до браузера
    # как есть — со своим, более подробным текстом.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        return 429 '{"error":"С вашего адреса пришло слишком много обращений подряд. Подождите минуту и попробуйте снова — или позвоните нам, мы примем заявку голосом."}';
    }
    # SEC-RL-001 end
