    # PERF-METRIKA-001 begin — тег Метрики со своего домена, с кэшем.
    # Вставляется в server{} сайта; зона кэша — в conf.d/bizsoft-metrika-cache.conf.
    # Клиент запрашивает /m/tag.js, nginx отдаёт кэшированную копию
    # https://mc.yandex.ru/metrika/tag.js. Сам счётчик после загрузки ходит на
    # mc.yandex.ru напрямую, как и раньше: проксируется только файл скрипта.
    location = /m/tag.js {
        proxy_pass https://mc.yandex.ru/metrika/tag.js;
        proxy_set_header Host mc.yandex.ru;
        proxy_ssl_server_name on;
        # Сжатие делаем сами, а не полагаемся на апстрим: прогон #4 показал,
        # что Яндекс отдаёт файл несжатым даже на явный запрос gzip, и по
        # проводу уходило 288 КБ вместо ~70 КБ. Теперь в кэше лежит несжатая
        # копия, а посетителю nginx отдаёт сжатую на лету. Это не зависит ни от
        # поведения Яндекса, ни от gzip_types в http-блоке (в дефолтном конфиге
        # Ubuntu сжимается только text/html).
        proxy_set_header Accept-Encoding "";
        gzip on;
        gzip_types application/javascript text/javascript;
        # Ответ пришёл от проксируемого сервера — без этого nginx его не сожмёт.
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        # Куки Метрики ставятся её же запросами к mc.yandex.ru; из ответа на
        # файл скрипта они не нужны и мешали бы кэшированию.
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_cache metrika_cache;
        # Ключ без строки запроса: файл один, копии по ?id плодить незачем.
        proxy_cache_key "metrika-tag-js";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        # Яндекс недоступен или отвечает ошибкой — отдаём последнюю удачную
        # копию вместо ошибки: счётчик продолжает работать.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
        # Ответ отдаётся сжатым или распакованным по запросу клиента —
        # промежуточные кэши обязаны различать эти версии.
        add_header Vary "Accept-Encoding" always;
    }
    # PERF-METRIKA-001 end
