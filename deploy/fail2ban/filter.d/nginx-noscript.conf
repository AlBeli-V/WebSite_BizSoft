# Фильтр fail2ban: перебор несуществующих путей (404) и обрывы 444.
# Ставится в /etc/fail2ban/filter.d/nginx-noscript.conf; установку и проверку
# выполняет воркфлоу ops-fail2ban.
#
# Главное про форму выражения: fail2ban УДАЛЯЕТ найденную дату из строки перед
# тем, как применить failregex. Строка combined-лога
#   85.217.149.42 - - [09/Sep/2026:16:24:07 +0300] "GET /x HTTP/1.1" 404 196 …
# доходит до фильтра как
#   85.217.149.42 - - [] "GET /x HTTP/1.1" 404 196 …
# Выражение, ожидающее дату внутри скобок, не совпадёт ни с одной строкой.
# Именно это и случилось 09.09.2026: fail2ban-regex по живому логу дал
# «17394 lines, 0 matched, 17394 missed» при исправном разборе даты. Скобки
# сделаны необязательными: разные сборки оставляют «[]» или убирают их вовсе.
#
# Своего datepattern здесь нет намеренно. Прежний «^[^\[]*\[({DATE})» захватывал
# и начало строки, то есть удалял вместе с датой сам адрес. Встроенные шаблоны
# fail2ban формат nginx разбирают сами — на том же логе 17394 попадания.

[Definition]
failregex = ^<HOST> - \S+ (?:\[\])? ?"(GET|POST|HEAD|PUT|OPTIONS|DELETE) [^"]*" (404|444|403|400)
ignoreregex =
