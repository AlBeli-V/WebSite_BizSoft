# Фильтр fail2ban: детектит перебор несуществующих путей (404) и обрывы 444.
# Ставится в /etc/fail2ban/filter.d/nginx-noscript.conf на сервере (нужен root).
# Ловит сканеров вроде 91.214.190.75 (4386 запросов/нед) по всплеску 404/444.

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "(GET|POST|HEAD|PUT|OPTIONS|DELETE) [^"]*" (404|444|403|400)
ignoreregex =

# Формат даты стандартного nginx combined-лога.
datepattern = ^[^\[]*\[({DATE})
