# Зона кэша для тега Яндекс.Метрики (PERF-METRIKA-001). Кладётся в
# /etc/nginx/conf.d/ — proxy_cache_path объявляется только в http-блоке.
#
# Зачем: tag.js приходит с mc.yandex.ru отдельным соединением (DNS + TLS к
# чужому домену) и с коротким чужим кэшем — на мобильном профиле PageSpeed
# это ~150–250 мс и постоянное замечание «Use efficient cache lifetimes»
# на 70 КБ. Через свой домен файл едет по уже открытому HTTP/2-соединению.
#
# Размеры скромные: кэшируется один файл, 32 МБ хватает с большим запасом.
# inactive=7d вместе с proxy_cache_use_stale в location'е означает, что при
# недоступности Яндекса сайт продолжит отдавать последнюю удачную копию.
proxy_cache_path /var/cache/nginx/metrika levels=1:2 keys_zone=metrika_cache:1m
                 max_size=32m inactive=7d use_temp_path=off;
