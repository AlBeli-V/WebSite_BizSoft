# Рубеж 1 защиты публичных форм (SEC-RL-001) — зоны учёта обращений.
#
# Кладётся в /etc/nginx/conf.d/bizsoft-rate-limit.conf. Отдельным файлом,
# потому что limit_req_zone объявляется в http-контексте: внутри server{}
# nginx его не примет («directive is not allowed here»). Применение зон —
# в deploy/nginx-biz-soft.conf.template, в блоках location.
#
# Ключ — $binary_remote_addr, адрес соединения. Перед nginx нет ни CDN, ни
# балансировщика (TLS терминируется здесь же), поэтому это и есть адрес
# клиента; заголовки запроса на учёт не влияют и подделать порог нельзя.
# Если когда-нибудь появится прокси спереди, ключ придётся сменить на
# $realip_remote_addr вместе с настройкой модуля real_ip — иначе весь
# трафик сложится в один адрес и лимит выключит сайт целиком.
#
# 10m на зону — примерно 160 тысяч адресов; при переполнении nginx вытесняет
# самые старые записи.

# Подсказки по организациям: 20 запросов в минуту с адреса.
limit_req_zone $binary_remote_addr zone=bz_suggest:10m rate=20r/m;

# Заявка и запрос КП. Точное «5 в час» nginx выразить не может — limit_req
# понимает только r/s и r/m, — поэтому здесь стоит самый частый доступный
# порог, 1 в минуту со всплеском, а ровный суточный и часовой счёт ведёт
# приложение (src/lib/form-guard.ts). nginx гасит шторм, приложение держит
# порог и объясняет человеку, что произошло.
limit_req_zone $binary_remote_addr zone=bz_forms:10m rate=1r/m;

# Превышение — 429 (по умолчанию nginx отдаёт 503, а это «сервис упал»).
limit_req_status 429;
limit_req_log_level warn;
