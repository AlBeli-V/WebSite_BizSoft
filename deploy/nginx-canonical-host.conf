    # SEO-WWW-001 begin — вставлено воркфлоу ops-nginx-canonical-host, вручную не править
    #
    # Канонический хост. До 08.09.2026 единственный HTTPS-server слушал
    # biz-soft.pro и www.biz-soft.pro и отдавал 200 по обоим: редирект
    # certbot в http-блоке сохраняет хост, а редиректа www → без www не было
    # вовсе. Каждый URL сайта существовал в двух вариантах, и обход тратился
    # вдвое — при замеренном темпе Googlebot 2 URL в сутки (490 из 729 путей
    # инвентаря не скачаны ни разу) это самая дорогая из дешёвых потерь.
    #
    # Форма — один `if` в существующем server{}, а не отдельный server с
    # собственным server_name: отдельному блоку понадобились бы свои listen
    # 443 ssl и пути к сертификату, то есть копия строк, которыми управляет
    # certbot. `if` с одним `return` — документированно безопасная форма
    # (оговорка «if is evil» относится к `if` с другими директивами внутри).
    #
    # Ставится первым в блоке, до правила о завершающем слеше: иначе
    # https://www.biz-soft.pro/foo/ отдавал бы два редиректа подряд —
    # сначала на /foo того же хоста, потом на канонический.
    if ($host = www.biz-soft.pro) { return 301 https://biz-soft.pro$request_uri; }
    # SEO-WWW-001 end
