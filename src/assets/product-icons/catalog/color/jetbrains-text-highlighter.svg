<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-text-highlighter-color-title jetbrains-text-highlighter-color-desc" data-icon-id="jetbrains-text-highlighter" data-variant="color">
  <title id="jetbrains-text-highlighter-color-title">Text Highlighter — color icon</title>
  <desc id="jetbrains-text-highlighter-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Text Highlighter — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Samuel Lastrina</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/28840/1096459/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-text-highlighter__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><defs xmlns="http://www.w3.org/2000/svg">
    <!-- Gradient for glow effect -->
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFE066;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Soft glow background -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="20" cy="20" r="18" fill="url(#glowGrad)"/>

  <!-- Document/paper base - white with subtle shadow -->
  <rect xmlns="http://www.w3.org/2000/svg" x="9" y="7" width="22" height="26" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Text lines (gray) -->
  <line xmlns="http://www.w3.org/2000/svg" x1="12" y1="12" x2="28" y2="12" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line xmlns="http://www.w3.org/2000/svg" x1="12" y1="16" x2="28" y2="16" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line xmlns="http://www.w3.org/2000/svg" x1="12" y1="20" x2="28" y2="20" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line xmlns="http://www.w3.org/2000/svg" x1="12" y1="24" x2="23" y2="24" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line xmlns="http://www.w3.org/2000/svg" x1="12" y1="28" x2="26" y2="28" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Highlighted text strokes overlaid -->
  <rect xmlns="http://www.w3.org/2000/svg" x="11.5" y="15" width="17" height="2.5" rx="0.5" fill="#FFE066" opacity="0.7"/>
  <rect xmlns="http://www.w3.org/2000/svg" x="11.5" y="19" width="17" height="2.5" rx="0.5" fill="#A3E635" opacity="0.7"/>
  <rect xmlns="http://www.w3.org/2000/svg" x="11.5" y="23" width="12" height="2.5" rx="0.5" fill="#60A5FA" opacity="0.7"/>

  <!-- Highlighter pen icon in corner -->
  <g xmlns="http://www.w3.org/2000/svg" transform="translate(24, 24)">
    <!-- Pen body -->
    <rect x="0" y="2" width="10" height="6" rx="1" fill="#FFD700"/>
    <!-- Pen tip -->
    <path d="M 0 8 L 3 12 L 7 12 L 10 8 Z" fill="#FFA500"/>
    <!-- Pen cap -->
    <rect x="0" y="0" width="10" height="2" rx="0.5" fill="#64748B"/>
  </g>
</svg>
</svg>
