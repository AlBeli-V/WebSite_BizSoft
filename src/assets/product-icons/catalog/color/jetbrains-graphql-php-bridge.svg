  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><!-- Bridge metaphor rendered as a hexagon split between two technologies. -->
    <!-- Left half: GraphQL (pink) -->
    <path xmlns="http://www.w3.org/2000/svg" d="M20 5 L7 12.5 L7 27.5 L20 35 Z" fill="#E535AB"/>
    <!-- Right half: PHP (purple) -->
    <path xmlns="http://www.w3.org/2000/svg" d="M20 5 L33 12.5 L33 27.5 L20 35 Z" fill="#777BB4"/>
    <!-- Bidirectional arrows: GraphQL ↔ PHP -->
    <g xmlns="http://www.w3.org/2000/svg" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top: → -->
        <path d="M13 17 L27 17"/>
        <path d="M24 14 L27 17 L24 20"/>
        <!-- Bottom: ← -->
        <path d="M27 23 L13 23"/>
        <path d="M16 20 L13 23 L16 26"/>
    </g>
</svg>
