  <title id="jetbrains-pyui-helper-color-title">PyUI Helper — color icon</title>
  <desc id="jetbrains-pyui-helper-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>PyUI Helper — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Ilscipio GmbH</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/29536/1118277/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-pyui-helper__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
