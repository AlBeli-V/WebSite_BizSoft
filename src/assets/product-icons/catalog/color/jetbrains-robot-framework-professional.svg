<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-robot-framework-professional-color-title jetbrains-robot-framework-professional-color-desc" data-icon-id="jetbrains-robot-framework-professional" data-variant="color">
  <title id="jetbrains-robot-framework-professional-color-title">Robot Framework Professional — color icon</title>
  <desc id="jetbrains-robot-framework-professional-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Robot Framework Professional — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Jakub Jirák</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/29046/1125403/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-robot-framework-professional__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><!-- Background gradient -->
  <defs xmlns="http://www.w3.org/2000/svg">
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#43A047;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect xmlns="http://www.w3.org/2000/svg" width="40" height="40" rx="8" fill="url(#bgGradient)"/>

  <!-- Robot head -->
  <rect xmlns="http://www.w3.org/2000/svg" x="10" y="10" width="20" height="20" rx="4" fill="url(#faceGradient)" opacity="0.95"/>

  <!-- Eyes -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="16" cy="18" r="2.5" fill="#43A047"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="24" cy="18" r="2.5" fill="#43A047"/>

  <!-- Eye highlights -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="16.8" cy="17.2" r="1" fill="#ffffff" opacity="0.8"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="24.8" cy="17.2" r="1" fill="#ffffff" opacity="0.8"/>

  <!-- Mouth/smile -->
  <rect xmlns="http://www.w3.org/2000/svg" x="14" y="25" width="12" height="2.5" rx="1.25" fill="#43A047"/>

  <!-- Antenna -->
  <line xmlns="http://www.w3.org/2000/svg" x1="20" y1="10" x2="20" y2="6" stroke="#E8F5E9" stroke-width="2" stroke-linecap="round"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="20" cy="5" r="1.5" fill="#E8F5E9"/>

  <!-- Robot frame accents -->
  <rect xmlns="http://www.w3.org/2000/svg" x="8" y="16" width="2" height="8" rx="1" fill="#E8F5E9" opacity="0.7"/>
  <rect xmlns="http://www.w3.org/2000/svg" x="30" y="16" width="2" height="8" rx="1" fill="#E8F5E9" opacity="0.7"/>
</svg>
</svg>
