<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-liquid-hero-color-title jetbrains-liquid-hero-color-desc" data-icon-id="jetbrains-liquid-hero" data-variant="color">
  <title id="jetbrains-liquid-hero-color-title">Liquid Hero — color icon</title>
  <desc id="jetbrains-liquid-hero-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Liquid Hero — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Language Heroes</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/27826/1067841/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-liquid-hero__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet"><defs xmlns="http://www.w3.org/2000/svg">
    <!-- Background water gradient -->
    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <!-- Highlight gradient used by both waves -->
    <linearGradient id="waveHighlight" x1="0" y1="0" x2="0" y2="1">
      <!-- Bright crest -->
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
      <!-- Fade to transparent toward the trough -->
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Clip all waves to the circle -->
    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>

  <!-- Circular boundary -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="32" cy="32" r="30" fill="url(#waterGradient)" stroke="#005ec2" stroke-width="4"/>

  <!-- Waves (clipped) -->
  <g xmlns="http://www.w3.org/2000/svg" clip-path="url(#circleClip)">
    <!-- Upper wave -->
    <path d="       M0 34       Q 8 30 16 34 24 38 32 34       Q40 30 48 34 56 38 64 34       V64 H0 Z" fill="url(#waveHighlight)"/>

    <!-- Lower wave (slightly deeper) -->
    <path d="       M0 44       Q 8 40 16 44 24 48 32 44       Q40 40 48 44 56 48 64 44       V64 H0 Z" fill="url(#waveHighlight)"/>
  </g>
</svg>
</svg>
