      <dc:identifier>jetbrains-cypresso__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><rect xmlns="http://www.w3.org/2000/svg" width="40" height="40" rx="6" ry="6" fill="#7A4422"/>

