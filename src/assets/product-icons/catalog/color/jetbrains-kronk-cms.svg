<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-kronk-cms-color-title jetbrains-kronk-cms-color-desc" data-icon-id="jetbrains-kronk-cms" data-variant="color">
  <title id="jetbrains-kronk-cms-color-title">Kronk CMS — color icon</title>
  <desc id="jetbrains-kronk-cms-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Kronk CMS — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>AIVory, Inc.</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/29886/1088527/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-kronk-cms__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><defs xmlns="http://www.w3.org/2000/svg">
    <linearGradient id="kronkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="kronkGradientDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#84CC16"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect xmlns="http://www.w3.org/2000/svg" x="2" y="2" width="36" height="36" rx="8" fill="#1E1E2E"/>

  <!-- Content block rectangles with gradient (matching website proportions) -->
  <rect xmlns="http://www.w3.org/2000/svg" x="7" y="9" width="15" height="5" rx="1.5" fill="url(#kronkGradient)"/>
  <rect xmlns="http://www.w3.org/2000/svg" x="7" y="17" width="11" height="5" rx="1.5" fill="url(#kronkGradient)"/>
  <rect xmlns="http://www.w3.org/2000/svg" x="7" y="25" width="13" height="5" rx="1.5" fill="url(#kronkGradient)"/>

  <!-- AI dot with cyan-lime gradient -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="29" cy="19" r="3.5" fill="url(#kronkGradientDot)"/>
</svg>
</svg>
