      <dc:identifier>jetbrains-structurizr-dsl__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><!-- Background with Structurizr blue -->
  <rect xmlns="http://www.w3.org/2000/svg" width="40" height="40" rx="8" fill="#1168BD"/>
  
  <!-- C4 Architecture boxes -->
  <g xmlns="http://www.w3.org/2000/svg" fill="#FFFFFF">
    <!-- Top box (Person/User) -->
    <rect x="14" y="6" width="12" height="8" rx="2"/>
    
    <!-- Middle row (Software Systems) -->
    <rect x="6" y="17" width="12" height="8" rx="2"/>
    <rect x="22" y="17" width="12" height="8" rx="2"/>
    
    <!-- Bottom box (Container/Database) -->
    <rect x="14" y="28" width="12" height="8" rx="2"/>
  </g>
  
  <!-- Connection arrows -->
  <g xmlns="http://www.w3.org/2000/svg" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Top to left -->
    <path d="M 16 14 L 12 17"/>
    <!-- Top to right -->
    <path d="M 24 14 L 28 17"/>
    <!-- Left to bottom -->
    <path d="M 12 25 L 16 28"/>
    <!-- Right to bottom -->
    <path d="M 28 25 L 24 28"/>
  </g>
</svg>
