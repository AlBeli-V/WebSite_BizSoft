  <title id="jetbrains-structurizr-dsl-color-title">Structurizr DSL — color icon</title>
  <desc id="jetbrains-structurizr-dsl-color-desc">Normalized color product icon used by 1 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Structurizr DSL — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 1 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Jakub Jirák</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/29351/1071848/icon/default.svg</dc:source>
