<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-django-command-runner-color-title jetbrains-django-command-runner-color-desc" data-icon-id="jetbrains-django-command-runner" data-variant="color">
  <title id="jetbrains-django-command-runner-color-title">Django command runner — color icon</title>
  <desc id="jetbrains-django-command-runner-color-desc">Normalized color product icon used by 1 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Django command runner — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 1 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>meanmail.dev</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/13834/912520/icon/default.svg</dc:source>
