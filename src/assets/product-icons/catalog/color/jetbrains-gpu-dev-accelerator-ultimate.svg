  <title id="jetbrains-gpu-dev-accelerator-ultimate-color-title">GPU Dev Accelerator Ultimate — color icon</title>
  <desc id="jetbrains-gpu-dev-accelerator-ultimate-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
