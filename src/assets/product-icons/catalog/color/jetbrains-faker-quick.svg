<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-faker-quick-color-title jetbrains-faker-quick-color-desc" data-icon-id="jetbrains-faker-quick" data-variant="color">
  <title id="jetbrains-faker-quick-color-title">Faker Quick — color icon</title>
  <desc id="jetbrains-faker-quick-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>Faker Quick — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>Anbora Labs</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/30145/1051015/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-faker-quick__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><rect xmlns="http://www.w3.org/2000/svg" width="40" height="40" rx="8" fill="url(#paint0_linear)"/>
    
    <!-- Símbolo de Varita Mágica (Generación de Datos) -->
    <!-- Mango de la varita -->
    <rect xmlns="http://www.w3.org/2000/svg" x="12" y="24" width="16" height="4" rx="1" transform="rotate(-45 12 24)" fill="#4A4A4A"/>
    <!-- Punta de la varita -->
    <rect xmlns="http://www.w3.org/2000/svg" x="22" y="14" width="8" height="4" rx="1" transform="rotate(-45 22 14)" fill="white"/>
    
    <!-- Destellos/Chispas (Simbolizando la "magia" de crear datos) -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="28" cy="10" r="1.5" fill="white">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="34" cy="16" r="1" fill="white" fill-opacity="0.8"/>
    <circle xmlns="http://www.w3.org/2000/svg" cx="24" cy="6" r="1" fill="white" fill-opacity="0.6"/>
    
    <!-- Líneas de datos que aparecen -->
    <rect xmlns="http://www.w3.org/2000/svg" x="8" y="30" width="18" height="2" rx="1" fill="white" fill-opacity="0.7"/>
    <rect xmlns="http://www.w3.org/2000/svg" x="8" y="34" width="12" height="2" rx="1" fill="white" fill-opacity="0.4"/>

    <defs xmlns="http://www.w3.org/2000/svg">
        <linearGradient id="paint0_linear" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3BEA62"/>
            <stop offset="0.5" stop-color="#3C99CC"/>
            <stop offset="1" stop-color="#6B57FF"/>
        </linearGradient>
    </defs>
</svg>
</svg>
