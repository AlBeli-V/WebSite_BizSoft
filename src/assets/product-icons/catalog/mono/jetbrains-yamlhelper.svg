<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="jetbrains-yamlhelper-color-title jetbrains-yamlhelper-color-desc" data-icon-id="jetbrains-yamlhelper" data-variant="color">
  <defs><clipPath id="bizsoft-safe-clip"><rect x="64" y="64" width="384" height="384"/></clipPath></defs><title id="jetbrains-yamlhelper-color-title">YamlHelper — color icon</title>
  <desc id="jetbrains-yamlhelper-color-desc">Normalized color product icon used by 2 catalog card(s).</desc>
  <metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <rdf:Description rdf:about="">
      <dc:title>YamlHelper — color</dc:title>
      <dc:description>Normalized catalog product icon; assigned to 2 product card(s); 512×512 transparent canvas; 12.5% safe area.</dc:description>
      <dc:creator>MicroLight</dc:creator>
      <dc:source>https://downloads.marketplace.jetbrains.com/files/26760/745764/icon/default.svg</dc:source>
      <dc:date>2026-08-18</dc:date>
      <dc:rights>Publisher-provided Marketplace icon; copyright and trademark rights remain with the plugin publisher.</dc:rights>
      <dc:identifier>jetbrains-yamlhelper__color</dc:identifier>
    </rdf:Description>
  </rdf:RDF>
</metadata>
  <g clip-path="url(#bizsoft-safe-clip)"><svg x="65" y="65" width="382" height="382" viewBox="0 0 40 40" preserveAspectRatio="xMidYMid meet"><!-- 背景渐变 -->
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6EE7B7"/>
            <stop offset="50%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#9333EA"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
            <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
            <feMerge>
                <feMergeNode in="offsetBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 图标背景 -->
    <rect width="40" height="40" fill="url(#gradient)" rx="10" filter="url(#shadow)"/>

    <!-- 树状结构 -->
    <g stroke="#FFFFFF" stroke-width="1.5" fill="none">
        <!-- 主干 -->
        <line x1="20" y1="4" x2="20" y2="20"/>
        <!-- 分支 -->
        <line x1="20" y1="12" x2="8" y2="24"/>
        <line x1="20" y1="12" x2="32" y2="24"/>
        <line x1="20" y1="20" x2="16" y2="28"/>
        <line x1="20" y1="20" x2="24" y2="28"/>
    </g>

    <!-- 工具名称 -->
    <text x="6" y="36" font-family="Arial, sans-serif" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
        YAML Helper
    </text>
</svg>
</g></svg>