# Контентный объект: оплата софта картами сотрудников
slug: karta-sotrudnika
title: Карта сотрудника как способ оплаты софта
question: Во сколько компании обходятся подписки, оформленные на сотрудников
methodology: Совокупная стоимость владения подпиской для компании (5 компонентов)
thesis: |
  Способ покупки ПО сравнивают не по цене лицензии, а по совокупной стоимости
  владения для компании: стоимость подписки + возможный простой +
  восстановление доступа + административные затраты + стоимость
  неиспользуемых лицензий.
  Тезис серии — развивать в следующих материалах.
status: |
  dzen — финальная версия №1, к публикации (четыре круга ревью: 7,5 → 8,8 → 9,2 → 9,4);
  master — расширенная версия с расчётной моделью, НЕ публикуется до заключения
  юриста и налогового консультанта (налоговые параметры не верифицированы)
reference: эталон серии BIZSoft в Дзене

keywords:
  - оплата софта картой сотрудника
  - компенсация расходов сотруднику на подписку
  - подписки на зарубежное ПО для компании
  - совокупная стоимость подписки
  - инвентаризация подписок

